const P2K=[{"t":"Das System der Krankenversicherung","s":"Come funziona l'assicurazione malattia in Svizzera","p":[{"s":[["In der Schweiz muss jede Person, die hier wohnt, eine Krankenversicherung haben.","In Svizzera ogni persona che vi risiede deve avere un'assicurazione malattia."],["Man spricht von der obligatorischen Grundversicherung.","Si parla di assicurazione di base obbligatoria."],["Sie ist im Krankenversicherungsgesetz, kurz KVG, geregelt.","È regolata dalla legge sull'assicurazione malattia, abbreviata KVG (in italiano LAMal)."]]},{"s":[["Wer neu in die Schweiz zieht, hat drei Monate Zeit, sich zu versichern.","Chi si trasferisce in Svizzera ha tre mesi di tempo per assicurarsi."],["Die Versicherung gilt dann rückwirkend ab dem Tag der Einreise.","L'assicurazione vale poi retroattivamente dal giorno dell'arrivo."],["Wer sich zu spät anmeldet, muss unter Umständen einen Prämienzuschlag bezahlen.","Chi si iscrive in ritardo può dover pagare un supplemento sul premio."]]},{"s":[["Die Leistungen der Grundversicherung sind bei allen Krankenkassen gleich.","Le prestazioni dell'assicurazione di base sono uguali presso tutte le casse malati."],["Das Gesetz bestimmt, was bezahlt wird: zum Beispiel Arztbesuche, Medikamente auf der Spezialitätenliste, Laboranalysen, Physiotherapie mit ärztlicher Verordnung und Spitalaufenthalte in der allgemeinen Abteilung eines Listenspitals.","La legge stabilisce che cosa viene pagato: per esempio visite mediche, medicinali dell'elenco delle specialità, analisi di laboratorio, fisioterapia con prescrizione medica e ricoveri nel reparto comune di un ospedale riconosciuto (ospedale in lista)."]]},{"s":[["Der Unterschied zwischen den Kassen liegt also nicht in den Leistungen, sondern im Preis, also in der Prämie, und in der Qualität des Services.","La differenza tra le casse quindi non sta nelle prestazioni, ma nel prezzo, cioè nel premio, e nella qualità del servizio."]]},{"s":[["Jede Krankenkasse muss jede Person in die Grundversicherung aufnehmen, unabhängig von Alter und Gesundheitszustand.","Ogni cassa malati deve accettare chiunque nell'assicurazione di base, indipendentemente da età e stato di salute."],["Es gibt keine Gesundheitsfragen.","Non ci sono domande sulla salute."],["Anders ist es bei den Zusatzversicherungen: Sie sind freiwillig und im Versicherungsvertragsgesetz, dem VVG, geregelt.","Diverso è per le assicurazioni complementari: sono facoltative e regolate dalla legge sul contratto d'assicurazione, la VVG (LCA)."],["Hier darf die Versicherung Gesundheitsfragen stellen, Vorbehalte anbringen oder einen Antrag ablehnen.","Qui l'assicurazione può porre domande sulla salute, inserire riserve o respingere una richiesta."]]},{"s":[["Die Prämie hängt vom Wohnort, also von der Prämienregion, vom Alter, vom Versicherungsmodell und von der Franchise ab.","Il premio dipende dal luogo di residenza, cioè dalla regione di premio, dall'età, dal modello assicurativo e dalla franchigia."],["Es gibt drei Altersgruppen: Kinder bis 18 Jahre, junge Erwachsene von 19 bis 25 Jahren und Erwachsene ab 26 Jahren.","Ci sono tre fasce d'età: bambini fino a 18 anni, giovani adulti da 19 a 25 anni e adulti dai 26 anni."],["Das Einkommen spielt für die Prämie keine Rolle.","Il reddito non ha alcun ruolo nel premio."]]},{"s":[["Personen mit tiefem Einkommen können beim Kanton eine Prämienverbilligung beantragen.","Le persone con reddito basso possono chiedere al cantone una riduzione dei premi."],["Im Kanton Zürich wird diese Verbilligung direkt an die Krankenkasse bezahlt und von der Prämienrechnung abgezogen.","Nel Canton Zurigo la riduzione viene versata direttamente alla cassa malati e detratta dalla fattura del premio."]]}],"box":{"h":"Spiegazione: base contro complementare","html":"<table><tr><th></th><th>Grundversicherung (KVG)</th><th>Zusatzversicherung (VVG)</th></tr>\n<tr><td>Obbligatoria?</td><td>Sì</td><td>No, facoltativa</td></tr>\n<tr><td>La cassa può rifiutarti?</td><td>Mai</td><td>Sì</td></tr>\n<tr><td>Domande sulla salute</td><td>No</td><td>Sì, e possono esserci riserve</td></tr>\n<tr><td>Prestazioni</td><td>Uguali per tutti, fissate dalla legge</td><td>Diverse secondo il contratto</td></tr>\n<tr><td>Esempi</td><td>Medico, ospedale reparto comune, medicinali in lista</td><td>Reparto semiprivato o privato, dentista, occhiali, medicina alternativa, cure all'estero</td></tr></table>\n<p>Frase chiave per il cliente: <i>«Die Grundversicherung ist bei allen Kassen gleich. Sie vergleichen also nur den Preis und den Service.»</i></p>"},"v":[["die Grundversicherung","assicurazione di base"],["die Zusatzversicherung, -en","assicurazione complementare"],["die Prämie, -n","premio"],["die Leistung, -en","prestazione"],["rückwirkend","retroattivo"],["der Prämienzuschlag, -zuschläge","supplemento sul premio"],["die ärztliche Verordnung","prescrizione medica"],["die Spezialitätenliste","elenco delle specialità (medicinali)"],["das Listenspital, -spitäler","ospedale riconosciuto dal cantone"],["der Gesundheitszustand","stato di salute"],["der Vorbehalt, -e","riserva"],["einen Antrag stellen / ablehnen","presentare / respingere una richiesta"],["die Prämienregion, -en","regione di premio"],["die Prämienverbilligung","riduzione dei premi"],["unabhängig von + Dat.","indipendentemente da"]]},{"t":"Die Versicherungsmodelle","s":"I modelli: libera scelta, medico di famiglia, HMO, Telmed","p":[{"s":[["Bei der Grundversicherung kann man nicht nur die Krankenkasse wählen, sondern auch das Versicherungsmodell.","Nell'assicurazione di base non si sceglie solo la cassa malati, ma anche il modello assicurativo."],["Das Modell bestimmt, wie man im Krankheitsfall vorgehen muss.","Il modello stabilisce come bisogna procedere in caso di malattia."],["Wer sich freiwillig einschränkt, bekommt einen Rabatt auf die Prämie.","Chi si limita volontariamente ottiene uno sconto sul premio."],["Je nach Kasse und Modell beträgt dieser Rabatt etwa 10 bis 25 Prozent.","A seconda della cassa e del modello, lo sconto è circa del 10–25 per cento."]]},{"s":[["Im Standardmodell gilt die freie Arztwahl.","Nel modello standard vale la libera scelta del medico."],["Man kann jederzeit direkt zu jedem Arzt oder Spezialisten gehen, zum Beispiel zum Hautarzt oder zum Orthopäden, ohne vorher jemanden zu fragen.","Si può andare in qualsiasi momento direttamente da qualsiasi medico o specialista, per esempio dal dermatologo o dall'ortopedico, senza chiedere prima a nessuno."],["Das ist bequem, aber es ist das teuerste Modell.","È comodo, ma è il modello più caro."]]},{"s":[["Im Hausarztmodell wählt man einen Hausarzt aus einer Liste der Krankenkasse.","Nel modello del medico di famiglia si sceglie un medico da una lista della cassa malati."],["Bei gesundheitlichen Problemen geht man immer zuerst zu ihm.","In caso di problemi di salute si va sempre prima da lui."],["Braucht man einen Spezialisten, stellt der Hausarzt eine Überweisung aus.","Se serve uno specialista, il medico di famiglia rilascia un'impegnativa."],["Ausnahmen gibt es meistens für Notfälle sowie für Kontrollen beim Frauenarzt und beim Augenarzt.","Ci sono di solito eccezioni per le emergenze e per i controlli dal ginecologo e dall'oculista."]]},{"s":[["Im HMO-Modell geht man zuerst in ein HMO-Gesundheitszentrum.","Nel modello HMO si va prima in un centro sanitario HMO."],["Dort arbeiten mehrere Ärztinnen und Ärzte zusammen, oft auch Spezialisten und Therapeuten.","Lì lavorano insieme più medici, spesso anche specialisti e terapisti."],["Das Zentrum koordiniert die ganze Behandlung.","Il centro coordina tutta la cura."],["Das Modell ist meistens das günstigste, aber man muss in der Nähe eines solchen Zentrums wohnen.","Il modello è di solito il più economico, ma bisogna abitare vicino a un centro del genere."]]},{"s":[["Im Telmed-Modell ruft man vor jedem Arztbesuch eine medizinische Beratungsstelle an.","Nel modello Telmed, prima di ogni visita medica si telefona a un centro di consulenza medica."],["Die Fachpersonen am Telefon geben Ratschläge oder sagen, ob und zu welchem Arzt man gehen soll.","Gli specialisti al telefono danno consigli o dicono se e da quale medico andare."],["Das Telefon ist rund um die Uhr erreichbar.","Il telefono è raggiungibile 24 ore su 24."],["Für Menschen, die viel arbeiten oder oft unterwegs sind, ist das praktisch.","Per chi lavora molto o viaggia spesso è pratico."]]},{"s":[["Einige Kassen bieten auch ein Apothekenmodell an: Die erste Anlaufstelle ist eine Partnerapotheke.","Alcune casse offrono anche un modello farmacia: il primo punto di contatto è una farmacia partner."],["Ausserdem gibt es kombinierte Modelle, bei denen man im Krankheitsfall zwischen Hausarzt, HMO-Zentrum und Telefon wählen kann.","Esistono inoltre modelli combinati, in cui in caso di malattia si può scegliere tra medico di famiglia, centro HMO e telefono."]]},{"s":[["Wichtig: Wer die Regeln nicht einhält und zum Beispiel ohne Überweisung direkt zum Spezialisten geht, riskiert, dass die Kasse die Rechnung nicht bezahlt.","Importante: chi non rispetta le regole e va per esempio direttamente dallo specialista senza impegnativa rischia che la cassa non paghi la fattura."],["Bei wiederholten Verstössen kann die Kasse die Person ins teurere Standardmodell zurückversetzen.","In caso di violazioni ripetute la cassa può riportare la persona nel modello standard più caro."],["In einem echten Notfall darf man aber immer direkt ins Spital gehen; man muss die Kasse oder den Hausarzt danach informieren.","In una vera emergenza però si può sempre andare direttamente in ospedale; dopo bisogna informare la cassa o il medico di famiglia."]]},{"s":[["Das Modell kann man in der Regel auf den 1. Januar wechseln.","Di norma il modello si può cambiare per il 1º gennaio."],["Die Mitteilung muss spätestens am 30. November bei der Kasse sein, bei einigen Kassen ist ein Wechsel in ein günstigeres Modell auch bis Ende Dezember möglich.","La comunicazione deve arrivare alla cassa al più tardi il 30 novembre; presso alcune casse il passaggio a un modello più economico è possibile anche fino a fine dicembre."]]}],"box":{"h":"Spiegazione: quale modello per quale cliente?","html":"<table><tr><th>Modello</th><th>Primo contatto</th><th>Sconto indicativo</th><th>Adatto a…</th></tr>\n<tr><td>Standard</td><td>Chiunque</td><td>0 %</td><td>Chi vuole libertà totale o va spesso da più specialisti</td></tr>\n<tr><td>Hausarzt</td><td>Il proprio medico di famiglia</td><td>ca. 10–20 %</td><td>Chi ha già un medico di fiducia</td></tr>\n<tr><td>HMO</td><td>Centro HMO</td><td>ca. 15–25 %</td><td>Chi abita vicino a un centro</td></tr>\n<tr><td>Telmed</td><td>Telefono / app</td><td>ca. 10–20 %</td><td>Giovani, lavoratori, chi si sposta molto</td></tr>\n<tr><td>Apotheke</td><td>Farmacia partner</td><td>ca. 10–20 %</td><td>Disturbi lievi, persone sane</td></tr></table>\n<p>Le eccezioni (ginecologo, oculista, pediatra, emergenze) cambiano da cassa a cassa: si leggono nelle <b>Versicherungsbedingungen</b> del modello.</p>"},"v":[["die freie Arztwahl","libera scelta del medico"],["der Hausarzt / die Hausärztin","medico di famiglia"],["die Überweisung, -en","impegnativa, invio dallo specialista"],["eine Überweisung ausstellen","rilasciare un'impegnativa"],["die erste Anlaufstelle","primo punto di contatto"],["das Gesundheitszentrum, -zentren","centro sanitario"],["die Beratungsstelle, -n","centro di consulenza"],["rund um die Uhr","24 ore su 24"],["die Regeln einhalten","rispettare le regole"],["der Verstoss, Verstösse","violazione"],["der Notfall, Notfälle","emergenza"],["der Frauenarzt / Gynäkologe","ginecologo"],["der Augenarzt","oculista"],["die Versicherungsbedingungen (Pl.)","condizioni d'assicurazione"],["sich einschränken","limitarsi"]]},{"t":"Franchise, Selbstbehalt und Spitalbeitrag","s":"La partecipazione ai costi e come si calcola","p":[{"s":[["Die Krankenkasse bezahlt nicht alles.","La cassa malati non paga tutto."],["Die versicherte Person beteiligt sich an den Kosten.","La persona assicurata partecipa ai costi."],["Diese Kostenbeteiligung besteht aus drei Teilen: der Franchise, dem Selbstbehalt und dem Beitrag an die Spitalkosten.","Questa partecipazione ai costi è composta da tre parti: la franchigia, l'aliquota percentuale e il contributo ai costi ospedalieri."]]},{"s":[["Die Franchise ist ein fester Betrag pro Kalenderjahr, den man selbst bezahlt, bevor die Kasse etwas übernimmt.","La franchigia è un importo fisso per anno civile che si paga da sé prima che la cassa si assuma qualcosa."],["Erwachsene können zwischen 300, 500, 1000, 1500, 2000 und 2500 Franken wählen.","Gli adulti possono scegliere tra 300, 500, 1000, 1500, 2000 e 2500 franchi."],["Für Kinder gibt es Franchisen von 0 bis 600 Franken.","Per i bambini ci sono franchigie da 0 a 600 franchi."],["Je höher die Franchise, desto tiefer die Prämie.","Più alta è la franchigia, più basso è il premio."]]},{"s":[["Sobald die Franchise erreicht ist, bezahlt man noch zehn Prozent der weiteren Kosten.","Una volta raggiunta la franchigia, si paga ancora il dieci per cento dei costi successivi."],["Das ist der Selbstbehalt.","È l'aliquota percentuale (Selbstbehalt)."],["Er ist pro Jahr begrenzt: höchstens 700 Franken für Erwachsene und 350 Franken für Kinder.","È limitata per anno: al massimo 700 franchi per gli adulti e 350 franchi per i bambini."]]},{"s":[["Bei Medikamenten kann der Selbstbehalt höher sein: Wer ein Originalpräparat wählt, obwohl es ein deutlich günstigeres Generikum gibt, bezahlt in vielen Fällen 40 Prozent statt 10 Prozent.","Per i medicinali l'aliquota può essere più alta: chi sceglie un preparato originale, anche se esiste un generico nettamente più economico, in molti casi paga il 40 per cento invece del 10 per cento."]]},{"s":[["Bei einem Spitalaufenthalt bezahlen Erwachsene zusätzlich 15 Franken pro Tag.","In caso di ricovero gli adulti pagano in più 15 franchi al giorno."],["Kinder, junge Erwachsene in Ausbildung und Frauen bei Mutterschaft sind von diesem Beitrag befreit.","Bambini, giovani adulti in formazione e donne in maternità sono esonerati da questo contributo."]]},{"s":[["Für die Berechnung zählt das Datum der Behandlung, nicht das Datum der Rechnung.","Per il calcolo conta la data della cura, non la data della fattura."],["Am 1. Januar beginnt alles wieder bei null.","Il 1º gennaio tutto riparte da zero."],["Wer also im Dezember eine teure Behandlung hat, hat Glück, wenn die Franchise schon aufgebraucht ist.","Chi ha una cura costosa a dicembre è fortunato se la franchigia è già esaurita."]]},{"s":[["Die Franchise kann man auf den 1. Januar ändern.","La franchigia si può cambiare per il 1º gennaio."],["Wer eine tiefere Franchise möchte, muss das bis spätestens 30. November mitteilen.","Chi vuole una franchigia più bassa deve comunicarlo al più tardi entro il 30 novembre."],["Eine höhere Franchise kann man bis 31. Dezember wählen.","Una franchigia più alta si può scegliere fino al 31 dicembre."]]}],"box":{"h":"Spiegazione: la formula, passo per passo","html":"<p><b>1.</b> Costi dell'anno ≤ franchigia → paghi tutto tu.<br><b>2.</b> Costi oltre la franchigia → paghi la franchigia + 10 % del resto, ma il 10 % al massimo 700 CHF.<br><b>3.</b> Il massimo che un adulto paga in un anno (senza ospedale) = <b>franchigia + 700 CHF</b>.</p>\n<table><tr><th>Esempio</th><th class=\"n\">Costi</th><th class=\"n\">Franchigia</th><th class=\"n\">10 %</th><th class=\"n\">Paghi tu</th><th class=\"n\">Paga la cassa</th></tr>\n<tr><td>A</td><td class=\"n\">4'000</td><td class=\"n\">300</td><td class=\"n\">370</td><td class=\"n\">670</td><td class=\"n\">3'330</td></tr>\n<tr><td>B</td><td class=\"n\">4'000</td><td class=\"n\">2'500</td><td class=\"n\">150</td><td class=\"n\">2'650</td><td class=\"n\">1'350</td></tr>\n<tr><td>C</td><td class=\"n\">800</td><td class=\"n\">2'500</td><td class=\"n\">0</td><td class=\"n\">800</td><td class=\"n\">0</td></tr>\n<tr><td>D</td><td class=\"n\">20'000</td><td class=\"n\">1'500</td><td class=\"n\">700 (tetto)</td><td class=\"n\">2'200</td><td class=\"n\">17'800</td></tr></table>\n<p>Calcolo di A in tedesco: <i>«4000 minus 300 Franchise ergibt 3700. Davon zehn Prozent sind 370 Franken Selbstbehalt. Insgesamt bezahlen Sie 670 Franken.»</i></p>\n<p><b>Quale franchigia conviene?</b> Per legge lo sconto sul premio tra 300 e 2500 può essere al massimo il 70 % del rischio in più, cioè circa 1'540 CHF all'anno. Per questo la soglia sta attorno ai <b>2'000 CHF di costi medici annui</b>: sotto conviene 2'500, sopra (malattie croniche, gravidanza pianificata, operazioni) conviene 300. Le franchigie intermedie raramente sono la scelta migliore.</p>"},"calc":true,"v":[["die Kostenbeteiligung","partecipazione ai costi"],["die Franchise, -n","franchigia"],["der Selbstbehalt","aliquota percentuale (10 %)"],["der Spitalbeitrag / Beitrag an die Spitalkosten","contributo ospedaliero (15 CHF/giorno)"],["das Kalenderjahr","anno civile"],["übernehmen","assumersi, pagare (la cassa)"],["die Franchise ist erreicht / aufgebraucht","la franchigia è raggiunta / esaurita"],["begrenzt sein auf + Akk.","essere limitato a"],["das Originalpräparat","medicinale originale"],["das Generikum, Generika","generico"],["befreit sein von + Dat.","essere esonerato da"],["je höher …, desto tiefer …","più alto…, più basso…"],["mitteilen","comunicare"],["ergeben","risultare, dare (in un calcolo)"]]},{"t":"Schwangerschaft und Geburt","s":"Gravidanza, parto e neonato: cosa paga la cassa","p":[{"s":[["Eine Schwangerschaft ist keine Krankheit.","Una gravidanza non è una malattia."],["Deshalb kennt das KVG besondere Leistungen bei Mutterschaft.","Per questo la LAMal prevede prestazioni speciali di maternità."],["Für diese Mutterschaftsleistungen bezahlt die Frau keine Franchise und keinen Selbstbehalt, und zwar vom Beginn der Schwangerschaft an.","Per queste prestazioni la donna non paga né franchigia né aliquota, e questo fin dall'inizio della gravidanza."]]},{"s":[["Bei einer normalen Schwangerschaft bezahlt die Grundversicherung sieben Kontrolluntersuchungen beim Arzt oder bei der Hebamme sowie zwei Ultraschalluntersuchungen: die erste zwischen der 11. und der 14. Woche, die zweite zwischen der 20. und der 23. Woche.","In una gravidanza normale l'assicurazione di base paga sette controlli dal medico o dalla levatrice e due ecografie: la prima tra l'11ª e la 14ª settimana, la seconda tra la 20ª e la 23ª."],["Bei einer Risikoschwangerschaft entscheidet die Ärztin, wie viele Kontrollen nötig sind.","In una gravidanza a rischio è la dottoressa a decidere quanti controlli servono."]]},{"s":[["Ab der 13. Schwangerschaftswoche bis acht Wochen nach der Geburt gilt eine zusätzliche Regel: Auch für normale Krankheiten muss die Frau in dieser Zeit keine Kostenbeteiligung bezahlen.","Dalla 13ª settimana di gravidanza fino a otto settimane dopo il parto vale una regola in più: anche per le malattie normali la donna in questo periodo non paga alcuna partecipazione ai costi."],["Hat sie zum Beispiel in der 20. Woche eine Grippe, bezahlt die Kasse den Arztbesuch ohne Franchise und ohne Selbstbehalt.","Se per esempio alla 20ª settimana ha l'influenza, la cassa paga la visita senza franchigia e senza aliquota."]]},{"s":[["Es gibt aber Ausnahmen, zum Beispiel Zahnbehandlungen und gewisse Präventionsleistungen.","Ci sono però eccezioni, per esempio le cure dentarie e alcune prestazioni di prevenzione."],["Und vor der 13. Woche werden Behandlungen, die nicht zu den Mutterschaftsleistungen gehören, normal mit Franchise und Selbstbehalt abgerechnet.","E prima della 13ª settimana le cure che non fanno parte delle prestazioni di maternità vengono conteggiate normalmente con franchigia e aliquota."],["Deshalb ist es wichtig, die Schwangerschaft früh der Krankenkasse zu melden.","Per questo è importante comunicare presto la gravidanza alla cassa malati."]]},{"s":[["Die Geburt ist gedeckt, im Spital, im Geburtshaus oder zu Hause, jeweils in der allgemeinen Abteilung.","Il parto è coperto, in ospedale, in una casa del parto o a domicilio, sempre in reparto comune."],["Auch ein Kaiserschnitt wird bezahlt.","Anche un cesareo viene pagato."],["Für einen Geburtsvorbereitungskurs übernimmt die Kasse 150 Franken.","Per un corso di preparazione al parto la cassa si assume 150 franchi."],["Nach der Geburt bezahlt sie drei Stillberatungen und eine Nachkontrolle sechs bis zehn Wochen nach der Geburt.","Dopo il parto paga tre consulenze sull'allattamento e un controllo post-parto da sei a dieci settimane dopo la nascita."]]},{"s":[["Bis 56 Tage nach der Geburt kann eine Hebamme Mutter und Baby zu Hause besuchen.","Fino a 56 giorni dopo il parto una levatrice può visitare mamma e bebè a casa."],["Nach einer ersten Geburt, einer Frühgeburt, einer Mehrlingsgeburt oder einem Kaiserschnitt sind bis zu 16 Hausbesuche gedeckt, sonst bis zu 10. Mit ärztlicher Verordnung sind auch mehr Besuche möglich.","Dopo un primo parto, un parto prematuro, un parto plurigemellare o un cesareo sono coperte fino a 16 visite a domicilio, altrimenti fino a 10. Con prescrizione medica sono possibili anche più visite."]]},{"s":[["Das Neugeborene braucht eine eigene Krankenversicherung.","Il neonato ha bisogno di una propria assicurazione malattia."],["Die Eltern müssen das Kind innerhalb von drei Monaten nach der Geburt anmelden; dann gilt die Versicherung rückwirkend ab Geburt.","I genitori devono iscrivere il bambino entro tre mesi dalla nascita; allora l'assicurazione vale retroattivamente dalla nascita."],["Für Zusatzversicherungen empfiehlt es sich, das Kind schon vor der Geburt anzumelden.","Per le complementari è consigliabile iscrivere il bambino già prima della nascita."],["So stellt die Versicherung keine Gesundheitsfragen, und das Kind ist auch versichert, wenn es mit einer Krankheit zur Welt kommt.","Così l'assicurazione non fa domande sulla salute e il bambino è assicurato anche se nasce con una malattia."]]},{"s":[["Achtung: Der Lohnersatz während des Mutterschaftsurlaubs kommt nicht von der Krankenkasse.","Attenzione: la sostituzione del salario durante il congedo maternità non viene dalla cassa malati."],["Erwerbstätige Mütter erhalten 14 Wochen lang 80 Prozent ihres Lohnes aus der Erwerbsersatzordnung, der EO, mit einem Höchstbetrag pro Tag.","Le madri che lavorano ricevono per 14 settimane l'80 per cento del salario dalle indennità per perdita di guadagno, la EO (IPG), con un importo massimo giornaliero."],["Der Antrag läuft über den Arbeitgeber oder die Ausgleichskasse.","La richiesta passa dal datore di lavoro o dalla cassa di compensazione."]]}],"box":{"h":"Spiegazione: la linea del tempo della gravidanza","html":"<table><tr><th>Periodo</th><th>Prestazioni di maternità</th><th>Altre malattie</th></tr>\n<tr><td>Settimane 1–12</td><td>Gratis (controlli, ecografia 11–14)</td><td>Con franchigia e 10 %</td></tr>\n<tr><td>Settimana 13 → 8 settimane dopo il parto</td><td>Gratis</td><td><b>Gratis</b> (tranne dentista e alcune prevenzioni)</td></tr>\n<tr><td>Dopo l'8ª settimana post-parto</td><td>Controllo post-parto gratis</td><td>Di nuovo con franchigia e 10 %</td></tr></table>\n<p><b>Consigli per la consulenza:</b> abbassare la franchigia solo per il parto di solito non serve, perché parto e controlli sono già esenti. Più importante: iscrivere il bambino <b>prima della nascita</b> alla complementare e verificare se la mamma ha una complementare ospedaliera (reparto semiprivato, camera singola).</p>\n<p>Frase utile: <i>«Ab der 13. Woche bis acht Wochen nach der Geburt bezahlen Sie keine Franchise und keinen Selbstbehalt.»</i></p>"},"v":[["die Schwangerschaft","gravidanza"],["schwanger sein","essere incinta"],["die Mutterschaft","maternità"],["die Mutterschaftsleistungen (Pl.)","prestazioni di maternità"],["die Hebamme, -n","levatrice, ostetrica"],["die Kontrolluntersuchung, -en","visita di controllo"],["der Ultraschall","ecografia"],["die Risikoschwangerschaft","gravidanza a rischio"],["die Geburt / gebären","parto / partorire"],["der Kaiserschnitt","taglio cesareo"],["das Geburtshaus","casa del parto"],["der Geburtsvorbereitungskurs","corso preparto"],["die Stillberatung","consulenza sull'allattamento"],["das Wochenbett","puerperio"],["das Neugeborene","neonato"],["die Frühgeburt","parto prematuro"],["zur Welt kommen","venire al mondo"],["der Mutterschaftsurlaub","congedo maternità"],["die Ausgleichskasse","cassa di compensazione"]]},{"t":"Unfall und Krankenkasse","s":"Infortuni: quando paga il datore di lavoro e quando la cassa","p":[{"s":[["Wer mindestens acht Stunden pro Woche beim gleichen Arbeitgeber arbeitet, ist über den Arbeitgeber nach dem Unfallversicherungsgesetz, dem UVG, versichert, und zwar gegen Berufsunfälle und gegen Nichtberufsunfälle, also auch in der Freizeit.","Chi lavora almeno otto ore a settimana per lo stesso datore di lavoro è assicurato tramite il datore secondo la legge sull'assicurazione contro gli infortuni, la UVG (LAINF), sia contro gli infortuni professionali sia contro quelli non professionali, quindi anche nel tempo libero."]]},{"s":[["Die Unfallversicherung nach UVG kennt keine Franchise und keinen Selbstbehalt.","L'assicurazione infortuni secondo la LAINF non prevede né franchigia né aliquota."],["Deshalb kann man die Unfalldeckung bei der Krankenkasse sistieren, also ausschliessen, und spart so einige Prozent der Prämie.","Per questo si può sospendere la copertura infortuni presso la cassa malati, cioè escluderla, e risparmiare così qualche percento del premio."]]},{"s":[["Wer weniger als acht Stunden pro Woche arbeitet, ist über den Arbeitgeber nur bei Berufsunfällen versichert.","Chi lavora meno di otto ore a settimana è assicurato tramite il datore solo per gli infortuni professionali."],["Für Unfälle in der Freizeit braucht diese Person die Unfalldeckung der Krankenkasse.","Per gli infortuni nel tempo libero questa persona ha bisogno della copertura infortuni della cassa malati."],["Das gilt auch für Selbständige, Studierende, Hausfrauen und Hausmänner sowie Rentnerinnen und Rentner.","Lo stesso vale per indipendenti, studenti, casalinghe e casalinghi e pensionati."]]},{"s":[["Wer die Stelle verliert oder kündigt, bleibt noch 31 Tage nach dem letzten Arbeitstag über den Arbeitgeber versichert.","Chi perde o lascia il lavoro rimane assicurato tramite il datore ancora 31 giorni dopo l'ultimo giorno di lavoro."],["Danach muss man die Unfalldeckung bei der Krankenkasse wieder einschliessen, oder man schliesst vor Ablauf der 31 Tage eine Abredeversicherung ab, die bis zu sechs Monate verlängert.","Poi bisogna reinserire la copertura infortuni nella cassa malati, oppure stipulare prima della scadenza dei 31 giorni un'assicurazione per accordo speciale, che prolunga fino a sei mesi."],["Arbeitslose sind über die Arbeitslosenversicherung gegen Unfall versichert.","I disoccupati sono assicurati contro gli infortuni tramite l'assicurazione contro la disoccupazione."]]}],"box":{"h":"Spiegazione: la domanda da fare sempre","html":"<p>Durante una consulenza chiedi sempre: <i>«Arbeiten Sie mindestens acht Stunden pro Woche beim gleichen Arbeitgeber?»</i></p><ul><li><b>Sì</b> → «Dann können wir die Unfalldeckung bei der Krankenkasse ausschliessen.»</li><li><b>No / indipendente / pensionato</b> → la copertura infortuni nella cassa malati deve restare inclusa.</li><li><b>Cambio lavoro o licenziamento</b> → ricordare i 31 giorni e reinserire la copertura.</li></ul>"},"v":[["der Unfall, Unfälle","infortunio"],["der Berufsunfall","infortunio professionale"],["der Nichtberufsunfall","infortunio non professionale"],["die Unfalldeckung","copertura infortuni"],["sistieren / ausschliessen","sospendere / escludere"],["einschliessen","includere"],["der/die Selbständige","lavoratore indipendente"],["die Stelle verlieren","perdere il posto"],["die Abredeversicherung","assicurazione per accordo speciale"],["vor Ablauf der Frist","prima della scadenza"],["die Arbeitslosenversicherung","assicurazione contro la disoccupazione"]]},{"t":"Rechnungen und Leistungsabrechnung","s":"Fatture, rimborsi e conteggi della cassa","p":[{"s":[["Es gibt zwei Abrechnungssysteme.","Esistono due sistemi di fatturazione."],["Beim System Tiers garant schickt der Arzt die Rechnung an den Patienten.","Nel sistema terzo garante (Tiers garant) il medico invia la fattura al paziente."],["Der Patient bezahlt sie und reicht den Rückforderungsbeleg bei der Krankenkasse ein, heute meistens über die App oder das Kundenportal.","Il paziente la paga e inoltra il giustificativo di rimborso alla cassa, oggi per lo più tramite l'app o il portale clienti."],["Die Kasse erstattet dann ihren Anteil.","La cassa poi rimborsa la sua parte."]]},{"s":[["Beim System Tiers payant geht die Rechnung direkt an die Krankenkasse, zum Beispiel bei Spitalaufenthalten und in der Apotheke.","Nel sistema terzo pagante (Tiers payant) la fattura va direttamente alla cassa malati, per esempio per i ricoveri e in farmacia."],["Die Kasse bezahlt den Arzt oder das Spital und schickt dem Patienten später eine Leistungsabrechnung.","La cassa paga il medico o l'ospedale e manda in seguito al paziente un conteggio delle prestazioni."],["Darin steht, welchen Betrag er wegen Franchise und Selbstbehalt zurückzahlen muss.","Lì c'è scritto quale importo deve restituire a causa di franchigia e aliquota."]]},{"s":[["Auch wenn man die Franchise noch nicht erreicht hat, soll man alle Rechnungen einreichen.","Anche se non si è ancora raggiunta la franchigia, bisogna inoltrare tutte le fatture."],["Nur so weiss die Kasse, wie viel man im laufenden Jahr schon selbst bezahlt hat, und kann richtig rechnen, sobald die Franchise erreicht ist.","Solo così la cassa sa quanto si è già pagato da sé nell'anno in corso e può calcolare correttamente appena la franchigia è raggiunta."]]},{"s":[["Man sollte jede Leistungsabrechnung kontrollieren: Stimmt das Datum der Behandlung?","Bisogna controllare ogni conteggio delle prestazioni: la data della cura è giusta?"],["Wurde die Franchise richtig abgezogen?","La franchigia è stata dedotta correttamente?"],["Gilt bei einer Schwangeren schon die Befreiung ab der 13. Woche?","Per una donna incinta vale già l'esenzione dalla 13ª settimana?"],["Bei einem Fehler kann man schriftlich eine Korrektur verlangen.","In caso di errore si può chiedere una correzione per iscritto."]]}],"box":{"h":"Spiegazione: lettera di correzione (modello)","html":"<p><i>Sehr geehrte Damen und Herren<br>In der Leistungsabrechnung vom 3. Oktober wurde mir eine Franchise von 180 Franken belastet. Zum Zeitpunkt der Behandlung befand ich mich in der 22. Schwangerschaftswoche. Ich bitte Sie deshalb, die Abrechnung zu korrigieren und mir den Betrag gutzuschreiben.<br>Freundliche Grüsse</i></p><p>Nota lo stile svizzero: niente virgola dopo «Sehr geehrte Damen und Herren», «Grüsse» con ss.</p>"},"v":[["die Rechnung einreichen","inoltrare la fattura"],["der Rückforderungsbeleg","giustificativo di rimborso"],["erstatten / die Rückerstattung","rimborsare / rimborso"],["der Anteil, -e","quota, parte"],["die Leistungsabrechnung","conteggio delle prestazioni"],["abziehen","detrarre"],["belasten","addebitare"],["gutschreiben","accreditare"],["das Kundenportal","portale clienti"],["im laufenden Jahr","nell'anno in corso"],["eine Korrektur verlangen","chiedere una correzione"]]},{"t":"Wechseln und kündigen","s":"Disdetta, cambio di cassa e scadenze","p":[{"s":[["Ende September veröffentlicht der Bund die Prämien für das nächste Jahr.","A fine settembre la Confederazione pubblica i premi per l'anno successivo."],["Spätestens Ende Oktober müssen die Kassen ihren Versicherten den neuen Prämienbrief schicken.","Al più tardi entro fine ottobre le casse devono inviare ai loro assicurati la nuova lettera dei premi."],["Dann beginnt die Zeit der Vergleiche.","Allora inizia il periodo dei confronti."]]},{"s":[["Wer die Kasse wechseln will, muss die Grundversicherung bis 30. November kündigen.","Chi vuole cambiare cassa deve disdire l'assicurazione di base entro il 30 novembre."],["Der Brief muss an diesem Tag bei der Kasse angekommen sein; der Poststempel genügt nicht.","La lettera deve essere arrivata alla cassa in quel giorno; il timbro postale non basta."],["Am besten schickt man die Kündigung eingeschrieben und einige Tage früher.","È meglio inviare la disdetta per raccomandata e qualche giorno prima."]]},{"s":[["Die richtige Reihenfolge ist wichtig: zuerst bei der neuen Kasse anmelden, dann bei der alten kündigen.","L'ordine giusto è importante: prima iscriversi alla nuova cassa, poi disdire la vecchia."],["Die alte Versicherung endet erst, wenn die neue Kasse bestätigt hat, dass man ohne Unterbruch versichert ist.","La vecchia assicurazione finisce solo quando la nuova cassa ha confermato che si è assicurati senza interruzione."]]},{"s":[["Mit der ordentlichen Franchise von 300 Franken im Standardmodell kann man zusätzlich auf Ende Juni wechseln.","Con la franchigia ordinaria di 300 franchi nel modello standard si può cambiare anche per fine giugno."],["Die Kündigungsfrist beträgt dann drei Monate, die Kündigung muss also bis 31. März bei der Kasse sein.","Il termine di disdetta è allora di tre mesi, la disdetta deve quindi arrivare alla cassa entro il 31 marzo."],["Wer Prämien oder Kostenbeteiligungen nicht bezahlt hat und betrieben wurde, kann erst wechseln, wenn alles bezahlt ist.","Chi non ha pagato premi o partecipazioni ai costi e ha ricevuto un'esecuzione può cambiare solo quando tutto è pagato."]]},{"s":[["Die Zusatzversicherung ist ein separater Vertrag.","La complementare è un contratto separato."],["Man kann sie bei der bisherigen Kasse behalten, auch wenn man die Grundversicherung wechselt.","Si può tenerla presso la cassa attuale anche se si cambia l'assicurazione di base."],["Die Kündigungsfristen stehen im Vertrag; oft sind es drei Monate vor Ende des Versicherungsjahres.","I termini di disdetta sono nel contratto; spesso sono tre mesi prima della fine dell'anno assicurativo."],["Wichtig: Eine Zusatzversicherung kündigt man nie, bevor die neue Versicherung den Antrag schriftlich angenommen hat.","Importante: una complementare non si disdice mai prima che la nuova assicurazione abbia accettato la richiesta per iscritto."]]}],"box":{"h":"Spiegazione: lettera di disdetta (modello)","html":"<p><i>Einschreiben<br><br>Kündigung der obligatorischen Grundversicherung<br>Versichertennummer: 80756…<br><br>Sehr geehrte Damen und Herren<br>Hiermit kündige ich meine obligatorische Grundversicherung nach KVG fristgerecht per 31. Dezember 2026. Die Bestätigung meiner neuen Krankenkasse erhalten Sie direkt von ihr. Meine Zusatzversicherungen bleiben unverändert bestehen.<br>Bitte bestätigen Sie mir die Kündigung schriftlich.<br><br>Freundliche Grüsse</i></p>\n<table><tr><th>Scadenza</th><th>Cosa</th></tr><tr><td>Fine settembre</td><td>Pubblicazione premi</td></tr><tr><td>31 marzo</td><td>Disdetta per fine giugno (solo franchigia 300, modello standard)</td></tr><tr><td>30 novembre</td><td>Disdetta base / franchigia più bassa / cambio modello</td></tr><tr><td>31 dicembre</td><td>Franchigia più alta</td></tr></table>"},"v":[["kündigen / die Kündigung","disdire / disdetta"],["fristgerecht","nei termini"],["die Kündigungsfrist","termine di disdetta"],["eingeschrieben / das Einschreiben","raccomandata"],["der Poststempel","timbro postale"],["der Prämienbrief","lettera dei premi"],["ohne Unterbruch","senza interruzione"],["die Reihenfolge","ordine, sequenza"],["betrieben werden / die Betreibung","ricevere un'esecuzione / esecuzione"],["bestehen bleiben","restare in vigore"],["den Antrag annehmen","accettare la richiesta"],["die Versichertennummer","numero d'assicurato"]]},{"t":"Geschichte: Ein Jahr mit Familie Ferreira","s":"Una storia che unisce tutti i temi","p":[{"s":[["Im März ziehen Ana und Paulo Ferreira aus Lissabon nach Zürich.","A marzo Ana e Paulo Ferreira si trasferiscono da Lisbona a Zurigo."],["Paulo hat eine Stelle als Elektriker gefunden, Ana sucht noch Arbeit.","Paulo ha trovato un posto da elettricista, Ana cerca ancora lavoro."],["In den ersten Wochen gibt es viel zu tun: Wohnung, Gemeinde, Bank.","Nelle prime settimane c'è tanto da fare: appartamento, comune, banca."],["An die Krankenkasse denken sie erst im Mai.","Alla cassa malati pensano solo a maggio."]]},{"s":[["Zum Glück sind sie noch innerhalb der Frist von drei Monaten.","Per fortuna sono ancora entro il termine di tre mesi."],["Eine Beraterin erklärt ihnen das System und vergleicht die Prämien.","Una consulente spiega loro il sistema e confronta i premi."],["Weil Paulo selten krank ist und viel arbeitet, wählt er das Telmed-Modell mit einer Franchise von 2500 Franken.","Poiché Paulo è raramente malato e lavora molto, sceglie il modello Telmed con una franchigia di 2500 franchi."],["Seine Unfalldeckung schliesst er aus, denn er ist über seinen Arbeitgeber versichert.","Esclude la copertura infortuni, perché è assicurato tramite il datore di lavoro."]]},{"s":[["Ana möchte bald ein Kind.","Ana vorrebbe presto un figlio."],["Die Beraterin empfiehlt ihr das Hausarztmodell und erklärt, dass Mutterschaftsleistungen ohne Franchise bezahlt werden.","La consulente le consiglia il modello medico di famiglia e spiega che le prestazioni di maternità vengono pagate senza franchigia."],["Ana wählt trotzdem eine Franchise von 300 Franken, weil sie eine chronische Allergie hat und regelmässig Medikamente braucht.","Ana sceglie comunque una franchigia di 300 franchi, perché ha un'allergia cronica e ha bisogno regolarmente di medicinali."],["Weil sie nicht arbeitet, bleibt ihre Unfalldeckung eingeschlossen.","Poiché non lavora, la sua copertura infortuni resta inclusa."]]},{"s":[["Im Juli ist Ana schwanger.","A luglio Ana è incinta."],["Sie meldet die Schwangerschaft sofort ihrer Kasse und meldet das Baby auch gleich für die Zusatzversicherung an, noch vor der Geburt.","Comunica subito la gravidanza alla cassa e iscrive subito il bebè anche alla complementare, ancora prima della nascita."],["Im Oktober, in der 16. Woche, bekommt sie eine starke Bronchitis.","A ottobre, alla 16ª settimana, prende una forte bronchite."],["Der Arztbesuch und die Medikamente kosten 280 Franken, aber sie bezahlt nichts: Ab der 13. Woche gibt es keine Kostenbeteiligung.","La visita e i medicinali costano 280 franchi, ma lei non paga niente: dalla 13ª settimana non c'è partecipazione ai costi."]]},{"s":[["Paulo hat weniger Glück.","Paulo ha meno fortuna."],["Im September verletzt er sich beim Fussballspielen am Knie.","A settembre si fa male al ginocchio giocando a calcio."],["Die Behandlung kostet über 6000 Franken, doch die Unfallversicherung seines Arbeitgebers übernimmt alles, ohne Franchise.","La cura costa più di 6000 franchi, ma l'assicurazione infortuni del suo datore di lavoro paga tutto, senza franchigia."],["Paulo ist froh, dass er die Unfalldeckung richtig geregelt hat.","Paulo è contento di aver regolato correttamente la copertura infortuni."]]},{"s":[["Ende September kommen die neuen Prämien.","A fine settembre arrivano i nuovi premi."],["Paulos Prämie steigt um acht Prozent.","Il premio di Paulo aumenta dell'otto per cento."],["Er vergleicht und findet eine Kasse, die 40 Franken pro Monat günstiger ist.","Lui confronta e trova una cassa che costa 40 franchi in meno al mese."],["Er meldet sich zuerst bei der neuen Kasse an und schickt dann am 15. November die Kündigung eingeschrieben an die alte.","Prima si iscrive alla nuova cassa e poi il 15 novembre invia la disdetta per raccomandata alla vecchia."],["Seine Zusatzversicherung behält er.","La complementare la tiene."]]},{"s":[["Im darauffolgenden März kommt die kleine Sofia zur Welt, per Kaiserschnitt.","Il marzo successivo nasce la piccola Sofia, con un cesareo."],["Die Hebamme kommt in den ersten Wochen sechzehn Mal nach Hause, weil es Anas erste Geburt war.","La levatrice viene a casa sedici volte nelle prime settimane, perché era il primo parto di Ana."],["Die Kasse bezahlt alles.","La cassa paga tutto."],["Paulo meldet Sofia offiziell in der Grundversicherung an, und die Familie beantragt beim Kanton eine Prämienverbilligung, weil Ana noch kein Einkommen hat.","Paulo iscrive ufficialmente Sofia all'assicurazione di base e la famiglia chiede al cantone una riduzione dei premi, perché Ana non ha ancora un reddito."]]}],"box":{"h":"Domande sulla storia (rispondi a voce, in tedesco)","html":"<ul><li>Warum wählt Paulo eine hohe Franchise?</li><li>Warum braucht Ana eine Unfalldeckung bei der Krankenkasse, Paulo aber nicht?</li><li>Warum bezahlt Ana für die Bronchitis nichts?</li><li>Was macht Paulo, bevor er die alte Kasse kündigt?</li><li>Warum meldet Ana das Baby schon vor der Geburt an?</li><li>Wie viele Hausbesuche der Hebamme sind gedeckt, und warum?</li></ul>"},"v":[["umziehen / ziehen nach","trasferirsi"],["die Gemeinde","comune"],["die Frist einhalten","rispettare il termine"],["empfehlen","consigliare"],["chronisch","cronico"],["regelmässig","regolarmente"],["sich verletzen","ferirsi, farsi male"],["regeln","regolare, sistemare"],["steigen um + Akk.","aumentare di"],["darauffolgend","successivo"],["das Einkommen","reddito"]]},{"t":"Dialog: Beratungsgespräch zur Krankenkasse","s":"Consulenza completa con una cliente","dlg":true,"p":[{"w":"Berater","s":[["Guten Tag, Frau Keller.","Buongiorno signora Keller."],["Schön, dass Sie da sind.","Piacere di vederla."],["Wie kann ich Ihnen helfen?","Come posso aiutarla?"]]},{"w":"Kundin","s":[["Guten Tag.","Buongiorno."],["Ich habe den Prämienbrief bekommen, und meine Prämie steigt schon wieder.","Ho ricevuto la lettera dei premi e il mio premio aumenta di nuovo."],["Ich möchte wissen, ob ich etwas sparen kann.","Vorrei sapere se posso risparmiare qualcosa."]]},{"w":"Berater","s":[["Das schauen wir gerne zusammen an.","Lo guardiamo volentieri insieme."],["Darf ich zuerst ein paar Fragen stellen?","Posso prima fare qualche domanda?"],["Welche Franchise und welches Modell haben Sie im Moment?","Che franchigia e che modello ha al momento?"]]},{"w":"Kundin","s":[["Ich habe das Standardmodell mit 300 Franken Franchise.","Ho il modello standard con 300 franchi di franchigia."],["Das hatte ich schon immer.","L'ho sempre avuto."]]},{"w":"Berater","s":[["Verstehe.","Capisco."],["Wie oft gehen Sie ungefähr zum Arzt, und wie hoch waren Ihre Gesundheitskosten im letzten Jahr?","Più o meno quanto spesso va dal medico, e quanto sono stati i suoi costi sanitari l'anno scorso?"]]},{"w":"Kundin","s":[["Eigentlich selten.","In realtà raramente."],["Einmal im Jahr zur Kontrolle beim Frauenarzt, sonst fast nichts.","Una volta all'anno al controllo dal ginecologo, altrimenti quasi niente."],["Vielleicht 500 Franken im Jahr.","Forse 500 franchi all'anno."]]},{"w":"Berater","s":[["Dann bezahlen Sie wahrscheinlich zu viel.","Allora probabilmente paga troppo."],["Mit einer Franchise von 2500 Franken wäre Ihre Prämie deutlich tiefer.","Con una franchigia di 2500 franchi il suo premio sarebbe nettamente più basso."],["Bei Ihren Kosten würden Sie pro Jahr mehrere hundert Franken sparen.","Con i suoi costi risparmierebbe diverse centinaia di franchi all'anno."]]},{"w":"Kundin","s":[["Und wenn ich plötzlich krank werde?","E se mi ammalo all'improvviso?"],["Dann muss ich 2500 Franken selbst bezahlen?","Allora devo pagare 2500 franchi da sola?"]]},{"w":"Berater","s":[["Im schlimmsten Fall bezahlen Sie die Franchise und höchstens 700 Franken Selbstbehalt, also maximal 3200 Franken im Jahr.","Nel caso peggiore paga la franchigia e al massimo 700 franchi di aliquota, quindi al massimo 3200 franchi all'anno."],["Deshalb empfehle ich, diesen Betrag als Reserve auf einem Sparkonto zu haben.","Per questo consiglio di avere questo importo come riserva su un conto di risparmio."],["Haben Sie so eine Reserve?","Ha una riserva del genere?"]]},{"w":"Kundin","s":[["Ja, das hätte ich.","Sì, ce l'avrei."],["Und das Modell?","E il modello?"],["Muss ich das auch ändern?","Devo cambiare anche quello?"]]},{"w":"Berater","s":[["Das müssen Sie nicht, aber es lohnt sich.","Non è obbligatorio, ma conviene."],["Haben Sie eine Hausärztin, zu der Sie Vertrauen haben?","Ha una medica di famiglia di cui si fida?"]]},{"w":"Kundin","s":[["Ja, Frau Doktor Meier in Oerlikon.","Sì, la dottoressa Meier a Oerlikon."],["Aber ich möchte weiterhin direkt zum Frauenarzt gehen können.","Ma vorrei poter continuare ad andare direttamente dal ginecologo."]]},{"w":"Berater","s":[["Das ist im Hausarztmodell bei den meisten Kassen möglich: Die gynäkologische Kontrolle ist eine Ausnahme.","Nel modello medico di famiglia questo è possibile presso la maggior parte delle casse: il controllo ginecologico è un'eccezione."],["Ich prüfe das aber bei jeder Kasse, bevor wir etwas unterschreiben.","Lo verifico comunque per ogni cassa prima di firmare qualcosa."]]},{"w":"Kundin","s":[["Gut.","Bene."],["Und arbeiten Sie mit allen Kassen zusammen?","E lavora con tutte le casse?"]]},{"w":"Berater","s":[["Mit den meisten, ja.","Con la maggior parte, sì."],["Ich vergleiche für Sie die drei günstigsten Angebote in Ihrer Prämienregion.","Le confronto le tre offerte più convenienti nella sua regione di premio."],["Noch eine wichtige Frage: Arbeiten Sie mindestens acht Stunden pro Woche beim gleichen Arbeitgeber?","Ancora una domanda importante: lavora almeno otto ore a settimana per lo stesso datore di lavoro?"]]},{"w":"Kundin","s":[["Ja, ich arbeite achtzig Prozent in einem Büro.","Sì, lavoro all'ottanta per cento in un ufficio."]]},{"w":"Berater","s":[["Dann können wir die Unfalldeckung ausschliessen, weil Sie über Ihren Arbeitgeber versichert sind.","Allora possiamo escludere la copertura infortuni, perché è assicurata tramite il datore di lavoro."],["Das spart noch einmal etwas.","Questo fa risparmiare ancora qualcosa."]]},{"w":"Kundin","s":[["Und was passiert mit meiner Zusatzversicherung?","E cosa succede alla mia complementare?"],["Ich habe eine Spitalversicherung halbprivat.","Ho un'assicurazione ospedaliera semiprivata."]]},{"w":"Berater","s":[["Die würde ich auf keinen Fall kündigen.","Quella non la disdirei in nessun caso."],["Sie können die Zusatzversicherung bei Ihrer jetzigen Kasse behalten und nur die Grundversicherung wechseln.","Può tenere la complementare presso la sua cassa attuale e cambiare solo l'assicurazione di base."],["So müssen Sie keine neuen Gesundheitsfragen beantworten.","Così non deve rispondere a nuove domande sulla salute."]]},{"w":"Kundin","s":[["Das klingt gut.","Suona bene."],["Bis wann muss ich mich entscheiden?","Entro quando devo decidere?"]]},{"w":"Berater","s":[["Die Kündigung muss spätestens am 30. November bei Ihrer Kasse sein.","La disdetta deve arrivare alla sua cassa al più tardi il 30 novembre."],["Ich schlage vor, wir machen den Antrag bei der neuen Kasse diese Woche, und ich bereite Ihnen die Kündigung vor.","Propongo di fare la richiesta alla nuova cassa questa settimana e le preparo io la disdetta."],["Sie unterschreiben nur noch und schicken sie eingeschrieben.","Lei deve solo firmare e spedirla per raccomandata."]]},{"w":"Kundin","s":[["Perfekt, vielen Dank für die klare Beratung.","Perfetto, grazie mille per la consulenza chiara."]]},{"w":"Berater","s":[["Sehr gerne.","Molto volentieri."],["Ich schicke Ihnen den Vergleich bis morgen per E-Mail.","Le mando il confronto entro domani per e-mail."],["Einen schönen Tag noch, Frau Keller.","Buona giornata, signora Keller."]]}],"box":{"h":"Redemittel: frasi del consulente da imparare","html":"<ul><li>Darf ich Ihnen zuerst ein paar Fragen stellen? – <i>Posso farle prima qualche domanda?</i></li><li>Dann bezahlen Sie wahrscheinlich zu viel. – <i>Allora probabilmente paga troppo.</i></li><li>Im schlimmsten Fall … – <i>Nel caso peggiore…</i></li><li>Das lohnt sich. – <i>Conviene.</i></li><li>Die würde ich auf keinen Fall kündigen. – <i>Quella non la disdirei in nessun caso.</i></li><li>Ich prüfe das, bevor wir etwas unterschreiben. – <i>Lo verifico prima di firmare.</i></li><li>Ich schlage vor, dass … – <i>Propongo che…</i></li></ul>"},"v":[["das Beratungsgespräch","colloquio di consulenza"],["sich lohnen","convenire, valere la pena"],["die Reserve","riserva"],["das Sparkonto","conto di risparmio"],["Vertrauen haben zu + Dat.","fidarsi di"],["prüfen","verificare"],["unterschreiben","firmare"],["das Angebot, -e","offerta"],["halbprivat","semiprivato"],["auf keinen Fall","in nessun caso"],["vorbereiten","preparare"]]},{"t":"Grammatik im Thema","s":"La grammatica B1 che serve per parlare di cassa malati","gram":true,"p":[{"s":[["Passiv: Die Kosten werden von der Kasse übernommen.","Passivo: I costi vengono assunti dalla cassa."],["Die Geburt wird bezahlt.","Il parto viene pagato."],["Die Franchise wurde falsch abgezogen.","La franchigia è stata detratta in modo sbagliato."]]},{"s":[["Konjunktiv II für Höflichkeit und Ratschläge: Mit einer höheren Franchise wäre Ihre Prämie tiefer.","Congiuntivo II per cortesia e consigli: Con una franchigia più alta il suo premio sarebbe più basso."],["Ich würde die Zusatzversicherung behalten.","Io terrei la complementare."],["Könnten Sie mir bitte die Police schicken?","Potrebbe mandarmi la polizza, per favore?"]]},{"s":[["Je … desto: Je höher die Franchise, desto tiefer die Prämie.","Più… più: Più alta è la franchigia, più basso è il premio."],["Je früher Sie das Baby anmelden, desto sicherer ist es versichert.","Prima iscrive il bebè, più sicuramente è assicurato."]]},{"s":[["Bedingungssätze mit wenn und falls: Wenn Sie mindestens acht Stunden arbeiten, sind Sie über den Arbeitgeber versichert.","Frasi condizionali con wenn e falls: Se lavora almeno otto ore, è assicurato tramite il datore di lavoro."],["Falls Sie die Stelle verlieren, müssen Sie die Unfalldeckung wieder einschliessen.","Nel caso in cui perda il posto, deve reinserire la copertura infortuni."]]},{"s":[["Relativsätze: Die Ärztin, die Sie gewählt haben, ist Ihre erste Anlaufstelle.","Frasi relative: La dottoressa che ha scelto è il suo primo punto di contatto."],["Das ist die Kasse, bei der ich seit zehn Jahren versichert bin.","Questa è la cassa presso cui sono assicurato da dieci anni."]]},{"s":[["Nomen-Verb-Verbindungen: einen Antrag stellen, eine Überweisung ausstellen, Leistungen in Anspruch nehmen, eine Rechnung einreichen, eine Frist einhalten, Kosten übernehmen.","Locuzioni nome-verbo: presentare una richiesta, rilasciare un'impegnativa, usufruire delle prestazioni, inoltrare una fattura, rispettare un termine, assumersi i costi."]]}],"box":{"h":"Spiegazione: perché il passivo è ovunque","html":"<p>Nei testi assicurativi conta <b>cosa</b> succede, non chi lo fa. Per questo trovi sempre <b>werden + participio</b>: <i>wird bezahlt, wird übernommen, wird abgerechnet</i>. Al passato: <i>wurde bezahlt</i>. Con verbo modale: <i>muss gemeldet werden, kann gekündigt werden</i>.</p><p>Il <b>Konjunktiv II</b> (<i>wäre, hätte, würde, könnte</i>) è lo strumento del consulente: rende un consiglio gentile e non aggressivo. <i>«Sie sollten wechseln»</i> suona duro; <i>«Ich würde an Ihrer Stelle wechseln»</i> suona professionale.</p>"},"v":[["in Anspruch nehmen","usufruire di"],["an Ihrer Stelle","al suo posto"],["die Police, -n","polizza"],["falls","nel caso in cui"],["seit + Dat.","da (tempo)"]]},{"t":"Übungen","s":"Verifica: 14 domande su tutto il modulo","quiz":true,"p":[],"q":[["Ab wann gilt die Versicherung, wenn man sich innerhalb von drei Monaten anmeldet?",["Ab dem Tag der Anmeldung","Rückwirkend ab der Einreise","Ab dem 1. Januar"],1,"Entro tre mesi l'assicurazione vale retroattivamente dal giorno dell'arrivo."],["Was ist bei allen Krankenkassen gleich?",["Die Prämie","Die Leistungen der Grundversicherung","Die Zusatzversicherungen"],1,"Le prestazioni di base sono fissate dalla legge; cambiano premio e servizio."],["Darf eine Kasse jemanden für die Grundversicherung ablehnen?",["Ja, bei schlechter Gesundheit","Nein, nie","Nur ab 65 Jahren"],1,"Obbligo di ammissione: nessun rifiuto nella base."],["Im Hausarztmodell geht man zum Spezialisten …",["direkt, ohne Formalitäten","mit einer Überweisung des Hausarztes","nur nach einem Anruf bei der Kasse"],1,"Serve l'impegnativa (Überweisung) del medico di famiglia."],["Kosten 3000 Fr., Franchise 500. Wie viel bezahlt man selbst?",["500 Franken","750 Franken","800 Franken"],1,"500 + 10 % di 2500 = 500 + 250 = 750."],["Wie hoch ist der Selbstbehalt für Erwachsene maximal pro Jahr?",["350 Franken","700 Franken","1000 Franken"],1,"Tetto: 700 CHF adulti, 350 CHF bambini."],["Wie viel bezahlt ein Erwachsener pro Spitaltag zusätzlich?",["10 Franken","15 Franken","25 Franken"],1,"Contributo ospedaliero: 15 CHF al giorno."],["Eine Frau hat in der 18. Schwangerschaftswoche eine Grippe. Was bezahlt sie?",["Franchise und Selbstbehalt","Nur den Selbstbehalt","Nichts"],2,"Dalla 13ª settimana a 8 settimane dopo il parto: nessuna partecipazione."],["Wie viele Ultraschalluntersuchungen zahlt die Grundversicherung bei normaler Schwangerschaft?",["Eine","Zwei","Sieben"],1,"Due ecografie (11–14 e 20–23 settimane); sette sono i controlli."],["Wann sollte man das Baby für die Zusatzversicherung anmelden?",["Vor der Geburt","Bis drei Monate nach der Geburt","Mit einem Jahr"],0,"Prima della nascita: niente domande sulla salute."],["Wer kann die Unfalldeckung bei der Krankenkasse ausschliessen?",["Alle Erwachsenen","Wer mind. 8 Std./Woche beim gleichen Arbeitgeber arbeitet","Nur Selbständige"],1,"Chi lavora almeno 8 ore è coperto dalla LAINF anche nel tempo libero."],["Bis wann muss die Kündigung der Grundversicherung bei der Kasse sein?",["30. September","30. November","31. Dezember"],1,"Deve arrivare entro il 30 novembre; il timbro postale non basta."],["Was macht man zuerst beim Kassenwechsel?",["Bei der alten Kasse kündigen","Bei der neuen Kasse anmelden","Die Zusatzversicherung kündigen"],1,"Prima l'iscrizione alla nuova, poi la disdetta."],["Ergänzen Sie: «Die Rechnung … direkt an die Kasse geschickt.»",["wird","hat","ist"],0,"Passivo presente: wird + participio."]],"v":[]}];

{t:"Das System der Autoversicherung",s:"Le tre coperture: responsabilità civile, casco parziale, casco totale",p:[
 [["In der Schweiz braucht jedes Motorfahrzeug eine Haftpflichtversicherung.","In Svizzera ogni veicolo a motore ha bisogno di un'assicurazione di responsabilità civile."],
  ["Ohne Versicherungsnachweis gibt das Strassenverkehrsamt keine Kontrollschilder ab.","Senza attestato d'assicurazione l'ufficio della circolazione non rilascia le targhe."],
  ["Die Haftpflicht bezahlt die Schäden, die man anderen Personen zufügt: Personenschäden und Sachschäden.","La responsabilità civile paga i danni che si causano ad altre persone: danni alle persone e danni materiali."]],
 [["Das eigene Auto ist mit der Haftpflicht nicht versichert.","La propria auto non è assicurata con la responsabilità civile."],
  ["Dafür gibt es die Kaskoversicherung: Teilkasko und Vollkasko.","Per questo esiste l'assicurazione casco: casco parziale e casco totale."],
  ["Die Kasko ist freiwillig, aber bei Leasing oder Kredit verlangt die Bank fast immer eine Vollkasko.","La casco è facoltativa, ma con leasing o credito la banca chiede quasi sempre una casco totale."]]],
 box:{h:"Spiegazione: le tre coperture",html:`<table><tr><th>Copertura</th><th>Obbligatoria?</th><th>Paga…</th></tr><tr><td>Haftpflicht</td><td>Sì</td><td>i danni agli altri (persone, auto, cose)</td></tr><tr><td>Teilkasko</td><td>No</td><td>danni alla tua auto non causati da te: furto, incendio, grandine, vetri, faina, animali</td></tr><tr><td>Vollkasko</td><td>No (sì con leasing)</td><td>tutto della Teilkasko + i danni che causi tu (collisione)</td></tr></table><p>Frase chiave: <i>«Die Haftpflicht schützt die anderen, die Kasko schützt Ihr eigenes Auto.»</i></p>`},
 v:[["die Haftpflichtversicherung","responsabilità civile"],["das Kontrollschild, -er","targa"],["der Versicherungsnachweis","attestato d'assicurazione"],["der Personenschaden, -schäden","danno alla persona"],["der Sachschaden, -schäden","danno materiale"],["zufügen","causare (un danno)"],["freiwillig","facoltativo"],["das Leasing","leasing"]]},
{t:"Haftpflicht, Bonus und Regress",s:"Somma di garanzia, gradi di premio e colpa grave",p:[
 [["Das Gesetz verlangt eine Garantiesumme von mindestens fünf Millionen Franken pro Ereignis.","La legge richiede una somma di garanzia di almeno cinque milioni di franchi per evento."],
  ["Die meisten Versicherungen bieten aber deutlich mehr an, oft 100 Millionen Franken.","La maggior parte delle assicurazioni però offre molto di più, spesso 100 milioni di franchi."],
  ["Bei schweren Unfällen mit Verletzten können die Kosten sehr hoch werden.","Negli incidenti gravi con feriti i costi possono diventare molto alti."]],
 [["Die Prämie hängt vom Bonus-Malus-System ab.","Il premio dipende dal sistema bonus-malus."],
  ["Wer keinen Schaden verursacht, steigt jedes Jahr eine Prämienstufe tiefer.","Chi non causa sinistri scende ogni anno di un grado di premio."],
  ["Nach einem Haftpflichtschaden steigt man mehrere Stufen höher und bezahlt mehr.","Dopo un sinistro di responsabilità civile si sale di più gradi e si paga di più."],
  ["Mit einem Bonusschutz bleibt die Prämie nach dem ersten Schaden gleich.","Con la protezione del bonus il premio resta uguale dopo il primo sinistro."]],
 [["Bei Grobfahrlässigkeit, zum Beispiel bei einem Rotlicht oder bei Übermüdung, kann die Versicherung einen Teil der Kosten zurückfordern.","In caso di colpa grave, per esempio con un semaforo rosso o per stanchezza, l'assicurazione può chiedere indietro una parte dei costi."],
  ["Das nennt man Regress.","Questo si chiama regresso."],
  ["Mit der Zusatzdeckung Verzicht auf Regress verzichtet die Versicherung darauf, ausser bei Alkohol, Drogen oder Raserdelikten.","Con la copertura aggiuntiva rinuncia al regresso l'assicurazione vi rinuncia, tranne in caso di alcol, droghe o delitti da pirata della strada."]]],
 box:{h:"Spiegazione: piccolo danno, pagare da sé?",html:`<p>Dopo un sinistro piccolo (es. 800 CHF) a volte conviene pagare da sé: l'aumento del premio per 3–4 anni può costare di più del danno. Molte assicurazioni permettono di rimborsare il danno entro un certo termine per non perdere il bonus.</p><p>Frase utile: <i>«Ich rechne Ihnen aus, ob es sich lohnt, den Schaden selbst zu bezahlen.»</i></p>`},
 v:[["die Garantiesumme","somma di garanzia"],["das Ereignis, -se","evento"],["die Prämienstufe, -n","grado di premio"],["der Bonusschutz","protezione del bonus"],["die Grobfahrlässigkeit","colpa grave"],["der Regress","regresso"],["zurückfordern","chiedere indietro"],["der Verzicht auf Regress","rinuncia al regresso"]]},
{t:"Teilkasko und Vollkasko",s:"Cosa paga la casco parziale e quando serve la totale",p:[
 [["Die Teilkasko bezahlt Schäden am eigenen Auto, die man nicht selbst verursacht hat.","La casco parziale paga i danni alla propria auto che non si sono causati da sé."],
  ["Dazu gehören Diebstahl, Feuer, Elementarschäden wie Hagel, Sturm und Überschwemmung, Glasbruch, Marderbiss und die Kollision mit Tieren.","Ne fanno parte furto, incendio, danni della natura come grandine, tempesta e inondazione, rottura vetri, morso di faina e collisione con animali."],
  ["Vandalismus ist je nach Versicherung inklusive oder eine Zusatzdeckung.","Il vandalismo, a seconda dell'assicurazione, è incluso o è una copertura aggiuntiva."]],
 [["Die Vollkasko deckt zusätzlich Kollisionsschäden, auch wenn man selbst schuld ist.","La casco totale copre in più i danni da collisione, anche se la colpa è propria."],
  ["Sie lohnt sich vor allem für neue und teure Autos, meistens in den ersten fünf bis sieben Jahren.","Conviene soprattutto per auto nuove e costose, di solito nei primi cinque-sette anni."],
  ["Bei einem Totalschaden zahlen viele Versicherungen in den ersten Jahren den Neuwert oder einen erhöhten Zeitwert.","In caso di danno totale molte assicurazioni nei primi anni pagano il valore a nuovo o un valore attuale maggiorato."]],
 [["In der Kasko wählt man einen Selbstbehalt, zum Beispiel 500 oder 1000 Franken.","Nella casco si sceglie una franchigia, per esempio 500 o 1000 franchi."],
  ["Je höher der Selbstbehalt, desto tiefer die Prämie.","Più alta è la franchigia, più basso è il premio."]]],
 box:{h:"Spiegazione: quale copertura per quale auto?",html:`<table><tr><th>Auto</th><th>Consiglio</th></tr><tr><td>Nuova, in leasing</td><td>Vollkasko (obbligatoria per il leasing)</td></tr><tr><td>3–7 anni, buon valore</td><td>Vollkasko o Teilkasko, si confronta</td></tr><tr><td>Vecchia, poco valore</td><td>Teilkasko o solo Haftpflicht</td></tr></table>`},
 v:[["der Diebstahl","furto"],["der Elementarschaden, -schäden","danno della natura"],["der Glasbruch","rottura vetri"],["der Marder","faina"],["der Kollisionsschaden","danno da collisione"],["der Totalschaden","danno totale"],["der Neuwert / der Zeitwert","valore a nuovo / valore attuale"],["der Selbstbehalt","franchigia"]]},
{t:"Nach dem Unfall",s:"Cosa fare subito, il verbale e la notifica del sinistro",p:[
 [["Nach einem Unfall sichert man zuerst die Unfallstelle mit dem Warndreieck.","Dopo un incidente si mette prima in sicurezza il luogo con il triangolo."],
  ["Gibt es Verletzte, ruft man sofort die Polizei unter 117 und die Ambulanz unter 144.","Se ci sono feriti si chiamano subito la polizia al 117 e l'ambulanza al 144."],
  ["Bei reinen Blechschäden füllen beide Lenker gemeinsam das europäische Unfallprotokoll aus.","Con soli danni alla carrozzeria entrambi i conducenti compilano insieme la constatazione amichevole europea."]],
 [["Man unterschreibt nur, was stimmt, und gibt kein Schuldanerkenntnis ab.","Si firma solo ciò che è giusto e non si riconosce la colpa."],
  ["Fotos von den Autos und von der Unfallstelle helfen später sehr.","Le foto delle auto e del luogo dell'incidente aiutano molto dopo."],
  ["Wer ein parkiertes Auto beschädigt und den Halter nicht findet, muss die Polizei informieren.","Chi danneggia un'auto parcheggiata e non trova il detentore deve informare la polizia."],
  ["Danach meldet man den Schaden so schnell wie möglich der Versicherung, heute meistens online.","Poi si notifica il sinistro all'assicurazione il prima possibile, oggi per lo più online."]]],
 box:{h:"Spiegazione: numeri d'emergenza in Svizzera",html:`<p>117 polizia · 118 pompieri · 144 ambulanza · 112 numero europeo · 1414 Rega (elicottero)</p><p>Frase utile al telefono: <i>«Ich hatte einen Unfall auf der A1 bei Winterthur. Eine Person ist verletzt.»</i></p>`},
 v:[["die Unfallstelle","luogo dell'incidente"],["das Warndreieck","triangolo di emergenza"],["der Blechschaden","danno alla carrozzeria"],["das Unfallprotokoll","constatazione amichevole"],["das Schuldanerkenntnis","riconoscimento di colpa"],["der Halter / die Halterin","detentore/detentrice del veicolo"],["den Schaden melden","notificare il sinistro"],["verletzt","ferito"]]},
{t:"Geschichte 1 – Im Büro: Ein Fahrzeugwechsel",s:"La parte burocratica in ufficio",p:[
 [["Am Montagmorgen findet Sara, Sachbearbeiterin bei Wertia Finanz, eine E-Mail von Herrn Keller im Posteingang.","Lunedì mattina Sara, impiegata da Wertia Finanz, trova nella posta in arrivo un'e-mail del signor Keller."],
  ["Er hat sein altes Auto verkauft und holt am Freitag ein neues ab.","Ha venduto la sua vecchia auto e venerdì ritira quella nuova."],
  ["Sara öffnet das Kundendossier und kontrolliert die laufende Police.","Sara apre il dossier del cliente e controlla la polizza in corso."]],
 [["Für den Fahrzeugwechsel braucht die Versicherung den neuen Fahrzeugausweis oder das Typenblatt mit der Stammnummer.","Per il cambio di veicolo l'assicurazione ha bisogno della nuova licenza di circolazione o della scheda tecnica con il numero di matricola."],
  ["Sara schreibt Herrn Keller und bittet ihn um die Unterlagen.","Sara scrive al signor Keller e gli chiede i documenti."],
  ["Am Dienstag kommen die Dokumente, und Sara erfasst den Antrag im Portal der Versicherung.","Martedì arrivano i documenti e Sara registra la proposta nel portale dell'assicurazione."]],
 [["Die Versicherung schickt den Versicherungsnachweis elektronisch direkt an das Strassenverkehrsamt.","L'assicurazione invia l'attestato d'assicurazione elettronicamente direttamente all'ufficio della circolazione."],
  ["So kann Herr Keller die Kontrollschilder einfach vom alten auf das neue Auto wechseln.","Così il signor Keller può semplicemente spostare le targhe dalla vecchia alla nuova auto."],
  ["Am Donnerstag kommt die neue Police; Sara legt sie im Dossier ab und notiert die Prämie im CRM.","Giovedì arriva la nuova polizza; Sara la archivia nel dossier e annota il premio nel CRM."],
  ["Zum Schluss schickt sie Herrn Keller eine kurze Bestätigung: «Ihr neues Auto ist ab Freitag versichert.»","Infine manda al signor Keller una breve conferma: «La sua nuova auto è assicurata da venerdì.»"]]],
 box:{h:"Domande (rispondi in tedesco)",html:`<ul><li>Welche Unterlagen braucht die Versicherung?</li><li>Wohin schickt die Versicherung den Versicherungsnachweis?</li><li>Was macht Sara mit der neuen Police?</li></ul>`},
 v:[["der Fahrzeugwechsel","cambio di veicolo"],["das Kundendossier","dossier del cliente"],["die laufende Police","polizza in corso"],["das Typenblatt","scheda tecnica"],["die Stammnummer","numero di matricola"],["erfassen","registrare (dati)"],["ablegen","archiviare"],["das Strassenverkehrsamt","ufficio della circolazione"]]},
{t:"Geschichte 2 – Verkauf: Die erste Autoversicherung",s:"La vendita di un contratto",p:[
 [["Lucas ist 22 Jahre alt und hat gerade den Führerausweis gemacht.","Lucas ha 22 anni e ha appena preso la patente."],
  ["Er kauft einen gebrauchten Toyota für 12 000 Franken und kommt mit seiner Mutter zu Luiz ins Büro.","Compra una Toyota usata per 12 000 franchi e viene con sua madre da Luiz in ufficio."]],
 [["Luiz erklärt zuerst, dass Junglenker oft höhere Prämien und einen höheren Selbstbehalt haben.","Luiz spiega prima che i neopatentati hanno spesso premi più alti e una franchigia più alta."],
  ["Dann fragt er nach dem Budget: Lucas kann höchstens 150 Franken pro Monat bezahlen.","Poi chiede il budget: Lucas può pagare al massimo 150 franchi al mese."],
  ["Luiz vergleicht drei Offerten und zeigt sie in einer Tabelle.","Luiz confronta tre offerte e le mostra in una tabella."]],
 [["Für ein Auto mit diesem Wert empfiehlt er Haftpflicht und Teilkasko, aber keine Vollkasko.","Per un'auto di questo valore consiglia responsabilità civile e casco parziale, ma niente casco totale."],
  ["«Eine Vollkasko kostet Sie fast 900 Franken mehr pro Jahr, das lohnt sich bei diesem Auto nicht», sagt er.","«Una casco totale le costa quasi 900 franchi in più all'anno, con quest'auto non conviene», dice."],
  ["Lucas hat einen Einwand: «Und wenn ich einen Unfall baue?»","Lucas ha un'obiezione: «E se faccio un incidente?»"],
  ["Luiz antwortet ruhig: «Dann zahlt die Haftpflicht den Schaden der anderen. Ihr eigenes Auto hätte nach einem Totalschaden nur noch einen kleinen Zeitwert.»","Luiz risponde con calma: «Allora la responsabilità civile paga il danno degli altri. La sua auto dopo un danno totale avrebbe solo un piccolo valore attuale.»"]],
 [["Lucas ist überzeugt und unterschreibt den Antrag.","Lucas è convinto e firma la proposta."],
  ["Luiz füllt das Beratungsprotokoll aus und vereinbart einen Termin in einem Jahr, um die Deckung zu überprüfen.","Luiz compila il protocollo di consulenza e fissa un appuntamento fra un anno per verificare la copertura."]]],
 box:{h:"Tecnica di vendita usata",html:`<ol><li>Analisi del bisogno (auto, budget, esperienza)</li><li>Confronto chiaro (tabella)</li><li>Raccomandazione motivata</li><li>Risposta all'obiezione con un esempio</li><li>Chiusura + protocollo + appuntamento di verifica</li></ol>`},
 v:[["der Junglenker","neopatentato"],["gebraucht","usato"],["das Budget","budget"],["der Einwand, Einwände","obiezione"],["einen Unfall bauen","fare un incidente (colloquiale)"],["überzeugt","convinto"],["überprüfen","verificare"],["sich lohnen","convenire"]]},
{t:"Geschichte 3 – Problem lösen: Der Hagelsturm",s:"Come si risolve un problema",p:[
 [["Marco Bianchi wohnt in Winterthur und hat vor zwei Jahren einen neuen Škoda geleast.","Marco Bianchi abita a Winterthur e due anni fa ha preso in leasing una Škoda nuova."],
  ["Die Leasinggesellschaft hat eine Vollkasko verlangt, deshalb ist das Auto voll versichert.","La società di leasing ha chiesto una casco totale, perciò l'auto è assicurata completamente."]],
 [["Im Juli zieht am Abend ein starkes Gewitter über die Stadt.","A luglio la sera un forte temporale passa sulla città."],
  ["Marcos Auto steht draussen, und Hagelkörner so gross wie Golfbälle beschädigen das Dach und die Motorhaube.","L'auto di Marco è fuori e chicchi di grandine grandi come palline da golf danneggiano il tetto e il cofano."],
  ["Am nächsten Morgen macht er Fotos und meldet den Schaden online.","La mattina dopo fa delle foto e notifica il danno online."]],
 [["Ein Schadenexperte schätzt die Reparatur auf 6500 Franken.","Un perito stima la riparazione a 6500 franchi."],
  ["Weil Hagel ein Elementarschaden ist, läuft er über die Teilkasko, und Marcos Bonus bleibt unverändert.","Poiché la grandine è un danno della natura, rientra nella casco parziale e il bonus di Marco resta invariato."],
  ["Er bezahlt nur seinen Selbstbehalt von 200 Franken.","Paga solo la sua franchigia di 200 franchi."]],
 [["Zwei Monate später fährt Marco rückwärts aus einem Parkplatz und touchiert einen Pfosten.","Due mesi dopo Marco esce in retromarcia da un parcheggio e urta un palo."],
  ["Diesmal ist es ein Kollisionsschaden, den er selbst verschuldet hat.","Questa volta è un danno da collisione causato da lui."],
  ["Dank Bonusschutz steigt seine Prämie trotzdem nicht.","Grazie alla protezione del bonus il suo premio comunque non aumenta."]]],
 box:{h:"Domande sulla storia (rispondi in tedesco)",html:`<ul><li>Warum hat Marco eine Vollkasko?</li><li>Über welche Deckung läuft der Hagelschaden?</li><li>Was bezahlt Marco selbst?</li><li>Warum steigt seine Prämie nach dem Parkschaden nicht?</li></ul>`},v:[]},
{t:"Dialog: Offerte für ein neues Auto",s:"Consulenza per un'auto nuova",dlg:true,p:[
 {w:"Berater",s:[["Guten Tag, Herr Rossi. Sie haben ein neues Auto gekauft?","Buongiorno signor Rossi. Ha comprato un'auto nuova?"]]},
 {w:"Kunde",s:[["Ja, einen VW Golf, ab nächstem Monat.","Sì, una VW Golf, dal mese prossimo."],["Ich brauche eine Versicherung.","Mi serve un'assicurazione."]]},
 {w:"Berater",s:[["Gerne. Ist das Auto geleast oder gekauft?","Volentieri. L'auto è in leasing o comprata?"]]},
 {w:"Kunde",s:[["Geleast, für vier Jahre.","In leasing, per quattro anni."]]},
 {w:"Berater",s:[["Dann brauchen Sie eine Vollkasko.","Allora le serve una casco totale."],["Wie viele Kilometer fahren Sie pro Jahr ungefähr?","Quanti chilometri fa più o meno all'anno?"]]},
 {w:"Kunde",s:[["Etwa 15 000. Ich fahre jeden Tag zur Arbeit.","Circa 15 000. Vado al lavoro ogni giorno."]]},
 {w:"Berater",s:[["Hatten Sie in den letzten fünf Jahren einen Schaden?","Ha avuto un sinistro negli ultimi cinque anni?"]]},
 {w:"Kunde",s:[["Nein, keinen.","No, nessuno."]]},
 {w:"Berater",s:[["Sehr gut, dann bekommen Sie eine gute Prämienstufe.","Molto bene, allora ottiene un buon grado di premio."],["Ich empfehle Ihnen zusätzlich den Bonusschutz und den Verzicht auf Regress.","Le consiglio in più la protezione del bonus e la rinuncia al regresso."]]},
 {w:"Kunde",s:[["Was kostet das ungefähr?","Quanto costa più o meno?"]]},
 {w:"Berater",s:[["Ich vergleiche drei Versicherungen und schicke Ihnen morgen die Offerten.","Confronto tre assicurazioni e domani le mando le offerte."],["Bitte schicken Sie mir eine Kopie Ihres Führerausweises.","Mi mandi per favore una copia della sua patente."]]},
 {w:"Kunde",s:[["Mache ich. Vielen Dank!","Lo faccio. Grazie mille!"]]}],v:[]},
{t:"Übungen",s:"Verifica: 8 domande",p:[],q:[
 ["Welche Versicherung ist für jedes Auto obligatorisch?",["Teilkasko","Haftpflicht","Vollkasko"],1,"Solo la responsabilità civile è obbligatoria."],
 ["Wer bezahlt den Hagelschaden am eigenen Auto?",["Die Haftpflicht","Die Teilkasko","Niemand"],1,"La grandine è un danno della natura: Teilkasko."],
 ["Sie fahren selbstverschuldet in eine Mauer. Welche Deckung zahlt Ihr Auto?",["Teilkasko","Vollkasko","Haftpflicht"],1,"Il danno da collisione causato da sé lo paga la Vollkasko."],
 ["Was passiert nach einem Haftpflichtschaden ohne Bonusschutz?",["Die Prämie sinkt","Die Prämie steigt","Nichts"],1,"Si sale di gradi nel bonus-malus."],
 ["Was bedeutet Regress?",["Die Versicherung fordert Geld zurück","Der Bonus wird geschützt","Die Prämie wird reduziert"],0,"Con colpa grave l'assicurazione può chiedere indietro una parte."],
 ["Was unterschreibt man im Unfallprotokoll nicht?",["Den Unfallhergang","Ein Schuldanerkenntnis","Die Personalien"],1,"Non si riconosce la colpa."],
 ["Welche Nummer ruft man für die Ambulanz?",["117","118","144"],2,"144 = ambulanza."],
 ["Ergänzen Sie: «Je höher der Selbstbehalt, … tiefer die Prämie.»",["desto","als","wenn"],0,"Je … desto."]],v:[]}
]};

{t:"Geschichte 1 – Im Büro: Prämienverbilligung beantragen",s:"La parte burocratica in ufficio",p:[
 [["Familie Nogueira ist neu in Zürich und hat ein kleines Einkommen.","La famiglia Nogueira è nuova a Zurigo e ha un reddito basso."],
  ["Sara prüft, ob die Familie Anspruch auf Prämienverbilligung hat.","Sara verifica se la famiglia ha diritto alla riduzione dei premi."]],
 [["Im Kanton Zürich beantragt man die Prämienverbilligung bei der SVA Zürich.","Nel Canton Zurigo la riduzione dei premi si chiede alla SVA di Zurigo."],
  ["Wer quellenbesteuert ist oder neu zugezogen ist, muss oft selbst einen Antrag stellen.","Chi è tassato alla fonte o si è appena trasferito spesso deve fare domanda da sé."],
  ["Sara sammelt die Unterlagen: Lohnausweise, Mietvertrag, Policen der Krankenkasse und die Aufenthaltsbewilligungen.","Sara raccoglie i documenti: certificati di salario, contratto d'affitto, polizze della cassa malati e permessi di soggiorno."]],
 [["Sie füllt den Antrag online aus und achtet auf die Frist.","Compila la domanda online e fa attenzione al termine."],
  ["Nach einigen Wochen kommt die Verfügung: Die Familie bekommt eine Verbilligung, die direkt an die Krankenkasse bezahlt wird.","Dopo alcune settimane arriva la decisione: la famiglia riceve una riduzione che viene pagata direttamente alla cassa malati."],
  ["Sara kontrolliert die nächste Prämienrechnung, ob der Betrag abgezogen ist, und notiert alles im CRM.","Sara controlla nella fattura del premio successiva che l'importo sia dedotto e annota tutto nel CRM."]]],
 v:[["Anspruch haben auf","avere diritto a"],["quellenbesteuert","tassato alla fonte"],["zuziehen","trasferirsi (in un luogo)"],["einen Antrag stellen","fare domanda"],["die Verfügung","decisione (ufficiale)"],["die Frist","termine"],["abziehen","detrarre"],["sammeln","raccogliere"]]},
{t:"Geschichte 2 – Verkauf: Wechsel zu Telmed",s:"La vendita di un contratto",p:[
 [["Herr Bauer, 34 Jahre alt, bezahlt 480 Franken im Monat im Standardmodell mit Franchise 300.","Il signor Bauer, 34 anni, paga 480 franchi al mese nel modello standard con franchigia 300."],
  ["Er geht nur einmal im Jahr zum Arzt.","Va dal medico solo una volta all'anno."]],
 [["Luiz rechnet ihm vor: Mit Telmed und Franchise 2500 bezahlt er etwa 290 Franken im Monat.","Luiz gli fa il calcolo: con Telmed e franchigia 2500 paga circa 290 franchi al mese."],
  ["Das sind über 2200 Franken weniger Prämie pro Jahr.","Sono più di 2200 franchi di premio in meno all'anno."],
  ["Herr Bauer fragt: «Und wenn ich doch krank werde?»","Il signor Bauer chiede: «E se però mi ammalo?»"],
  ["Luiz zeigt den schlimmsten Fall: höchstens 2500 Franken Franchise plus 700 Selbstbehalt; trotzdem spart er bei normalen Jahren viel.","Luiz mostra il caso peggiore: al massimo 2500 franchi di franchigia più 700 di aliquota; comunque negli anni normali risparmia molto."]],
 [["Er empfiehlt zusätzlich eine Spitalzusatzversicherung halbprivat, solange Herr Bauer jung und gesund ist.","Consiglia in più una complementare ospedaliera semiprivata, finché il signor Bauer è giovane e sano."],
  ["Herr Bauer unterschreibt den Antrag, und Luiz schickt die Kündigung der alten Grundversicherung eingeschrieben vor dem 30. November.","Il signor Bauer firma la proposta e Luiz manda per raccomandata la disdetta della vecchia base prima del 30 novembre."]]],
 v:[["vorrechnen","fare il calcolo (a qualcuno)"],["der schlimmste Fall","il caso peggiore"],["trotzdem","comunque"],["sparen","risparmiare"],["solange","finché"],["gesund","sano"],["halbprivat","semiprivato"],["eingeschrieben","per raccomandata"]]},
{t:"Geschichte 3 – Problem lösen: Die Prämie ist nicht bezahlt",s:"Il cliente non riesce a pagare la rata",p:[
 [["Frau Pereira hat seit drei Monaten ihre Krankenkassenprämie nicht bezahlt.","La signora Pereira non paga il premio della cassa malati da tre mesi."],
  ["Die Kasse hat eine Mahnung geschickt und droht mit der Betreibung.","La cassa ha mandato un sollecito e minaccia l'esecuzione."],
  ["Sara sieht das in der Kopie der Mahnung und ruft die Kundin an.","Sara lo vede nella copia del sollecito e chiama la cliente."]],
 [["Sie spricht ruhig und ohne Vorwurf: «Frau Pereira, ich habe gesehen, dass eine Mahnung gekommen ist. Ist alles in Ordnung?»","Parla con calma e senza rimprovero: «Signora Pereira, ho visto che è arrivato un sollecito. Va tutto bene?»"],
  ["Die Kundin erzählt, dass sie ihre Stelle verloren hat und jetzt Arbeitslosengeld bekommt.","La cliente racconta che ha perso il lavoro e ora riceve l'indennità di disoccupazione."]],
 [["Sara erklärt die Folgen: Bei einer Betreibung kommen Gebühren dazu, und der Kassenwechsel ist blockiert, bis alles bezahlt ist.","Sara spiega le conseguenze: con un'esecuzione si aggiungono spese, e il cambio di cassa è bloccato finché non è tutto pagato."],
  ["Dann zeigt sie Lösungen: Sie fragt bei der Kasse eine Ratenzahlung an, und sie prüft eine Prämienverbilligung wegen des tieferen Einkommens.","Poi mostra le soluzioni: chiede alla cassa un pagamento a rate e verifica una riduzione dei premi per via del reddito più basso."],
  ["Ausserdem schlägt sie für das nächste Jahr ein günstigeres Modell vor.","Inoltre propone per l'anno prossimo un modello più economico."]],
 [["Die Kasse akzeptiert drei Raten.","La cassa accetta tre rate."],
  ["Sara schickt Frau Pereira eine kurze E-Mail mit den Daten und ruft sie vor jeder Rate an.","Sara manda alla signora Pereira una breve e-mail con le date e la chiama prima di ogni rata."],
  ["Die Kundin bedankt sich: «Ich dachte, Sie rufen nur an, um zu verkaufen.»","La cliente ringrazia: «Pensavo che chiamasse solo per vendere.»"]]],
 box:{h:"Come parlare di soldi con un cliente in difficoltà",html:`<ol><li>Chiamare presto, non aspettare l'esecuzione.</li><li>Nessun rimprovero: «Ist alles in Ordnung?»</li><li>Spiegare le conseguenze in modo chiaro.</li><li>Offrire soluzioni concrete (rate, riduzione dei premi, modello più economico).</li><li>Mettere tutto per iscritto e richiamare.</li></ol><p>Frasi utili: <i>«Wir finden gemeinsam eine Lösung.» · «Wäre eine Ratenzahlung für Sie möglich?» · «Ich kümmere mich darum.»</i></p>`},
