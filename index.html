 {t:["Mein erster Arbeitstag","Il mio primo giorno di lavoro","Meu primeiro dia de trabalho","Mi primer día de trabajo"],s:[
  ["Heute war mein erster Arbeitstag bei Wertia Finanz.","Oggi era il mio primo giorno di lavoro da Wertia Finanz.","Hoje foi meu primeiro dia de trabalho na Wertia Finanz.","Hoy ha sido mi primer día de trabajo en Wertia Finanz."],
  ["Am Morgen hatte ich ein bisschen Angst.","Al mattino avevo un po' paura.","De manhã eu estava com um pouco de medo.","Por la mañana tenía un poco de miedo."],
  ["Frau Keller hat mir meinen Schreibtisch und meinen Bildschirm gezeigt.","La signora Keller mi ha mostrato la mia scrivania e il mio schermo.","A senhora Keller me mostrou minha mesa e minha tela.","La señora Keller me enseñó mi escritorio y mi pantalla."],
  ["Ein Kollege hat mir erklärt, wie der Drucker funktioniert.","Un collega mi ha spiegato come funziona la stampante.","Um colega me explicou como funciona a impressora.","Un compañero me explicó cómo funciona la impresora."],
  ["Um zehn Uhr hatte ich meine erste Besprechung mit dem Team.","Alle dieci ho avuto la mia prima riunione con il team.","Às dez tive minha primeira reunião com a equipe.","A las diez tuve mi primera reunión con el equipo."],
  ["Am Nachmittag habe ich alte Verträge in die Ordner sortiert.","Nel pomeriggio ho riordinato i vecchi contratti nei raccoglitori.","À tarde organizei os contratos antigos nos fichários.","Por la tarde ordené los contratos antiguos en los archivadores."],
  ["Am Ende des Tages habe ich meinen Arbeitsvertrag unterschrieben.","Alla fine della giornata ho firmato il mio contratto di lavoro.","No fim do dia assinei meu contrato de trabalho.","Al final del día firmé mi contrato de trabajo."],
  ["Alle waren sehr nett, und ich freue mich auf morgen.","Erano tutti molto gentili e non vedo l'ora che arrivi domani.","Todos foram muito simpáticos e mal posso esperar por amanhã.","Todos fueron muy amables y tengo ganas de que llegue mañana."]]},
 {t:["Ein perfekter Tag","Una giornata perfetta","Um dia perfeito","Un día perfecto"],s:[
  ["Heute hat alles geklappt.","Oggi è andato tutto bene.","Hoje deu tudo certo.","Hoy todo ha salido bien."],
  ["Ich habe um acht Uhr angefangen und zuerst meine E-Mails gelesen.","Ho iniziato alle otto e prima ho letto le mie e-mail.","Comecei às oito e primeiro li meus e-mails.","Empecé a las ocho y primero leí mis correos."],
  ["Eine Kundin hat geschrieben, dass sie mit unserer Beratung sehr zufrieden ist.","Una cliente ha scritto che è molto soddisfatta della nostra consulenza.","Uma cliente escreveu que está muito satisfeita com a nossa consultoria.","Una clienta escribió que está muy satisfecha con nuestro asesoramiento."],
  ["Alle Aufgaben habe ich vor der Frist erledigt.","Ho finito tutti i compiti prima della scadenza.","Terminei todas as tarefas antes do prazo.","Terminé todas las tareas antes del plazo."],
  ["In der Pause hat mir ein Kollege einen Kaffee gebracht.","Durante la pausa un collega mi ha portato un caffè.","No intervalo um colega me trouxe um café.","En el descanso un compañero me trajo un café."],
  ["Am Nachmittag haben wir drei neue Policen abgeschlossen.","Nel pomeriggio abbiamo concluso tre nuove polizze.","À tarde fechamos três apólices novas.","Por la tarde cerramos tres pólizas nuevas."],
  ["Das Protokoll war schnell geschrieben, und mein Chef hat mich gelobt.","Il verbale era pronto in fretta e il mio capo mi ha fatto i complimenti.","A ata ficou pronta rápido, e meu chefe me elogiou.","El acta estuvo lista enseguida y mi jefe me felicitó."],
  ["Um fünf Uhr hatte ich pünktlich Feierabend.","Alle cinque ho finito di lavorare in orario.","Às cinco terminei o expediente na hora certa.","A las cinco terminé la jornada a la hora."]]},
 {t:["Das Telefon klingelt ohne Pause","Il telefono squilla senza sosta","O telefone não para de tocar","El teléfono no para de sonar"],s:[
  ["Am Mittwoch hat das Telefon den ganzen Morgen geklingelt.","Mercoledì il telefono ha squillato tutta la mattina.","Na quarta o telefone tocou a manhã inteira.","El miércoles el teléfono sonó toda la mañana."],
  ["Ich habe jedes Mal gesagt: «Grüezi, Wertia Finanz, was kann ich für Sie tun?»","Ogni volta ho detto: «Buongiorno, Wertia Finanz, cosa posso fare per lei?»","Toda vez eu disse: «Bom dia, Wertia Finanz, em que posso ajudar?»","Cada vez dije: «Buenos días, Wertia Finanz, ¿en qué puedo ayudarle?»"],
  ["Herr Rossi hatte eine Frage zu seiner Police.","Il signor Rossi aveva una domanda sulla sua polizza.","O senhor Rossi tinha uma pergunta sobre a apólice.","El señor Rossi tenía una pregunta sobre su póliza."],
  ["Ich wollte ihn mit Herrn Brunner verbinden, aber die Leitung war besetzt.","Volevo passarlo al signor Brunner, ma la linea era occupata.","Eu quis transferir para o senhor Brunner, mas a linha estava ocupada.","Quise pasarle con el señor Brunner, pero la línea estaba ocupada."],
  ["Also habe ich seine Telefonnummer notiert und eine Nachricht geschrieben.","Così ho annotato il suo numero e ho scritto un messaggio.","Então anotei o número dele e escrevi um recado.","Así que anoté su número y escribí un mensaje."],
  ["Eine Kundin hat sehr schnell Schweizerdeutsch gesprochen.","Una cliente parlava svizzero tedesco molto velocemente.","Uma cliente falou suíço-alemão muito rápido.","Una clienta habló en alemán suizo muy deprisa."],
  ["Ich habe höflich gefragt: «Können Sie das bitte wiederholen?»","Ho chiesto gentilmente: «Può ripetere, per favore?»","Perguntei educadamente: «Pode repetir, por favor?»","Pregunté con educación: «¿Puede repetirlo, por favor?»"],
  ["Am Abend habe ich alle Kunden zurückgerufen.","La sera ho richiamato tutti i clienti.","À noite retornei a ligação de todos os clientes.","Por la tarde devolví la llamada a todos los clientes."]]},
 {t:["Ein schlechter Tag","Una brutta giornata","Um dia ruim","Un mal día"],s:[
  ["Heute ist alles schiefgegangen.","Oggi è andato tutto storto.","Hoje deu tudo errado.","Hoy todo ha salido mal."],
  ["Am Morgen hatte mein Zug zwanzig Minuten Verspätung.","Al mattino il mio treno aveva venti minuti di ritardo.","De manhã meu trem atrasou vinte minutos.","Por la mañana mi tren llevaba veinte minutos de retraso."],
  ["Deshalb musste ich den ersten Termin verschieben.","Per questo ho dovuto spostare il primo appuntamento.","Por isso tive de adiar o primeiro compromisso.","Por eso tuve que aplazar la primera cita."],
  ["Dann hat ein Kunde seinen Termin am Nachmittag abgesagt.","Poi un cliente ha disdetto il suo appuntamento del pomeriggio.","Depois um cliente desmarcou o horário da tarde.","Luego un cliente anuló su cita de la tarde."],
  ["Im Kalender stand ein falsches Datum, und zwei Kunden sind gleichzeitig gekommen.","In agenda c'era una data sbagliata e due clienti sono arrivati insieme.","Na agenda havia uma data errada e dois clientes chegaram ao mesmo tempo.","En la agenda había una fecha equivocada y vinieron dos clientes a la vez."],
  ["Ich habe mich entschuldigt und einen neuen Termin vorgeschlagen.","Ho chiesto scusa e ho proposto un nuovo appuntamento.","Pedi desculpas e propus um novo horário.","Pedí disculpas y propuse una nueva cita."],
  ["«Würde Ihnen Donnerstag um zehn Uhr passen?», habe ich gefragt.","«Le andrebbe bene giovedì alle dieci?», ho chiesto.","«Quinta às dez seria bom para o senhor?», perguntei.","«¿Le vendría bien el jueves a las diez?», pregunté."],
  ["Zum Glück war der Kunde verständnisvoll, und morgen ist ein neuer Tag.","Per fortuna il cliente è stato comprensivo, e domani è un altro giorno.","Por sorte o cliente foi compreensivo, e amanhã é outro dia.","Por suerte el cliente fue comprensivo, y mañana será otro día."]]},
 {t:["Hochsaison bei der Krankenkasse","Alta stagione per le casse malati","Alta temporada do seguro saúde","Temporada alta del seguro médico"],s:[
  ["Im November haben viele Kunden wegen der neuen Prämien angerufen.","A novembre molti clienti hanno chiamato per i nuovi premi.","Em novembro muitos clientes ligaram por causa dos novos prêmios.","En noviembre muchos clientes llamaron por las nuevas primas."],
  ["Frau Huber war verärgert: Ihre Prämie ist um zwölf Prozent gestiegen.","La signora Huber era arrabbiata: il suo premio è aumentato del dodici per cento.","A senhora Huber estava irritada: o prêmio dela subiu doze por cento.","La señora Huber estaba molesta: su prima subió un doce por ciento."],
  ["Ich habe ihre Franchise und ihr Versicherungsmodell geprüft.","Ho controllato la sua franchigia e il suo modello assicurativo.","Verifiquei a franquia e o modelo de seguro dela.","Revisé su franquicia y su modelo de seguro."],
  ["Mit einer höheren Franchise und dem Hausarztmodell spart sie viel Geld.","Con una franchigia più alta e il modello medico di famiglia risparmia molto.","Com uma franquia maior e o modelo médico de família ela economiza muito.","Con una franquicia más alta y el modelo de médico de cabecera ahorra mucho."],
  ["Die Zusatzversicherung hat sie behalten, weil sie schon 60 ist.","La complementare l'ha tenuta, perché ha già 60 anni.","Ela manteve o seguro complementar porque já tem 60 anos.","Mantuvo el seguro complementario porque ya tiene 60 años."],
  ["Ich habe die Kündigung der Grundversicherung noch am selben Tag geschickt.","Ho spedito la disdetta dell'assicurazione di base lo stesso giorno.","Enviei o cancelamento do seguro básico no mesmo dia.","Envié la baja del seguro básico el mismo día."],
  ["Bis zum 30. November habe ich über vierzig neue Policen vorbereitet.","Entro il 30 novembre ho preparato più di quaranta nuove polizze.","Até 30 de novembro preparei mais de quarenta apólices novas.","Hasta el 30 de noviembre preparé más de cuarenta pólizas nuevas."]]},
 {t:["Hagel und Schadenmeldungen","Grandine e notifiche di sinistro","Granizo e comunicações de sinistro","Granizo y declaraciones de siniestro"],s:[
  ["Am Montagmorgen lagen zehn Schadenmeldungen in meinem Postfach.","Lunedì mattina c'erano dieci notifiche di sinistro nella mia casella.","Na segunda de manhã havia dez comunicações de sinistro na minha caixa.","El lunes por la mañana había diez declaraciones de siniestro en mi buzón."],
  ["Am Wochenende hatte es in Winterthur stark gehagelt.","Nel fine settimana a Winterthur aveva grandinato forte.","No fim de semana tinha caído muito granizo em Winterthur.","El fin de semana había granizado mucho en Winterthur."],
  ["Herr Frei hat mir Fotos von seinem neuen Auto geschickt.","Il signor Frei mi ha mandato le foto della sua auto nuova.","O senhor Frei me mandou fotos do carro novo dele.","El señor Frei me envió fotos de su coche nuevo."],
  ["Ich habe seine Police geprüft: Er hat eine Teilkasko, und Hagel ist versichert.","Ho controllato la sua polizza: ha una casco parziale e la grandine è coperta.","Verifiquei a apólice dele: ele tem cobertura parcial, e granizo está coberto.","Revisé su póliza: tiene cobertura parcial y el granizo está cubierto."],
  ["Eine andere Kundin hatte eine Kollision, aber nur eine Haftpflichtversicherung.","Un'altra cliente ha avuto una collisione, ma aveva solo la RC.","Outra cliente teve uma colisão, mas só tinha responsabilidade civil.","Otra clienta tuvo una colisión, pero solo tenía responsabilidad civil."],
  ["Ich musste ihr erklären, dass der Schaden an ihrem Auto nicht gedeckt ist.","Ho dovuto spiegarle che il danno alla sua auto non è coperto.","Tive de explicar a ela que o dano no carro não está coberto.","Tuve que explicarle que el daño en su coche no está cubierto."],
  ["Am Abend hatte ich alle Schäden an die Versicherungen weitergeleitet.","La sera avevo inoltrato tutti i sinistri alle assicurazioni.","À noite eu tinha encaminhado todos os sinistros às seguradoras.","Por la tarde había enviado todos los siniestros a las aseguradoras."]]},
 {t:["Eine Beschwerde","Un reclamo","Uma reclamação","Una queja"],s:[
  ["Heute ist Frau Rossi wütend ins Büro gekommen.","Oggi la signora Rossi è entrata in ufficio arrabbiata.","Hoje a senhora Rossi entrou no escritório furiosa.","Hoy la señora Rossi entró en la oficina enfadada."],
  ["Sie hat Streit mit ihrem Vermieter wegen der Kaution.","Ha una lite con il suo locatore per la cauzione.","Ela está em conflito com o locador por causa do depósito.","Tiene un conflicto con su arrendador por la fianza."],
  ["Die Rechtsschutzversicherung wollte den Anwalt nicht bezahlen.","L'assicurazione di tutela giuridica non voleva pagare l'avvocato.","O seguro de proteção jurídica não queria pagar o advogado.","El seguro de protección jurídica no quería pagar al abogado."],
  ["«Ich zahle seit Jahren Prämien, und jetzt das!», hat sie gesagt.","«Pago premi da anni, e adesso questo!», ha detto.","«Pago prêmios há anos, e agora isso!», ela disse.","«Llevo años pagando primas, ¡y ahora esto!», dijo."],
  ["Ich habe ruhig zugehört und den Vertrag genau gelesen.","Ho ascoltato con calma e ho letto bene il contratto.","Ouvi com calma e li o contrato com atenção.","Escuché con calma y leí el contrato con atención."],
  ["Der Streitfall hatte schon vor dem Vertragsbeginn angefangen.","La controversia era iniziata già prima dell'inizio del contratto.","A disputa tinha começado antes do início do contrato.","El litigio había empezado antes del inicio del contrato."],
  ["Ich habe ihr das freundlich erklärt und eine Schlichtungsstelle empfohlen.","Gliel'ho spiegato con gentilezza e le ho consigliato l'ufficio di conciliazione.","Expliquei isso com gentileza e recomendei a comissão de conciliação.","Se lo expliqué con amabilidad y le recomendé la autoridad de conciliación."],
  ["Am Ende hat sie sich bedankt, und der Fall ist nicht vor Gericht gekommen.","Alla fine mi ha ringraziato e il caso non è finito in tribunale.","No fim ela agradeceu e o caso não foi parar no tribunal.","Al final me dio las gracias y el caso no llegó a los tribunales."]]},
 {t:["Ein Notfall aus dem Ausland","Un'emergenza dall'estero","Uma emergência no exterior","Una emergencia desde el extranjero"],s:[
  ["Am Freitagabend hat mich ein Kunde aus Spanien angerufen.","Venerdì sera un cliente mi ha chiamato dalla Spagna.","Na sexta à noite um cliente me ligou da Espanha.","El viernes por la noche un cliente me llamó desde España."],
  ["Sein Flug war annulliert, und sein Gepäck war verloren.","Il suo volo era stato annullato e il bagaglio era andato perso.","O voo dele tinha sido cancelado e a bagagem tinha se perdido.","Su vuelo había sido cancelado y su equipaje se había perdido."],
  ["Ausserdem hatte seine Tochter hohes Fieber.","Inoltre sua figlia aveva la febbre alta.","Além disso, a filha dele estava com febre alta.","Además, su hija tenía fiebre alta."],
  ["Ich habe sofort seine Reiseversicherung geprüft.","Ho controllato subito la sua assicurazione viaggio.","Verifiquei na hora o seguro viagem dele.","Revisé enseguida su seguro de viaje."],
  ["Dann habe ich ihm die Nummer der Assistance gegeben.","Poi gli ho dato il numero dell'assistenza.","Depois dei a ele o número da assistência.","Luego le di el número de la asistencia."],
  ["Die Assistance hat einen Arzt und ein Hotel organisiert.","L'assistenza ha organizzato un medico e un albergo.","A assistência organizou um médico e um hotel.","La asistencia organizó un médico y un hotel."],
  ["Nach der Rückreise hat er mir alle Quittungen geschickt.","Dopo il viaggio di ritorno mi ha mandato tutte le ricevute.","Depois da viagem de volta ele me mandou todos os recibos.","Después del viaje de regreso me envió todos los recibos."],
  ["Die Versicherung hat die Heilungskosten und das Hotel bezahlt.","L'assicurazione ha pagato le spese di cura e l'albergo.","O seguro pagou as despesas médicas e o hotel.","El seguro pagó los gastos médicos y el hotel."]]},
 {t:["Eine neue Police für Bello","Una nuova polizza per Bello","Uma apólice nova para o Bello","Una póliza nueva para Bello"],s:[
  ["Heute ist eine junge Familie mit ihrem Hund Bello ins Büro gekommen.","Oggi una giovane famiglia è venuta in ufficio con il cane Bello.","Hoje uma família jovem veio ao escritório com o cachorro Bello.","Hoy una familia joven vino a la oficina con su perro Bello."],
  ["Letztes Jahr hatte ihre Katze eine Operation für zweitausend Franken.","L'anno scorso il loro gatto ha subito un'operazione da duemila franchi.","No ano passado o gato deles fez uma cirurgia de dois mil francos.","El año pasado su gato tuvo una operación de dos mil francos."],
  ["Das wollten sie nicht noch einmal selbst bezahlen.","Non volevano pagarlo di nuovo di tasca propria.","Eles não queriam pagar isso de novo do próprio bolso.","No querían volver a pagarlo de su bolsillo."],
  ["Ich habe ihnen drei Tierversicherungen gezeigt.","Ho mostrato loro tre assicurazioni per animali.","Mostrei a eles três seguros pet.","Les mostré tres seguros de mascotas."],
  ["Die Impfungen sind nicht versichert, aber Behandlungen und Operationen schon.","Le vaccinazioni non sono coperte, ma cure e operazioni sì.","As vacinas não estão cobertas, mas tratamentos e cirurgias sim.","Las vacunas no están cubiertas, pero los tratamientos y operaciones sí."],
  ["Ich habe auch geprüft, ob die Hundehaftpflicht in ihrer Privathaftpflicht enthalten ist.","Ho anche verificato se la RC per cani è inclusa nella loro RC privata.","Também verifiquei se a responsabilidade civil para cães está incluída na RC privada deles.","También comprobé si la responsabilidad civil para perros está incluida en su RC privada."],
  ["Die Familie hat die neue Police noch am selben Tag unterschrieben.","La famiglia ha firmato la nuova polizza lo stesso giorno.","A família assinou a apólice nova no mesmo dia.","La familia firmó la póliza nueva el mismo día."]]},
 {t:["Beratung zur Vorsorge","Una consulenza sulla previdenza","Uma consultoria sobre previdência","Un asesoramiento sobre previsión"],s:[
  ["Am Mittwoch hatte ich ein Gespräch mit Marco, 34 Jahre alt.","Mercoledì ho avuto un colloquio con Marco, 34 anni.","Na quarta tive uma conversa com Marco, de 34 anos.","El miércoles tuve una reunión con Marco, de 34 años."],
  ["Marco wusste nicht genau, wie die AHV funktioniert.","Marco non sapeva bene come funziona l'AVS.","Marco não sabia direito como funciona a AHV.","Marco no sabía bien cómo funciona la AHV."],
  ["Ich habe ihm die drei Säulen auf ein Blatt gezeichnet.","Gli ho disegnato i tre pilastri su un foglio.","Desenhei para ele os três pilares numa folha.","Le dibujé los tres pilares en una hoja."],
  ["Dann haben wir seinen Pensionskassenausweis zusammen angeschaut.","Poi abbiamo guardato insieme il suo certificato della cassa pensione.","Depois olhamos juntos o extrato do fundo de pensão dele.","Luego miramos juntos su certificado de la caja de pensiones."],
  ["Wir haben eine Vorsorgelücke von etwa 800 Franken pro Monat gefunden.","Abbiamo trovato una lacuna previdenziale di circa 800 franchi al mese.","Encontramos uma lacuna previdenciária de cerca de 800 francos por mês.","Encontramos una laguna de previsión de unos 800 francos al mes."],
  ["Marco hat beschlossen, jedes Jahr in die Säule 3a einzuzahlen.","Marco ha deciso di versare ogni anno nel pilastro 3a.","Marco decidiu depositar todo ano no pilar 3a.","Marco decidió aportar cada año al pilar 3a."],
  ["So spart er Steuern und sorgt für später vor.","Così risparmia tasse e pensa al futuro.","Assim ele economiza impostos e se prepara para o futuro.","Así ahorra impuestos y se prepara para el futuro."]]},
 {t:["Weiterbildung und Kontrolle","Formazione e controllo","Formação e controle","Formación y control"],s:[
  ["Diese Woche hatte ich zwei Tage Weiterbildung.","Questa settimana ho avuto due giorni di formazione continua.","Esta semana tive dois dias de formação contínua.","Esta semana tuve dos días de formación continua."],
  ["Wir haben über die neuen Gesetze und die Aufsicht der FINMA gesprochen.","Abbiamo parlato delle nuove leggi e della vigilanza della FINMA.","Falamos sobre as novas leis e a supervisão da FINMA.","Hablamos de las nuevas leyes y de la supervisión de la FINMA."],
  ["Wer ungebunden vermittelt, muss im Vermittlerregister stehen.","Chi fa l'intermediario non vincolato deve essere nel registro degli intermediari.","Quem atua como intermediário independente precisa estar no registro de intermediários.","Quien actúa como intermediario independiente debe estar en el registro de intermediarios."],
  ["Am Donnerstag hat unsere Firma eine interne Kontrolle gemacht.","Giovedì la nostra azienda ha fatto un controllo interno.","Na quinta nossa empresa fez um controle interno.","El jueves nuestra empresa hizo un control interno."],
  ["Ich habe gezeigt, dass ich bei jedem Kunden die Informationspflicht erfülle.","Ho mostrato che con ogni cliente adempio all'obbligo d'informazione.","Mostrei que cumpro o dever de informação com cada cliente.","Mostré que cumplo el deber de información con cada cliente."],
  ["In jedem Beratungsprotokoll steht, wie wir bezahlt werden.","In ogni verbale di consulenza c'è scritto come veniamo pagati.","Em cada protocolo de consultoria está escrito como somos remunerados.","En cada acta de asesoramiento consta cómo se nos paga."],
  ["Einen Interessenkonflikt haben wir offen erklärt, und alles war in Ordnung.","Un conflitto d'interessi l'abbiamo dichiarato apertamente, e tutto era in ordine.","Declaramos abertamente um conflito de interesses, e estava tudo em ordem.","Declaramos abiertamente un conflicto de intereses y todo estaba en orden."]]},
 {t:["Die vergessene Vollmacht","La procura dimenticata","A procuração esquecida","El poder olvidado"],s:[
  ["Am Morgen wollte ich Offerten für einen neuen Kunden einholen.","Di mattina volevo richiedere offerte per un nuovo cliente.","De manhã eu queria pedir propostas para um cliente novo.","Por la mañana quería pedir ofertas para un cliente nuevo."],
  ["Dann habe ich gemerkt, dass die Vollmacht fehlte.","Poi ho notato che mancava la procura.","Então percebi que faltava a procuração.","Entonces me di cuenta de que faltaba el poder."],
  ["Ohne Einwilligung darf ich keine Personendaten weitergeben.","Senza consenso non posso trasmettere dati personali.","Sem consentimento não posso repassar dados pessoais.","Sin consentimiento no puedo transmitir datos personales."],
  ["Ich habe den Kunden angerufen und ihm die Situation erklärt.","Ho chiamato il cliente e gli ho spiegato la situazione.","Liguei para o cliente e expliquei a situação.","Llamé al cliente y le expliqué la situación."],
  ["Am Nachmittag hat er die Vollmacht unterschrieben und zurückgeschickt.","Nel pomeriggio ha firmato la procura e l'ha rimandata.","À tarde ele assinou a procuração e a enviou de volta.","Por la tarde firmó el poder y lo devolvió."],
  ["Die Gesundheitsdaten habe ich nur verschlüsselt verschickt.","I dati sulla salute li ho inviati solo criptati.","Os dados de saúde só enviei criptografados.","Los datos de salud solo los envié cifrados."],
  ["«Ihre Daten bleiben vertraulich», habe ich dem Kunden versprochen.","«I suoi dati restano riservati», ho promesso al cliente.","«Os seus dados ficam confidenciais», prometi ao cliente.","«Sus datos permanecen confidenciales», le prometí al cliente."]]},
 {t:["Drei Kunden an einem Tag","Tre clienti in un giorno","Três clientes num dia","Tres clientes en un día"],s:[
  ["Am Donnerstag hatte ich drei Kundengespräche.","Giovedì ho avuto tre colloqui con clienti.","Na quinta tive três reuniões com clientes.","El jueves tuve tres entrevistas con clientes."],
  ["Das erste Paar hatte gerade ein Baby bekommen.","La prima coppia aveva appena avuto un bambino.","O primeiro casal tinha acabado de ter um bebê.","La primera pareja acababa de tener un bebé."],
  ["Ich habe gefragt: «Was ist Ihnen bei einer Versicherung wichtig?»","Ho chiesto: «Cosa è importante per voi in un'assicurazione?»","Perguntei: «O que é importante para vocês num seguro?»","Pregunté: «¿Qué es importante para ustedes en un seguro?»"],
  ["Nach der Bedarfsanalyse habe ich ihre alten Policen geprüft.","Dopo l'analisi dei bisogni ho controllato le loro vecchie polizze.","Depois da análise de necessidades verifiquei as apólices antigas deles.","Tras el análisis de necesidades revisé sus pólizas antiguas."],
  ["Die Deckung für das Baby hat noch gefehlt.","Mancava ancora la copertura per il bambino.","Ainda faltava a cobertura para o bebê.","Todavía faltaba la cobertura para el bebé."],
  ["Der zweite Kunde wollte seine Police kündigen, der dritte eine neue Hausratversicherung.","Il secondo cliente voleva disdire la sua polizza, il terzo una nuova assicurazione mobilia domestica.","O segundo cliente queria cancelar a apólice, o terceiro um seguro residencial novo.","El segundo cliente quería cancelar su póliza, el tercero un seguro de hogar nuevo."],
  ["Ich habe alles im Beratungsprotokoll festgehalten.","Ho messo tutto per iscritto nel verbale di consulenza.","Registrei tudo no protocolo de consultoria.","Lo dejé todo por escrito en el acta de asesoramiento."],
  ["Zum Schluss habe ich gesagt: «Ich schicke Ihnen den Vergleich bis Freitag.»","Alla fine ho detto: «Vi mando il confronto entro venerdì.»","No final eu disse: «Envio a comparação até sexta.»","Al final dije: «Les envío la comparación antes del viernes.»"]]},
 {t:["Der Einwand","L'obiezione","A objeção","La objeción"],s:[
  ["Herr Schmid hat meine Offerte gelesen und die Stirn gerunzelt.","Il signor Schmid ha letto la mia offerta e ha aggrottato la fronte.","O senhor Schmid leu minha proposta e franziu a testa.","El señor Schmid leyó mi oferta y frunció el ceño."],
  ["«Das ist mir zu teuer», hat er gesagt.","«Per me è troppo caro», ha detto.","«Está caro demais para mim», ele disse.","«Es demasiado caro para mí», dijo."],
  ["Ich habe geantwortet: «Ich verstehe Ihren Einwand.»","Ho risposto: «Capisco la sua obiezione.»","Respondi: «Entendo a sua objeção.»","Respondí: «Entiendo su objeción.»"],
  ["Dann habe ich die Vorteile und Nachteile ruhig erklärt.","Poi ho spiegato con calma vantaggi e svantaggi.","Depois expliquei com calma as vantagens e desvantagens.","Luego expliqué con calma las ventajas y desventajas."],
  ["Die Police ist flexibel, das heisst, er kann jedes Jahr kündigen.","La polizza è flessibile, cioè può disdirla ogni anno.","A apólice é flexível, ou seja, ele pode cancelar todo ano.","La póliza es flexible, es decir, puede cancelarla cada año."],
  ["Herr Schmid hat gemerkt, dass das Preis-Leistungs-Verhältnis gut ist.","Il signor Schmid ha capito che il rapporto qualità-prezzo è buono.","O senhor Schmid percebeu que a relação custo-benefício é boa.","El señor Schmid se dio cuenta de que la relación calidad-precio es buena."],
  ["Ich habe ihn überzeugt, und er hat die Lösung angenommen.","L'ho convinto e lui ha accettato la soluzione.","Eu o convenci e ele aceitou a solução.","Lo convencí y aceptó la solución."]]},
 {t:["Ein neuer Firmenkunde","Un nuovo cliente aziendale","Um novo cliente empresarial","Un nuevo cliente empresa"],s:[
  ["Heute hat mich Luca besucht, ein Elektriker aus Zürich.","Oggi è venuto a trovarmi Luca, un elettricista di Zurigo.","Hoje o Luca, um eletricista de Zurique, veio me visitar.","Hoy vino a verme Luca, un electricista de Zúrich."],
  ["Er will sich selbständig machen und hat gefragt: «Einzelfirma oder GmbH?»","Vuole mettersi in proprio e ha chiesto: «Ditta individuale o Sagl?»","Ele quer trabalhar por conta própria e perguntou: «Empresa individual ou GmbH?»","Quiere establecerse por su cuenta y preguntó: «¿Empresa individual o GmbH?»"],
  ["Für eine GmbH braucht er 20'000 Franken Stammkapital und einen Notar.","Per una Sagl gli servono 20'000 franchi di capitale sociale e un notaio.","Para uma GmbH ele precisa de 20'000 francos de capital social e de um tabelião.","Para una GmbH necesita 20'000 francos de capital social y un notario."],
  ["Am Anfang hat er sich für eine Einzelfirma entschieden.","All'inizio ha scelto una ditta individuale.","No começo ele escolheu uma empresa individual.","Al principio se decidió por una empresa individual."],
  ["Ich habe ihm erklärt, wie er die Firma im Handelsregister einträgt.","Gli ho spiegato come iscrivere la ditta nel registro di commercio.","Expliquei a ele como registrar a empresa no registro comercial.","Le expliqué cómo inscribir la empresa en el registro mercantil."],
  ["Dann habe ich ihm eine Betriebshaftpflicht und eine Unfallversicherung offeriert.","Poi gli ho proposto una RC aziendale e un'assicurazione infortuni.","Depois ofereci a ele um seguro de responsabilidade civil empresarial e um seguro de acidentes.","Luego le ofrecí un seguro de responsabilidad civil empresarial y un seguro de accidentes."],
  ["Ab 100'000 Franken Umsatz muss er sich für die Mehrwertsteuer anmelden.","Da 100'000 franchi di fatturato dovrà registrarsi per l'IVA.","A partir de 100'000 francos de faturamento ele terá de se registrar para o IVA.","A partir de 100'000 francos de facturación tendrá que darse de alta en el IVA."],
  ["Mit seinen drei neuen Policen ist Luca jetzt unser Firmenkunde.","Con le sue tre nuove polizze ora Luca è nostro cliente aziendale.","Com as três apólices novas, Luca agora é nosso cliente empresarial.","Con sus tres pólizas nuevas, Luca ya es nuestro cliente empresa."]]},
 {t:["Buchhaltung am Monatsende","La contabilità di fine mese","A contabilidade no fim do mês","La contabilidad de fin de mes"],s:[
  ["Am letzten Tag des Monats mache ich immer die Buchhaltung.","L'ultimo giorno del mese faccio sempre la contabilità.","No último dia do mês sempre faço a contabilidade.","El último día del mes siempre hago la contabilidad."],
  ["Zuerst habe ich alle Provisionen der Versicherungen kontrolliert.","Prima ho controllato tutte le provvigioni delle assicurazioni.","Primeiro conferi todas as comissões das seguradoras.","Primero revisé todas las comisiones de las aseguradoras."],
  ["Eine Versicherung hatte zu wenig Provision bezahlt.","Un'assicurazione aveva pagato troppo poca provvigione.","Uma seguradora tinha pago comissão de menos.","Una aseguradora había pagado menos comisión de la debida."],
  ["Dann habe ich die Rechnungen bezahlt und die Belege abgelegt.","Poi ho pagato le fatture e archiviato i giustificativi.","Depois paguei as faturas e arquivei os comprovantes.","Luego pagué las facturas y archivé los justificantes."],
  ["Für unsere neue Mitarbeiterin mit Bewilligung B habe ich die Quellensteuer berechnet.","Per la nostra nuova collaboratrice con permesso B ho calcolato l'imposta alla fonte.","Para a nossa nova funcionária com autorização B calculei o imposto na fonte.","Para nuestra nueva empleada con permiso B calculé el impuesto en la fuente."],
  ["Ich habe auch die Abzüge für AHV und Pensionskasse geprüft.","Ho controllato anche le deduzioni per AVS e cassa pensione.","Também conferi as deduções para AHV e fundo de pensão.","También revisé las deducciones de AHV y caja de pensiones."],
  ["Im Januar bekommt jeder Mitarbeiter seinen Lohnausweis für die Steuererklärung.","A gennaio ogni collaboratore riceve il certificato di salario per la dichiarazione d'imposta.","Em janeiro cada funcionário recebe o certificado de salário para a declaração de imposto.","En enero cada empleado recibe su certificado de salario para la declaración de impuestos."],
  ["Am Abend stimmte die Buchhaltung auf den Rappen genau.","La sera la contabilità tornava fino all'ultimo centesimo.","À noite a contabilidade batia até o último centavo.","Por la tarde la contabilidad cuadraba hasta el último céntimo."]]},
 {t:["Ein Tag voller E-Mails","Una giornata piena di e-mail","Um dia cheio de e-mails","Un día lleno de correos"],s:[
  ["Heute Morgen hatte ich 45 neue E-Mails im Posteingang.","Stamattina avevo 45 nuove e-mail nella casella.","Hoje de manhã eu tinha 45 e-mails novos na caixa de entrada.","Esta mañana tenía 45 correos nuevos en la bandeja de entrada."],
  ["Zuerst habe ich die dringenden E-Mails beantwortet.","Prima ho risposto alle e-mail urgenti.","Primeiro respondi aos e-mails urgentes.","Primero respondí a los correos urgentes."],
  ["Einem Kunden habe ich die Offerte geschickt, aber den Anhang vergessen.","A un cliente ho mandato l'offerta, ma ho dimenticato l'allegato.","Mandei a proposta a um cliente, mas esqueci o anexo.","A un cliente le envié la oferta, pero olvidé el adjunto."],
  ["Fünf Minuten später habe ich geschrieben: «Entschuldigung, hier ist der Anhang.»","Cinque minuti dopo ho scritto: «Mi scusi, ecco l'allegato.»","Cinco minutos depois escrevi: «Desculpe, aqui está o anexo.»","Cinco minutos después escribí: «Disculpe, aquí está el adjunto.»"],
  ["Eine Beschwerde habe ich an meinen Chef weitergeleitet.","Ho inoltrato un reclamo al mio capo.","Encaminhei uma reclamação ao meu chefe.","Reenvié una queja a mi jefe."],
  ["Bei jeder E-Mail habe ich auf die richtige Anrede geachtet.","In ogni e-mail ho fatto attenzione al saluto giusto.","Em cada e-mail prestei atenção à saudação certa.","En cada correo cuidé el saludo correcto."],
  ["Und ich habe Sie, Ihnen und Ihr immer gross geschrieben.","E ho sempre scritto Sie, Ihnen e Ihr con la maiuscola.","E sempre escrevi Sie, Ihnen e Ihr com maiúscula.","Y siempre escribí Sie, Ihnen e Ihr con mayúscula."],
  ["Am Abend war mein Posteingang endlich leer.","La sera la mia casella era finalmente vuota.","À noite minha caixa de entrada finalmente estava vazia.","Por la tarde mi bandeja de entrada por fin estaba vacía."]]},
 {u:5,t:["Der Versicherungsnachweis","L'attestato d'assicurazione","O comprovante de seguro","El justificante de seguro"],s:[
  ["Herr Frei hat ein neues Auto gekauft und wollte es so schnell wie möglich einlösen.","Il signor Frei ha comprato un'auto nuova e voleva immatricolarla il prima possibile.","O senhor Frei comprou um carro novo e queria emplacá-lo o quanto antes.","El señor Frei compró un coche nuevo y quería matricularlo lo antes posible."],
  ["Dafür braucht das Strassenverkehrsamt einen Versicherungsnachweis.","Per questo l'Ufficio della circolazione ha bisogno di un attestato d'assicurazione.","Para isso o departamento de trânsito precisa de um comprovante de seguro.","Para ello la oficina de tráfico necesita un justificante de seguro."],
  ["Ich habe bei der Versicherung den Antrag für die Autoversicherung eingereicht.","Ho inoltrato all'assicurazione la proposta per l'assicurazione auto.","Enviei à seguradora a proposta do seguro auto.","Presenté a la aseguradora la solicitud del seguro de coche."],
  ["Gleichzeitig habe ich per E-Mail den Versicherungsnachweis angefordert.","Contemporaneamente ho richiesto per e-mail l'attestato d'assicurazione.","Ao mesmo tempo pedi por e-mail o comprovante de seguro.","Al mismo tiempo pedí por correo el justificante de seguro."],
  ["«Bitte senden Sie den Nachweis elektronisch an das Strassenverkehrsamt Zürich.»","«Vi prego di inviare l'attestato in forma elettronica all'Ufficio della circolazione di Zurigo.»","«Por favor, enviem o comprovante eletronicamente ao departamento de trânsito de Zurique.»","«Por favor, envíen el justificante electrónicamente a la oficina de tráfico de Zúrich.»"],
  ["Die Versicherung hat den Nachweis noch am selben Tag übermittelt.","L'assicurazione ha trasmesso l'attestato lo stesso giorno.","A seguradora transmitiu o comprovante no mesmo dia.","La aseguradora transmitió el justificante el mismo día."],
  ["Am nächsten Morgen habe ich beim Strassenverkehrsamt angerufen, um nachzufragen.","La mattina dopo ho chiamato l'Ufficio della circolazione per informarmi.","Na manhã seguinte liguei para o departamento de trânsito para confirmar.","A la mañana siguiente llamé a la oficina de tráfico para preguntar."],
  ["Die Mitarbeiterin hat gesagt: «Der Nachweis ist bei uns eingegangen.»","L'impiegata ha detto: «L'attestato ci è arrivato.»","A atendente disse: «O comprovante já chegou.»","La empleada dijo: «El justificante nos ha llegado.»"],
  ["Herr Frei konnte seine Kontrollschilder abholen und mit dem neuen Auto losfahren.","Il signor Frei ha potuto ritirare le targhe e partire con l'auto nuova.","O senhor Frei pôde buscar as placas e sair com o carro novo.","El señor Frei pudo recoger las matrículas y salir con su coche nuevo."]]}

 {u:4,k:"case",t:["Die Spitalrechnung","La fattura dell'ospedale","A conta do hospital","La factura del hospital"],h:{0:"fall",3:"how",7:"act"},s:[
  ["Heute hat eine Kundin angerufen, weil sie nach einer Lungenentzündung eine Spitalrechnung bekommen hat.","Oggi ha chiamato una cliente perché, dopo una polmonite, ha ricevuto una fattura dell'ospedale.","Hoje uma cliente ligou porque, depois de uma pneumonia, recebeu uma conta do hospital.","Hoy ha llamado una clienta porque, tras una neumonía, recibió una factura del hospital."],
  ["Sie wusste nicht, was die Krankenkasse bezahlt und was sie selbst zahlen muss.","Non sapeva cosa paga la cassa malati e cosa deve pagare lei.","Ela não sabia o que o seguro saúde paga e o que ela mesma tem de pagar.","No sabía qué paga el seguro médico y qué tiene que pagar ella."],
  ["Sie hat eine Franchise von 2'500 Franken.","Ha una franchigia di 2'500 franchi.","Ela tem uma franquia de 2'500 francos.","Tiene una franquicia de 2'500 francos."],
  ["Die Grundversicherung bezahlt die Behandlung auf der allgemeinen Abteilung.","L'assicurazione di base paga la cura nel reparto comune.","O seguro básico paga o tratamento na ala geral.","El seguro básico paga el tratamiento en la sala general."],
  ["Zuerst zahlt die Kundin die Franchise, also die ersten 2'500 Franken im Jahr.","Prima la cliente paga la franchigia, cioè i primi 2'500 franchi dell'anno.","Primeiro a cliente paga a franquia, ou seja, os primeiros 2'500 francos do ano.","Primero la clienta paga la franquicia, es decir, los primeros 2'500 francos del año."],
  ["Danach zahlt sie zehn Prozent Selbstbehalt, höchstens 700 Franken pro Jahr.","Poi paga il dieci per cento di aliquota percentuale, al massimo 700 franchi all'anno.","Depois paga dez por cento de coparticipação, no máximo 700 francos por ano.","Después paga un diez por ciento de copago, como máximo 700 francos al año."],
  ["Für jeden Tag im Spital kommt ein Beitrag von 15 Franken dazu.","Per ogni giorno in ospedale si aggiunge un contributo di 15 franchi.","Para cada dia no hospital há uma contribuição de 15 francos.","Por cada día en el hospital se añade una contribución de 15 francos."],
  ["Bei einem Spitalaufenthalt schickt das Spital die Rechnung direkt an die Krankenkasse.","In caso di degenza l'ospedale manda la fattura direttamente alla cassa malati.","Numa internação o hospital envia a conta diretamente ao seguro saúde.","En una hospitalización el hospital envía la factura directamente al seguro médico."],
  ["Die Kundin bekommt danach eine Leistungsabrechnung und zahlt ihren Anteil an die Krankenkasse.","Poi la cliente riceve un conteggio delle prestazioni e paga la sua parte alla cassa malati.","Depois a cliente recebe um extrato de prestações e paga a parte dela ao seguro.","Después la clienta recibe una liquidación de prestaciones y paga su parte al seguro."],
  ["Arztrechnungen kann sie in der App der Krankenkasse fotografieren und hochladen.","Le fatture del medico può fotografarle e caricarle nell'app della cassa malati.","As contas do médico ela pode fotografar e enviar pelo aplicativo do seguro.","Las facturas del médico puede fotografiarlas y subirlas en la app del seguro."]],

 {u:5,k:"case",t:["Ein Auffahrunfall","Un tamponamento","Uma batida na traseira","Un alcance por detrás"],h:{0:"fall",3:"how",6:"act"},s:[
  ["Heute Morgen hat mich Herr Berisha angerufen: Er ist auf ein anderes Auto aufgefahren.","Stamattina mi ha chiamato il signor Berisha: ha tamponato un'altra auto.","Hoje de manhã o senhor Berisha me ligou: ele bateu na traseira de outro carro.","Esta mañana me llamó el señor Berisha: chocó por detrás contra otro coche."],
  ["Niemand wurde verletzt, aber beide Autos sind beschädigt.","Nessuno è rimasto ferito, ma entrambe le auto sono danneggiate.","Ninguém se feriu, mas os dois carros estão danificados.","Nadie resultó herido, pero los dos coches están dañados."],
  ["Er wollte wissen, welche Versicherung was bezahlt.","Voleva sapere quale assicurazione paga cosa.","Ele queria saber qual seguro paga o quê.","Quería saber qué seguro paga qué."],
  ["Seine Haftpflichtversicherung bezahlt den Schaden am anderen Auto.","La sua RC paga il danno all'altra auto.","O seguro de responsabilidade civil dele paga o dano no outro carro.","Su seguro de responsabilidad civil paga el daño del otro coche."],
  ["Den Schaden an seinem eigenen Auto bezahlt nur die Vollkasko.","Il danno alla sua auto lo paga solo la casco totale.","O dano no próprio carro só a cobertura total paga.","El daño de su propio coche solo lo paga la cobertura total."],
  ["Weil er den Unfall verursacht hat, verliert er Bonus, und die Prämie steigt.","Poiché ha causato l'incidente, perde il bonus e il premio aumenta.","Como ele causou o acidente, perde bônus e o prêmio sobe.","Como causó el accidente, pierde bonificación y la prima sube."],
  ["Am Unfallort haben die beiden Fahrer das europäische Unfallprotokoll ausgefüllt.","Sul luogo dell'incidente i due conducenti hanno compilato la constatazione amichevole europea.","No local do acidente os dois motoristas preencheram a declaração amigável europeia.","En el lugar del accidente los dos conductores rellenaron el parte europeo de accidente."],
  ["Ich habe ihm geholfen, den Schaden online bei der Versicherung zu melden.","L'ho aiutato a notificare il sinistro online all'assicurazione.","Ajudei-o a comunicar o sinistro online à seguradora.","Le ayudé a declarar el siniestro en línea a la aseguradora."],
  ["Die Versicherung schickt einen Experten, und erst dann wird das Auto repariert.","L'assicurazione manda un perito, e solo dopo l'auto viene riparata.","A seguradora envia um perito, e só então o carro é consertado.","La aseguradora envía un perito y solo entonces se repara el coche."],
  ["Bei kleinen Schäden lohnt es sich manchmal, selbst zu bezahlen, um den Bonus zu behalten.","Per piccoli danni a volte conviene pagare di tasca propria per mantenere il bonus.","Em danos pequenos às vezes compensa pagar do próprio bolso para manter o bônus.","Con daños pequeños a veces conviene pagar uno mismo para conservar la bonificación."]],

  ["Heute hat eine Kundin angerufen, weil sie eine Rechtsschutzversicherung wollte.","Oggi una cliente ha chiamato perché voleva un'assicurazione di tutela giuridica.","Hoje uma cliente ligou porque queria um seguro de proteção jurídica.","Hoy una clienta llamó porque quería un seguro de protección jurídica."],
  ["Ihr Arbeitgeber hat ihr gekündigt und den letzten Lohn nicht bezahlt.","Il suo datore di lavoro l'ha licenziata e non le ha pagato l'ultimo stipendio.","O empregador a demitiu e não pagou o último salário.","Su empleador la despidió y no le pagó el último sueldo."],
  ["Leider kann man eine Versicherung nicht abschliessen, wenn der Streit schon begonnen hat.","Purtroppo non si può stipulare un'assicurazione quando la lite è già iniziata.","Infelizmente não se pode contratar um seguro quando o conflito já começou.","Por desgracia no se puede contratar un seguro cuando el conflicto ya ha empezado."],
  ["Ich habe ihr erklärt: Bis 30'000 Franken Streitwert gibt es am Arbeitsgericht keine Gerichtskosten.","Le ho spiegato: fino a 30'000 franchi di valore litigioso al tribunale del lavoro non ci sono spese giudiziarie.","Expliquei a ela: até 30'000 francos de valor em disputa, não há custas judiciais no tribunal do trabalho.","Le expliqué: hasta 30'000 francos de cuantía, no hay costas judiciales en el tribunal laboral."],
  ["Für die Zukunft hat sie eine Rechtsschutzversicherung für Privat und Beruf abgeschlossen.","Per il futuro ha stipulato una tutela giuridica per vita privata e lavoro.","Para o futuro ela contratou uma proteção jurídica para a vida privada e o trabalho.","Para el futuro contrató una protección jurídica para la vida privada y el trabajo."],
  ["Die Versicherung bezahlt Anwalt, Gerichtskosten und Gutachten bis zur vereinbarten Summe.","L'assicurazione paga avvocato, spese giudiziarie e perizie fino alla somma concordata.","O seguro paga advogado, custas judiciais e perícias até o valor acordado.","El seguro paga abogado, costas judiciales y peritajes hasta la suma acordada."],
  ["Oft gibt es eine Wartefrist von drei Monaten, besonders im Arbeitsrecht.","Spesso c'è un periodo d'attesa di tre mesi, soprattutto nel diritto del lavoro.","Muitas vezes há um período de carência de três meses, sobretudo no direito do trabalho.","A menudo hay un período de carencia de tres meses, sobre todo en derecho laboral."],
  ["Wenn ein neuer Streit entsteht, meldet sie den Fall sofort per Telefon oder online.","Se nasce una nuova lite, notifica subito il caso per telefono o online.","Se surgir um novo conflito, ela comunica o caso logo por telefone ou online.","Si surge un nuevo conflicto, comunica el caso enseguida por teléfono o en línea."],
  ["Zuerst versucht ein Jurist der Versicherung, das Problem ohne Gericht zu lösen.","Prima un giurista dell'assicurazione cerca di risolvere il problema senza tribunale.","Primeiro um jurista do seguro tenta resolver o problema sem tribunal.","Primero un jurista del seguro intenta resolver el problema sin tribunal."],
  ["Einen eigenen Anwalt soll sie erst nach Rücksprache mit der Versicherung beauftragen.","Un avvocato proprio deve incaricarlo solo dopo aver parlato con l'assicurazione.","Ela só deve contratar um advogado próprio depois de falar com o seguro.","Solo debe contratar a un abogado propio después de hablar con el seguro."]],
  v:[["der Lohn","lo stipendio","o salário","el sueldo"],["der Streitwert","il valore litigioso","o valor em disputa","la cuantía"],["das Arbeitsgericht","il tribunale del lavoro","o tribunal do trabalho","el tribunal laboral"],["die Gerichtskosten","le spese giudiziarie","as custas judiciais","las costas judiciales"],["das Gutachten","la perizia","a perícia","el peritaje"],["die Wartefrist","il periodo d'attesa","o período de carência","el período de carencia"],["der Jurist","il giurista","o jurista","el jurista"],["beauftragen","incaricare","contratar","encargar"]]},
 {u:7,k:"case",t:["Die Reise fällt ins Wasser","Il viaggio salta","A viagem foi por água abaixo","El viaje se cancela"],h:{0:"fall",3:"how",6:"act"},s:[
  ["Eine Kundin hat angerufen: Ihr Sohn ist zwei Tage vor den Ferien krank geworden.","Una cliente ha chiamato: suo figlio si è ammalato due giorni prima delle vacanze.","Uma cliente ligou: o filho dela ficou doente dois dias antes das férias.","Una clienta llamó: su hijo se puso enfermo dos días antes de las vacaciones."],
  ["Die Familie konnte nicht nach Mallorca fliegen.","La famiglia non ha potuto volare a Maiorca.","A família não pôde voar para Maiorca.","La familia no pudo volar a Mallorca."],
  ["Die Reise hat 3'200 Franken gekostet.","Il viaggio era costato 3'200 franchi.","A viagem custou 3'200 francos.","El viaje costó 3'200 francos."],
  ["Die Annullierungskostenversicherung bezahlt, wenn man wegen Krankheit, Unfall oder Todesfall nicht reisen kann.","L'assicurazione spese d'annullamento paga se non si può partire per malattia, infortunio o decesso.","O seguro de cancelamento paga se não se pode viajar por doença, acidente ou morte.","El seguro de cancelación paga si no se puede viajar por enfermedad, accidente o fallecimiento."],
  ["Sie gilt auch, wenn ein Familienmitglied krank wird.","Vale anche se si ammala un familiare.","Vale também se um familiar ficar doente.","También vale si enferma un familiar."],
  ["Wichtig: Man muss die Reise sofort annullieren, sonst steigen die Kosten.","Importante: bisogna annullare subito il viaggio, altrimenti i costi aumentano.","Importante: é preciso cancelar a viagem imediatamente, senão os custos sobem.","Importante: hay que cancelar el viaje enseguida, si no, los costes suben."],
  ["Die Kundin hat die Reise noch am selben Tag beim Reisebüro annulliert.","La cliente ha annullato il viaggio in agenzia lo stesso giorno.","A cliente cancelou a viagem na agência no mesmo dia.","La clienta canceló el viaje en la agencia el mismo día."],
  ["Der Arzt hat ein Arztzeugnis ausgestellt.","Il medico ha rilasciato un certificato medico.","O médico emitiu um atestado médico.","El médico emitió un certificado médico."],
  ["Dann haben wir die Schadenmeldung mit Buchungsbestätigung, Annullierungsrechnung und Arztzeugnis eingereicht.","Poi abbiamo inoltrato la notifica di sinistro con conferma di prenotazione, fattura d'annullamento e certificato medico.","Depois enviamos a comunicação de sinistro com a confirmação da reserva, a fatura de cancelamento e o atestado.","Luego presentamos la declaración de siniestro con la confirmación de reserva, la factura de cancelación y el certificado médico."],
  ["Drei Wochen später hat die Versicherung die Kosten zurückerstattet.","Tre settimane dopo l'assicurazione ha rimborsato i costi.","Três semanas depois a seguradora reembolsou os custos.","Tres semanas después la aseguradora reembolsó los gastos."]],
  v:[["die Annullierungskosten","le spese d'annullamento","os custos de cancelamento","los gastos de cancelación"],["der Todesfall","il decesso","a morte","el fallecimiento"],["das Familienmitglied","il familiare","o familiar","el familiar"],["das Reisebüro","l'agenzia di viaggi","a agência de viagens","la agencia de viajes"],["das Arztzeugnis","il certificato medico","o atestado médico","el certificado médico"],["die Buchungsbestätigung","la conferma di prenotazione","a confirmação de reserva","la confirmación de reserva"],["einreichen","inoltrare","enviar","presentar"],["zurückerstatten","rimborsare","reembolsar","reembolsar"]]},
 {u:8,k:"case",t:["Der Hund und das Velo","Il cane e la bici","O cachorro e a bicicleta","El perro y la bici"],h:{0:"fall",3:"how",6:"act"},s:[
  ["Ein Kunde hat angerufen: Sein Hund ist auf die Strasse gerannt.","Un cliente ha chiamato: il suo cane è corso in strada.","Um cliente ligou: o cachorro dele correu para a rua.","Un cliente llamó: su perro salió corriendo a la calle."],
  ["Eine Velofahrerin ist gestürzt, und ihr Velo ist kaputt.","Una ciclista è caduta e la sua bici è rotta.","Uma ciclista caiu e a bicicleta dela quebrou.","Una ciclista se cayó y su bici se rompió."],
  ["Zum Glück ist sie nur leicht verletzt.","Per fortuna è ferita solo leggermente.","Por sorte ela só se feriu levemente.","Por suerte solo tiene heridas leves."],
  ["Als Hundehalter haftet der Kunde für den Schaden, den sein Hund verursacht.","Come detentore del cane il cliente risponde del danno causato dal suo cane.","Como dono do cachorro, o cliente responde pelo dano que o animal causa.","Como dueño del perro, el cliente responde del daño que causa su perro."],
  ["Seine Privathaftpflicht deckt Schäden durch Haustiere.","La sua RC privata copre i danni causati da animali domestici.","A RC privada dele cobre danos causados por animais de estimação.","Su RC privada cubre los daños causados por animales domésticos."],
  ["Die Tierversicherung bezahlt dagegen nur die Behandlung des eigenen Hundes.","L'assicurazione per animali invece paga solo le cure del proprio cane.","O seguro pet, por outro lado, só paga o tratamento do próprio cachorro.","El seguro de mascotas, en cambio, solo paga el tratamiento del propio perro."],
  ["Der Kunde hat Name und Adresse der Velofahrerin notiert.","Il cliente ha annotato nome e indirizzo della ciclista.","O cliente anotou nome e endereço da ciclista.","El cliente anotó el nombre y la dirección de la ciclista."],
  ["Er soll den Schaden nicht selbst anerkennen oder bezahlen.","Non deve riconoscere né pagare il danno di sua iniziativa.","Ele não deve reconhecer nem pagar o dano por conta própria.","No debe reconocer ni pagar el daño por su cuenta."],
  ["Ich habe den Fall mit Fotos und der Velorechnung der Haftpflichtversicherung gemeldet.","Ho notificato il caso alla RC con le foto e la fattura della bici.","Comuniquei o caso ao seguro de responsabilidade civil com fotos e a nota da bicicleta.","Comuniqué el caso al seguro de responsabilidad civil con fotos y la factura de la bici."],
  ["Die Versicherung prüft den Fall und bezahlt die Velofahrerin direkt.","L'assicurazione esamina il caso e paga direttamente la ciclista.","A seguradora analisa o caso e paga a ciclista diretamente.","La aseguradora examina el caso y paga directamente a la ciclista."]],
  v:[["der Hundehalter","il detentore del cane","o dono do cachorro","el dueño del perro"],["die Velofahrerin","la ciclista","a ciclista","la ciclista"],["das Velo","la bici (CH)","a bicicleta","la bici"],["stürzen","cadere","cair","caerse"],["haften für","rispondere di","responder por","responder de"],["das Haustier","l'animale domestico","o animal de estimação","el animal doméstico"],["anerkennen","riconoscere","reconhecer","reconocer"],["dagegen","invece","por outro lado","en cambio"]]},
 {u:9,k:"case",t:["Ein Konto 3a eröffnen","Aprire un conto 3a","Abrir uma conta 3a","Abrir una cuenta 3a"],h:{0:"fall",3:"how",7:"act"},s:[
  ["Eine junge Kundin hat gefragt, wie sie Steuern sparen kann.","Una giovane cliente ha chiesto come può risparmiare tasse.","Uma cliente jovem perguntou como pode economizar impostos.","Una clienta joven preguntó cómo puede ahorrar impuestos."],
  ["Sie ist angestellt und hat eine Pensionskasse.","È dipendente e ha una cassa pensione.","Ela é empregada e tem fundo de pensão.","Es empleada y tiene caja de pensiones."],
  ["Ich habe ihr die Säule 3a vorgeschlagen.","Le ho proposto il pilastro 3a.","Propus a ela o pilar 3a.","Le propuse el pilar 3a."],
  ["Mit Pensionskasse kann sie jedes Jahr bis zum Maximalbetrag einzahlen, aktuell gut 7'000 Franken.","Con la cassa pensione può versare ogni anno fino all'importo massimo, attualmente poco più di 7'000 franchi.","Com fundo de pensão ela pode depositar por ano até o valor máximo, hoje pouco mais de 7'000 francos.","Con caja de pensiones puede aportar cada año hasta el importe máximo, actualmente algo más de 7'000 francos."],
  ["Den ganzen Betrag kann sie vom steuerbaren Einkommen abziehen.","Può dedurre l'intero importo dal reddito imponibile.","Ela pode deduzir o valor inteiro da renda tributável.","Puede deducir todo el importe de la renta imponible."],
  ["Das Geld ist gebunden: Sie kann es frühestens fünf Jahre vor der Pensionierung beziehen.","Il denaro è vincolato: può prelevarlo al più presto cinque anni prima del pensionamento.","O dinheiro fica vinculado: ela pode retirá-lo no mínimo cinco anos antes da aposentadoria.","El dinero está vinculado: puede retirarlo como pronto cinco años antes de la jubilación."],
  ["Ausnahmen sind zum Beispiel ein Hauskauf oder die Selbständigkeit.","Eccezioni sono ad esempio l'acquisto di una casa o l'attività indipendente.","Exceções são, por exemplo, a compra de uma casa ou trabalhar por conta própria.","Excepciones son, por ejemplo, la compra de una vivienda o hacerse autónomo."],
  ["Sie kann ein Konto 3a bei einer Bank oder eine Police 3a bei einer Versicherung eröffnen.","Può aprire un conto 3a in banca o una polizza 3a presso un'assicurazione.","Ela pode abrir uma conta 3a num banco ou uma apólice 3a numa seguradora.","Puede abrir una cuenta 3a en un banco o una póliza 3a en una aseguradora."],
  ["Die Einzahlung muss bis zum 31. Dezember auf dem Konto sein.","Il versamento deve arrivare sul conto entro il 31 dicembre.","O depósito deve estar na conta até 31 de dezembro.","El aporte debe estar en la cuenta antes del 31 de diciembre."],
  ["Im Januar bekommt sie eine Bescheinigung für die Steuererklärung.","A gennaio riceve un attestato per la dichiarazione d'imposta.","Em janeiro ela recebe um certificado para a declaração de imposto.","En enero recibe un certificado para la declaración de impuestos."]],
  v:[["angestellt","dipendente","empregado","empleado"],["der Maximalbetrag","l'importo massimo","o valor máximo","el importe máximo"],["steuerbar","imponibile","tributável","imponible"],["abziehen","dedurre","deduzir","deducir"],["gebunden","vincolato","vinculado","vinculado"],["beziehen","prelevare","retirar","retirar"],["die Pensionierung","il pensionamento","a aposentadoria","la jubilación"],["die Bescheinigung","l'attestato","o certificado","el certificado"]]},
 {u:11,k:"case",t:["Welche Daten haben Sie über mich?","Quali dati avete su di me?","Que dados vocês têm sobre mim?","¿Qué datos tienen sobre mí?"],h:{0:"fall",2:"how",6:"act"},s:[
  ["Ein Kunde hat geschrieben: Er möchte wissen, welche Daten wir über ihn haben.","Un cliente ha scritto: vuole sapere quali dati abbiamo su di lui.","Um cliente escreveu: quer saber quais dados temos sobre ele.","Un cliente escribió: quiere saber qué datos tenemos sobre él."],
  ["Ausserdem will er, dass wir seine alten Offerten löschen.","Inoltre vuole che cancelliamo le sue vecchie offerte.","Além disso, quer que apaguemos as propostas antigas dele.","Además quiere que borremos sus ofertas antiguas."],
  ["Nach dem Datenschutzgesetz hat jede Person ein Auskunftsrecht.","Secondo la legge sulla protezione dei dati ogni persona ha un diritto d'accesso.","Segundo a lei de proteção de dados, toda pessoa tem direito de acesso.","Según la ley de protección de datos, toda persona tiene derecho de acceso."],
  ["Wir müssen die Auskunft in der Regel innerhalb von 30 Tagen und kostenlos geben.","Dobbiamo dare l'informazione di regola entro 30 giorni e gratuitamente.","Em regra temos de dar a informação em até 30 dias e de graça.","Por regla general debemos dar la información en 30 días y gratis."],
  ["Daten, die wir nicht mehr brauchen, müssen wir löschen.","I dati che non ci servono più dobbiamo cancellarli.","Os dados de que não precisamos mais devemos apagar.","Los datos que ya no necesitamos debemos borrarlos."],
  ["Verträge und Buchhaltungsbelege müssen wir aber zehn Jahre aufbewahren.","Contratti e giustificativi contabili però dobbiamo conservarli dieci anni.","Mas contratos e comprovantes contábeis temos de guardar por dez anos.","Pero los contratos y justificantes contables debemos conservarlos diez años."],
  ["Zuerst habe ich seine Identität geprüft, zum Beispiel mit einer Kopie der ID.","Prima ho verificato la sua identità, ad esempio con una copia della carta d'identità.","Primeiro verifiquei a identidade dele, por exemplo com uma cópia do documento.","Primero comprobé su identidad, por ejemplo con una copia del documento de identidad."],
  ["Dann habe ich alle seine Daten aus unserem System zusammengestellt.","Poi ho raccolto tutti i suoi dati dal nostro sistema.","Depois reuni todos os dados dele do nosso sistema.","Luego reuní todos sus datos de nuestro sistema."],
  ["Die alten Offerten habe ich gelöscht und ihm alles schriftlich bestätigt.","Ho cancellato le vecchie offerte e gli ho confermato tutto per iscritto.","Apaguei as propostas antigas e confirmei tudo por escrito.","Borré las ofertas antiguas y se lo confirmé todo por escrito."]],
  v:[["das Datenschutzgesetz","la legge sulla protezione dei dati","a lei de proteção de dados","la ley de protección de datos"],["das Auskunftsrecht","il diritto d'accesso","o direito de acesso","el derecho de acceso"],["kostenlos","gratuito","gratuito","gratuito"],["löschen","cancellare","apagar","borrar"],["aufbewahren","conservare","guardar","conservar"],["die Identität","l'identità","a identidade","la identidad"],["zusammenstellen","raccogliere","reunir","reunir"],["schriftlich","per iscritto","por escrito","por escrito"]]},
 {u:14,k:"case",t:["Der erste Mitarbeiter","Il primo dipendente","O primeiro funcionário","El primer empleado"],h:{0:"fall",2:"how",7:"act"},s:[
  ["Luca hat angerufen: Er stellt seinen ersten Mitarbeiter ein.","Luca ha chiamato: assume il suo primo dipendente.","Luca ligou: ele vai contratar o primeiro funcionário.","Luca llamó: va a contratar a su primer empleado."],
  ["Er wusste nicht, welche Versicherungen jetzt Pflicht sind.","Non sapeva quali assicurazioni ora sono obbligatorie.","Ele não sabia quais seguros agora são obrigatórios.","No sabía qué seguros son ahora obligatorios."],
  ["Jeder Arbeitgeber muss seine Mitarbeiter gegen Unfall versichern.","Ogni datore di lavoro deve assicurare i dipendenti contro gli infortuni.","Todo empregador deve segurar os funcionários contra acidentes.","Todo empleador debe asegurar a sus empleados contra accidentes."],
  ["Wer mindestens acht Stunden pro Woche arbeitet, ist auch für Freizeitunfälle versichert.","Chi lavora almeno otto ore a settimana è assicurato anche per gli infortuni nel tempo libero.","Quem trabalha pelo menos oito horas por semana também está segurado para acidentes fora do trabalho.","Quien trabaja al menos ocho horas a la semana también está asegurado en accidentes fuera del trabajo."],
  ["Ausserdem muss er ihn bei der AHV-Ausgleichskasse anmelden.","Inoltre deve registrarlo alla cassa di compensazione AVS.","Além disso, deve inscrevê-lo na caixa de compensação AHV.","Además debe inscribirlo en la caja de compensación AHV."],
  ["Ab einem Jahreslohn von gut 22'000 Franken braucht es auch eine Pensionskasse.","Da un salario annuo di poco più di 22'000 franchi serve anche una cassa pensione.","A partir de um salário anual de pouco mais de 22'000 francos também é preciso um fundo de pensão.","A partir de un salario anual de algo más de 22'000 francos también hace falta una caja de pensiones."],
  ["Eine Krankentaggeldversicherung ist nicht obligatorisch, aber sehr empfehlenswert.","Un'assicurazione d'indennità giornaliera per malattia non è obbligatoria, ma molto consigliata.","Um seguro de diária por doença não é obrigatório, mas é muito recomendável.","Un seguro de indemnización diaria por enfermedad no es obligatorio, pero muy recomendable."],
  ["Ich habe für Luca drei Offerten für Unfall und Krankentaggeld eingeholt.","Ho richiesto per Luca tre offerte per infortuni e indennità giornaliera.","Pedi para o Luca três propostas para acidente e diária por doença.","Pedí para Luca tres ofertas de accidentes e indemnización diaria."],
  ["Die Policen müssen ab dem ersten Arbeitstag gültig sein.","Le polizze devono essere valide dal primo giorno di lavoro.","As apólices devem valer desde o primeiro dia de trabalho.","Las pólizas deben ser válidas desde el primer día de trabajo."],
  ["Bei einem Unfall schickt Luca sofort die Unfallmeldung an die Versicherung.","In caso d'infortunio Luca manda subito la dichiarazione d'infortunio all'assicurazione.","Em caso de acidente, Luca envia logo a declaração de acidente ao seguro.","En caso de accidente, Luca envía enseguida la declaración de accidente al seguro."]],
  v:[["einstellen","assumere","contratar","contratar"],["die Pflicht","l'obbligo","a obrigação","la obligación"],["der Freizeitunfall","l'infortunio nel tempo libero","o acidente fora do trabalho","el accidente fuera del trabajo"],["die Ausgleichskasse","la cassa di compensazione","a caixa de compensação","la caja de compensación"],["der Jahreslohn","il salario annuo","o salário anual","el salario anual"],["das Krankentaggeld","l'indennità giornaliera per malattia","a diária por doença","la indemnización diaria por enfermedad"],["gültig","valido","válido","válido"],["die Unfallmeldung","la dichiarazione d'infortunio","a declaração de acidente","la declaración de accidente"]]}
