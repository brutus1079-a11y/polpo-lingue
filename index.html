<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Polpo Lingue</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#D52B1E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Polpo"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm reading column (max 760px); sticky header with stats, tabs at the bottom on phones and under the header on wider screens. Lessons and reviews open full-screen. German nouns are colour-coded by gender (der / die / das). */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunk:#E8ECF0; --ink:#14202B; --muted:#5A6672; --line:#D7DDE3;
  --accent:#D52B1E; --accent-d:#A81F15; --accent-soft:#FBE5E2; --on-accent:#FFFFFF;
  --der:#2457C5; --die:#B03277; --das:#11805A;
  --good:#127A3A; --good-bg:#DDF2E4; --bad:#BF2626; --bad-bg:#FBE4E4; --gold:#C98A00;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --surface:#16202A; --sunk:#1E2A36; --ink:#E5EBF0; --muted:#98A6B3; --line:#2A3745;
  --accent:#F04A3D; --accent-d:#B5302A; --accent-soft:#3B1C1A; --on-accent:#FFFFFF;
  --der:#7FA8FF; --die:#F27DB8; --das:#4ED19B;
  --good:#4ADE80; --good-bg:#11301E; --bad:#F87171; --bad-bg:#3A1818; --gold:#F2B731; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16202A; --sunk:#1E2A36; --ink:#E5EBF0; --muted:#98A6B3; --line:#2A3745;
  --accent:#F04A3D; --accent-d:#B5302A; --accent-soft:#3B1C1A; --on-accent:#FFFFFF;
  --der:#7FA8FF; --die:#F27DB8; --das:#4ED19B;
  --good:#4ADE80; --good-bg:#11301E; --bad:#F87171; --bad-bg:#3A1818; --gold:#F2B731; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--der);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.ic{width:20px;height:20px;flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand b{font:800 1.15rem/1 var(--display);white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:500;white-space:nowrap}
.stats{display:flex;gap:6px}
.stat-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:var(--sunk);font-weight:700;font-size:.92rem}
.stat-pill.flame .ic{color:var(--accent)} .stat-pill.flame.cold .ic{color:var(--muted)}
.stat-pill.xp .ic{color:var(--gold)}
.tabs{display:flex;gap:4px}
.tabs-top{display:none}
.tab{display:flex;align-items:center;gap:8px;background:none;border:0;padding:10px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:.95rem}
.tab:hover{background:var(--sunk)}
.tab[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.tab[aria-current="page"] .ic{color:var(--accent)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar .tab{flex-direction:column;gap:2px;font-size:.74rem;padding:6px 4px;justify-content:center}
.tabbar .tab .ic{width:22px;height:22px}
.main{padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
@media (min-width:720px){
  .tabs-top{display:flex;border-top:1px solid var(--line)}
  .tabs-top .wrap{display:flex;gap:4px;padding-block:6px}
  .tabbar{display:none}
  .main{padding-block:28px 64px}
}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.h-sec{font-size:1.25rem}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 1rem/1 var(--body);border:0;border-radius:12px;padding:14px 22px;background:var(--accent);color:var(--on-accent);transition:background .15s,transform .08s;min-height:48px}
.btn:hover{background:var(--accent-d)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn[disabled]{background:var(--sunk);color:var(--muted);cursor:default}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.good{background:var(--good);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:9px 14px;font-size:.9rem;border-radius:10px}
.icon-btn{background:none;border:0;color:var(--muted);padding:8px;border-radius:10px;display:grid;place-items:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
.bar.good>i{background:var(--good)}

/* gender colours */
.art{font-weight:700}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
.g-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.g-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--c)}

/* home */
.hero{display:grid;gap:14px;background:var(--ink);color:var(--surface);border-radius:18px;padding:22px;position:relative;overflow:hidden}
.hero .eyebrow{color:color-mix(in srgb,var(--surface) 70%,transparent)}
.hero h1{font-size:clamp(1.6rem,5vw,2.1rem)}
.hero p{color:color-mix(in srgb,var(--surface) 78%,transparent)}
.hero .steps{display:flex;gap:6px}
.hero .steps i{flex:1;height:6px;border-radius:99px;background:color-mix(in srgb,var(--surface) 22%,transparent)}
.hero .steps i.on{background:var(--accent)}
.hero .btn{justify-self:start}
.hero-de{position:absolute;right:-6px;top:-18px;font:800 6.5rem/1 var(--display);color:color-mix(in srgb,var(--surface) 7%,transparent);pointer-events:none;user-select:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
.goal{display:flex;gap:16px;align-items:center}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring.full .fg{stroke:var(--good)}
.ring text{fill:var(--ink);font:700 14px var(--body)}
.big-n{font:800 2rem/1 var(--display)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;margin-top:12px}
.day{font-size:.72rem;font-weight:600;color:var(--muted)}
.day i{display:block;width:26px;height:26px;margin:4px auto 0;border-radius:50%;background:var(--sunk)}
.day.on i{background:var(--accent)}
.day.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.sec-prog{display:flex;flex-direction:column;gap:12px}
.sec-prog .lab{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:.95rem;margin-bottom:5px}
.sec-prog .lab span{color:var(--muted);font-weight:500}

/* course */
.sec-head{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.sec-head .eyebrow{color:var(--accent)}
.units{display:flex;flex-direction:column;gap:10px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.unit.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.unit-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.unit-top>div{min-width:0}
.unit h3{font-size:1.15rem}
.unit p{color:var(--muted);font-size:.92rem}
.unit-n{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lesson-btn{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:.88rem;text-align:left;min-width:0}
.lesson-btn:hover{background:var(--sunk)}
.lesson-btn .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.lesson-btn .dot .ic{width:14px;height:14px}
.lesson-btn.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.lesson-btn.next{border-color:var(--accent);background:var(--accent-soft)}
.lesson-btn.next .dot{border-color:var(--accent)}
.lesson-btn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* vocabulary */
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;font:500 1rem var(--body);padding:13px 14px 13px 42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--der)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{opacity:.7;margin-left:4px}
.vlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vgroup{padding:10px 16px;background:var(--sunk);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.vgroup+.vrow{border-top:0}
.vrow .de{font-weight:600}
.vrow .tr{color:var(--muted);font-size:.92rem}
.say-sm{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--der)}
.say-sm:hover{background:var(--sunk)}
.say-sm .ic{width:17px;height:17px}
.boxes{display:flex;gap:3px}
.boxes i{width:6px;height:14px;border-radius:2px;background:var(--sunk)}
.boxes i.on{background:var(--good)}
.boxes.hard i.on{background:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* profile */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:14px;border-radius:12px;background:var(--sunk)}
.tile b{display:block;font:800 1.5rem/1.1 var(--display)}
.tile span{font-size:.82rem;color:var(--muted)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0;padding-top:4px}
.set-row>span{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted)}
.sync .ic{color:var(--good);margin-top:2px}
.sync.local .ic{color:var(--muted)}
.vsel{font:500 .9rem var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
.seg button .ic{width:16px;height:16px;display:inline-block;vertical-align:-3px;margin-right:4px}
.danger{background:none;border:0;color:var(--bad);font-weight:600;padding:0}

/* modal */
#modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(8,14,22,.55)}
.sheet{position:relative;background:var(--surface);border-radius:18px;width:100%;max-width:560px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 32px);overflow:auto}
.sheet.sm{max-width:420px}
.sheet>*{flex-shrink:0}
.sheet h2{font-size:1.4rem}
.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
@media (max-width:600px){#modal{place-items:end center;padding:0}.sheet{max-width:none;border-radius:18px 18px 0 0;max-height:92%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.g-h{font-size:1.02rem;margin-top:6px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.dia{display:flex;flex-direction:column;gap:8px}
.dl{max-width:90%;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.dl.b{align-self:flex-end;background:color-mix(in srgb,var(--der) 12%,var(--surface))}
.who{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dl-de{display:flex;gap:8px;align-items:flex-start;background:none;border:0;padding:2px 0;font:600 1rem/1.4 var(--body);text-align:left}
.dl-de .ic{width:17px;height:17px;margin-top:3px;color:var(--der)}
.dl-tr{color:var(--muted);font-size:.9rem;padding-left:25px}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchips span{padding:6px 10px;border-radius:8px;background:var(--sunk);font-weight:600}

/* lesson / review screens */
#screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.l-head{display:flex;align-items:center;gap:12px;max-width:720px;width:100%;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.l-head .bar{flex:1;height:10px}
.l-head .count{font-weight:600;color:var(--muted);font-size:.9rem}
.l-body{flex:1;overflow-y:auto;min-height:0}
.l-inner{max-width:640px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.l-inner.locked .opt,.l-inner.locked .tile-w,.l-inner.locked input,.l-inner.locked .chars{pointer-events:none}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.prompt{font-size:1.45rem}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:600 1.05rem/1.3 var(--body);text-align:left;min-width:0}
.opt:hover{background:var(--sunk)}
.opt .k{display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;font-size:.78rem;color:var(--muted);flex:none}
.opt.sel{border-color:var(--der);box-shadow:0 0 0 1px var(--der);background:color-mix(in srgb,var(--der) 8%,var(--surface))}
.opt.right{border-color:var(--good);box-shadow:0 0 0 1px var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrongsel{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt.matched{opacity:.3;pointer-events:none}
.opt.shake{animation:shake .35s;border-color:var(--bad)}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.pairs .opt{justify-content:center;text-align:center}
.word-card{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.word-big{font:700 1.8rem/1.15 var(--display);min-width:0;overflow-wrap:anywhere}
.say{width:48px;height:48px;border-radius:12px;background:var(--der);color:#fff;border:0;display:grid;place-items:center;flex:none}
.say.big{width:96px;height:96px;border-radius:24px;margin:4px auto}
.say.big .ic{width:44px;height:44px}
.say-row{display:flex;gap:10px;justify-content:center;align-items:center}
.slow{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.85rem;color:var(--muted)}
.skip-link{background:none;border:0;color:var(--muted);font-weight:600;font-size:.9rem;align-self:center;text-decoration:underline;text-underline-offset:3px}
.said{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);font-weight:600;font-size:1.15rem}
.answer-line{min-height:112px;background:repeating-linear-gradient(transparent 0 54px,var(--line) 54px 55px);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0;align-content:flex-start;border-top:1px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile-w{padding:8px 14px;border:1px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--surface);font:600 1.05rem var(--body);height:44px}
.tile-w:hover{background:var(--sunk)}
.tile-w.used{background:var(--sunk);color:transparent;border-color:var(--sunk);pointer-events:none}
.type-in{width:100%;font:600 1.2rem var(--body);padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.type-in:focus{border-color:var(--der);outline:none;box-shadow:0 0 0 1px var(--der)}
.chars{display:flex;flex-wrap:wrap;gap:6px}

         r("das Handelsregister","il registro di commercio","o registro comercial","el registro mercantil"),r("das Stammkapital","il capitale sociale","o capital social","el capital social"),r("die Mehrwertsteuer","l'IVA","o IVA","el IVA"),r("der Notar","il notaio","o tabelião","el notario")],
  sentences:[r("Für eine GmbH braucht man 20'000 Franken Stammkapital.","Per una Sagl servono 20'000 franchi di capitale sociale.","Para uma GmbH são necessários 20'000 francos de capital social.","Para una GmbH se necesitan 20'000 francos de capital social."),
         r("Die Firma wird im Handelsregister eingetragen.","L'azienda viene iscritta nel registro di commercio.","A empresa é inscrita no registro comercial.","La empresa se inscribe en el registro mercantil."),
         r("Ab 100'000 Franken Umsatz ist man mehrwertsteuerpflichtig.","Da 100'000 franchi di fatturato si è soggetti all'IVA.","A partir de 100'000 francos de faturamento é preciso pagar IVA.","A partir de 100'000 francos de facturación hay que pagar IVA."),
         r("Ich möchte eine Einzelfirma gründen.","Vorrei aprire una ditta individuale.","Quero abrir uma empresa individual.","Quiero abrir una empresa individual.")],
  tips:{it:["Einzelfirma: nessun capitale minimo, il titolare risponde con il patrimonio privato.","GmbH: almeno CHF 20'000; AG: almeno CHF 100'000. Servono atto notarile e iscrizione nel registro di commercio.","Mehrwertsteuer (MWST): obbligatoria da CHF 100'000 di fatturato annuo."],
        pt:["Einzelfirma: sem capital mínimo, o titular responde com o patrimônio pessoal.","GmbH: mínimo CHF 20'000; AG: mínimo CHF 100'000. É preciso escritura no notário e inscrição no registro comercial.","Mehrwertsteuer (MWST): obrigatória a partir de CHF 100'000 de faturamento anual."],
        es:["Einzelfirma: sin capital mínimo, el titular responde con su patrimonio personal.","GmbH: mínimo CHF 20'000; AG: mínimo CHF 100'000. Hace falta escritura notarial e inscripción en el registro mercantil.","Mehrwertsteuer (MWST): obligatoria a partir de CHF 100'000 de facturación anual."]}},
 {sec:4,title:"Steuern und Bewilligung",desc:{it:"Dichiarazione fiscale in base al permesso",pt:"Declaração de impostos conforme a autorização",es:"Declaración de impuestos según el permiso"},
  words:[r("die Steuererklärung","la dichiarazione d'imposta","a declaração de imposto","la declaración de impuestos"),r("die Quellensteuer","l'imposta alla fonte","o imposto na fonte","el impuesto en la fuente"),r("die Aufenthaltsbewilligung","il permesso di dimora","a autorização de residência","el permiso de residencia"),r("die Niederlassungsbewilligung","il permesso di domicilio","a autorização de estabelecimento","el permiso de establecimiento"),
         r("der Abzug","la deduzione","a dedução","la deducción"),r("der Lohnausweis","il certificato di salario","o certificado de salário","el certificado de salario"),r("die Veranlagung","la tassazione","a tributação","la liquidación fiscal"),r("das Steueramt","l'ufficio delle imposte","a repartição de impostos","la oficina tributaria")],
  sentences:[r("Mit Bewilligung B zahle ich Quellensteuer.","Con il permesso B pago l'imposta alla fonte.","Com a autorização B pago imposto na fonte.","Con el permiso B pago el impuesto en la fuente."),
         r("Über 120'000 Franken Lohn ist die Steuererklärung Pflicht.","Sopra i 120'000 franchi di salario la dichiarazione è obbligatoria.","Acima de 120'000 francos de salário a declaração é obrigatória.","Por encima de 120'000 francos de salario la declaración es obligatoria."),
         r("Mit Bewilligung C fülle ich eine normale Steuererklärung aus.","Con il permesso C compilo una dichiarazione normale.","Com a autorização C preencho uma declaração normal.","Con el permiso C relleno una declaración normal."),
         r("Haben Sie den Lohnausweis dabei?","Ha con sé il certificato di salario?","O senhor trouxe o certificado de salário?","¿Ha traído el certificado de salario?")],
  tips:{it:["Permesso B (e L): l'imposta alla fonte viene trattenuta dal salario. Sopra CHF 120'000 lordi l'anno la tassazione ordinaria ulteriore (NOV) è obbligatoria.","Sotto i 120'000 si può chiedere la NOV per far valere deduzioni (3a, spese professionali…): domanda entro il 31 marzo dell'anno successivo.","Permesso C e cittadini svizzeri: dichiarazione ordinaria ogni anno."],
        pt:["Autorização B (e L): o imposto na fonte é descontado do salário. Acima de CHF 120'000 brutos por ano a tributação ordinária posterior (NOV) é obrigatória.","Abaixo de 120'000 pode-se pedir a NOV para usar deduções (3a, despesas profissionais…): pedido até 31 de março do ano seguinte.","Autorização C e cidadãos suíços: declaração ordinária todo ano."],
        es:["Permiso B (y L): el impuesto en la fuente se descuenta del salario. Por encima de CHF 120'000 brutos al año la tasación ordinaria posterior (NOV) es obligatoria.","Por debajo de 120'000 se puede pedir la NOV para aplicar deducciones (3a, gastos profesionales…): solicitud antes del 31 de marzo del año siguiente.","Permiso C y ciudadanos suizos: declaración ordinaria cada año."]}},
 {sec:5,title:"E-Mails schreiben",desc:{it:"E-mail professionali: parti, saluti, pronomi, allegati",pt:"E-mails profissionais: partes, saudações, pronomes, anexos",es:"Correos profesionales: partes, saludos, pronombres, adjuntos"},
  words:[r("der Betreff","l'oggetto","o assunto","el asunto"),r("die Anrede","il saluto iniziale","a saudação inicial","el saludo inicial"),r("der Anhang","l'allegato","o anexo","el adjunto"),r("die Grussformel","la formula di saluto finale","a fórmula de despedida","la fórmula de despedida"),

  sentences:[r("Vielen Dank für Ihre E-Mail.","Grazie mille per la sua e-mail.","Agradeço muito pelo seu e-mail.","Muchas gracias por su correo."),
         r("Im Anhang finden Sie die Offerte.","In allegato trova l'offerta.","Em anexo o senhor encontra a proposta.","En el adjunto encontrará la oferta."),
         r("Ich freue mich auf Ihre Rückmeldung.","Attendo con piacere un suo riscontro.","Aguardo o seu retorno.","Quedo a la espera de su respuesta."),
         r("Bei Fragen stehe ich Ihnen gerne zur Verfügung.","Per domande resto volentieri a sua disposizione.","Em caso de dúvidas, fico à disposição.","Si tiene preguntas, quedo a su disposición."),
         r("Leider habe ich den Anhang vergessen.","Purtroppo ho dimenticato l'allegato.","Infelizmente esqueci o anexo.","Lamentablemente olvidé el adjunto.")],
  tips:{it:["Struttura: Betreff (oggetto) → Anrede (saluto) → testo → Grussformel (saluto finale) → Signatur (firma).","Saluto formale: «Sehr geehrte Frau Huber» (donna, -e) / «Sehr geehrter Herr Meier» (uomo, -er). Se non conosci il nome: «Sehr geehrte Damen und Herren». In Svizzera è molto usato anche «Grüezi Frau Huber» o «Guten Tag Herr Meier».","Dopo il saluto iniziale va la virgola e il testo comincia con la minuscola: «Sehr geehrte Frau Huber, / vielen Dank für …».","Pronomi di cortesia sempre con la maiuscola: Sie, Ihnen, Ihr, Ihre (Ich sende Ihnen Ihre Police). «sie» minuscolo significa lei/loro.","Allegati: «Im Anhang finden Sie …», «Beiliegend erhalten Sie …», «Ich sende Ihnen … als PDF.»","Saluto finale: «Freundliche Grüsse» (lo standard in Svizzera); «Beste Grüsse» o «Liebe Grüsse» solo con chi conosci bene. Dopo la formula di saluto non si mette la virgola."],
        pt:["Estrutura: Betreff (assunto) → Anrede (saudação) → texto → Grussformel (despedida) → Signatur (assinatura).","Saudação formal: «Sehr geehrte Frau Huber» (mulher, -e) / «Sehr geehrter Herr Meier» (homem, -er). Se não sabe o nome: «Sehr geehrte Damen und Herren». Na Suíça também se usa muito «Grüezi Frau Huber» ou «Guten Tag Herr Meier».","Depois da saudação vem vírgula e o texto começa com minúscula: «Sehr geehrte Frau Huber, / vielen Dank für …».","Pronomes de cortesia sempre com maiúscula: Sie, Ihnen, Ihr, Ihre (Ich sende Ihnen Ihre Police). «sie» minúsculo significa ela/eles.","Anexos: «Im Anhang finden Sie …», «Beiliegend erhalten Sie …», «Ich sende Ihnen … als PDF.»","Despedida: «Freundliche Grüsse» (o padrão na Suíça); «Beste Grüsse» ou «Liebe Grüsse» só com quem você conhece bem. Depois da despedida não se põe vírgula."],
        es:["Estructura: Betreff (asunto) → Anrede (saludo) → texto → Grussformel (despedida) → Signatur (firma).","Saludo formal: «Sehr geehrte Frau Huber» (mujer, -e) / «Sehr geehrter Herr Meier» (hombre, -er). Si no sabes el nombre: «Sehr geehrte Damen und Herren». En Suiza también se usa mucho «Grüezi Frau Huber» o «Guten Tag Herr Meier».","Después del saludo va una coma y el texto empieza en minúscula: «Sehr geehrte Frau Huber, / vielen Dank für …».","Los pronombres de cortesía siempre con mayúscula: Sie, Ihnen, Ihr, Ihre (Ich sende Ihnen Ihre Police). «sie» en minúscula significa ella/ellos.","Adjuntos: «Im Anhang finden Sie …», «Beiliegend erhalten Sie …», «Ich sende Ihnen … als PDF.»","Despedida: «Freundliche Grüsse» (lo estándar en Suiza); «Beste Grüsse» o «Liebe Grüsse» solo con quien conoces bien. Después de la despedida no se pone coma."]},

         ["Anrede","saluto iniziale","saudação","saludo","Sehr geehrter Herr Frei,"],

 {sec:6,title:"KVG: die Grundversicherung",desc:{it:"Assicurazione di base: obbligo, prestazioni, premi",pt:"Seguro básico: obrigação, coberturas, prêmios",es:"Seguro básico: obligación, prestaciones, primas"},
  words:[r("das Obligatorium","l'obbligo assicurativo","a obrigatoriedade","la obligatoriedad"),r("die Aufnahmepflicht","l'obbligo di ammissione","a obrigação de aceitar","la obligación de admisión"),r("die Prämienregion","la regione di premio","a região de prêmio","la región de prima"),r("die Altersgruppe","la fascia d'età","a faixa etária","el grupo de edad"),
         r("der Leistungskatalog","il catalogo delle prestazioni","o catálogo de coberturas","el catálogo de prestaciones"),r("die Spezialitätenliste","l'elenco delle specialità (farmaci)","a lista de especialidades (remédios)","la lista de especialidades (medicamentos)"),r("die Mutterschaft","la maternità","a maternidade","la maternidad"),r("die Unfalldeckung","la copertura infortuni","a cobertura de acidentes","la cobertura de accidentes")],
  sentences:[r("Wer in der Schweiz wohnt, muss sich innerhalb von drei Monaten versichern.","Chi abita in Svizzera deve assicurarsi entro tre mesi.","Quem mora na Suíça precisa se segurar em até três meses.","Quien vive en Suiza debe asegurarse en un plazo de tres meses."),
         r("Die Krankenkasse muss jede Person in die Grundversicherung aufnehmen.","La cassa malati deve accettare ogni persona nell'assicurazione di base.","O seguro saúde deve aceitar qualquer pessoa no seguro básico.","El seguro médico debe admitir a cualquier persona en el seguro básico."),
         r("Die Leistungen sind bei allen Kassen gleich, nur die Prämien sind verschieden.","Le prestazioni sono uguali in tutte le casse, cambiano solo i premi.","As coberturas são iguais em todos os seguros, só os prêmios mudam.","Las prestaciones son iguales en todos los seguros; solo cambian las primas."),
         r("Die Prämie hängt von der Prämienregion, dem Alter und dem Modell ab.","Il premio dipende dalla regione di premio, dall'età e dal modello.","O prêmio depende da região, da idade e do modelo.","La prima depende de la región, la edad y el modelo."),
         r("Wer mindestens acht Stunden pro Woche angestellt ist, kann die Unfalldeckung sistieren.","Chi è dipendente almeno otto ore a settimana può sospendere la copertura infortuni.","Quem é empregado pelo menos oito horas por semana pode suspender a cobertura de acidentes.","Quien es empleado al menos ocho horas a la semana puede suspender la cobertura de accidentes.")],
  tips:{it:["KVG = Krankenversicherungsgesetz (LAMal). Tutti i residenti sono obbligati ad assicurarsi entro tre mesi dall'arrivo o dalla nascita. Chi si assicura in ritardo è coperto retroattivamente ma può dover pagare un supplemento di premio.","Le casse non possono rifiutare nessuno nella base e non possono fare utili con la base. Le prestazioni sono fissate dalla legge: medico, ospedale nel reparto comune, farmaci dell'elenco delle specialità, maternità, alcune prevenzioni, fisioterapia su prescrizione.","Fasce d'età: bambini 0–18 anni, giovani adulti 19–25, adulti dai 26 anni. Ogni cantone ha fino a tre regioni di premio: in città il premio è spesso più alto.","Infortuni: chi è dipendente almeno 8 ore a settimana è coperto dall'assicurazione infortuni del datore di lavoro (UVG). Può sospendere la copertura infortuni nella cassa malati e il premio scende.","All'estero la base paga le urgenze al massimo il doppio di quanto costerebbero in Svizzera: per viaggi lontani serve una complementare."],
        pt:["KVG = Krankenversicherungsgesetz (lei do seguro saúde). Todos os residentes devem se segurar em até três meses após a chegada ou o nascimento. Quem se segura atrasado tem cobertura retroativa, mas pode pagar um acréscimo no prêmio.","Os seguros não podem recusar ninguém no básico nem ter lucro com ele. As coberturas são definidas por lei: médico, hospital na ala geral, remédios da lista de especialidades, maternidade, alguma prevenção, fisioterapia com receita.","Faixas etárias: crianças 0–18 anos, jovens adultos 19–25, adultos a partir de 26. Cada cantão tem até três regiões de prêmio: na cidade o prêmio costuma ser mais alto.","Acidentes: quem é empregado pelo menos 8 horas por semana está coberto pelo seguro de acidentes do empregador (UVG). Pode suspender a cobertura de acidentes no seguro saúde e o prêmio diminui.","No exterior o básico paga emergências até no máximo o dobro do que custariam na Suíça: para viagens longas é preciso um complementar."],
        es:["KVG = Krankenversicherungsgesetz (ley del seguro médico). Todos los residentes deben asegurarse en los tres meses siguientes a la llegada o al nacimiento. Quien se asegura tarde está cubierto con efecto retroactivo, pero puede pagar un recargo en la prima.","Los seguros no pueden rechazar a nadie en el básico ni obtener beneficios con él. Las prestaciones las fija la ley: médico, hospital en sala general, medicamentos de la lista de especialidades, maternidad, algo de prevención, fisioterapia con receta.","Grupos de edad: niños 0–18 años, jóvenes adultos 19–25, adultos desde los 26. Cada cantón tiene hasta tres regiones de prima: en la ciudad la prima suele ser más alta.","Accidentes: quien es empleado al menos 8 horas a la semana está cubierto por el seguro de accidentes del empleador (UVG). Puede suspender la cobertura de accidentes en el seguro médico y la prima baja.","En el extranjero el básico paga urgencias como máximo el doble de lo que costarían en Suiza: para viajes lejanos hace falta un complementario."]}},
 {sec:6,title:"Die Versicherungsmodelle",desc:{it:"Standard, medico di famiglia, HMO, Telmed",pt:"Padrão, médico de família, HMO, Telmed",es:"Estándar, médico de cabecera, HMO, Telmed"},
  words:[r("die freie Arztwahl","la libera scelta del medico","a livre escolha do médico","la libre elección de médico"),r("der Hausarzt","il medico di famiglia","o médico de família","el médico de cabecera"),r("die Gruppenpraxis","lo studio medico associato (HMO)","a clínica de grupo (HMO)","el centro médico de grupo (HMO)"),r("die Gesundheitsberatung","la consulenza sanitaria telefonica","a consultoria de saúde por telefone","el asesoramiento sanitario telefónico"),
         r("die Überweisung","l'invio dallo specialista","o encaminhamento","la derivación"),r("der Facharzt","lo specialista","o especialista","el especialista"),r("der Rabatt","lo sconto","o desconto","el descuento"),r("die Ausnahme","l'eccezione","a exceção","la excepción")],
  sentences:[r("Im Standardmodell haben Sie freie Arztwahl.","Nel modello standard ha libera scelta del medico.","No modelo padrão o senhor tem livre escolha do médico.","En el modelo estándar tiene libre elección de médico."),
         r("Im Hausarztmodell gehen Sie immer zuerst zu Ihrem Hausarzt.","Nel modello medico di famiglia va sempre prima dal suo medico di famiglia.","No modelo médico de família o senhor vai sempre primeiro ao seu médico de família.","En el modelo de médico de cabecera va siempre primero a su médico de cabecera."),
         r("Beim Telmed-Modell rufen Sie vor jedem Arztbesuch die Gesundheitsberatung an.","Nel modello Telmed prima di ogni visita chiama la consulenza sanitaria.","No modelo Telmed o senhor liga para a consultoria de saúde antes de cada consulta.","En el modelo Telmed llama al asesoramiento sanitario antes de cada visita."),
         r("Für den Facharzt brauchen Sie eine Überweisung.","Per lo specialista le serve un invio.","Para o especialista o senhor precisa de um encaminhamento.","Para el especialista necesita una derivación."),
         r("Im Notfall dürfen Sie direkt ins Spital gehen.","In caso d'emergenza può andare direttamente in ospedale.","Em caso de emergência o senhor pode ir direto ao hospital.","En caso de urgencia puede ir directamente al hospital.")],
  tips:{it:["Standard: libera scelta del medico e accesso diretto agli specialisti. È il modello più caro.","Medico di famiglia (Hausarztmodell): si va sempre prima dal proprio medico, che invia dallo specialista se serve. HMO: si va prima in un centro sanitario o studio associato convenzionato. Telmed: prima di ogni visita si chiama una linea di consulenza medica. Esistono anche modelli con farmacia.","Lo sconto rispetto allo Standard varia secondo la cassa, la regione e il modello, ma spesso è importante: è uno dei modi più semplici per abbassare il premio.","Eccezioni frequenti senza invio: emergenze, e spesso ginecologo, oculista e pediatra. Le regole cambiano da cassa a cassa: leggere sempre le condizioni.","Chi non rispetta le regole del modello rischia che la cassa non paghi la prestazione o lo trasferisca al modello Standard."],
        pt:["Padrão: livre escolha do médico e acesso direto aos especialistas. É o modelo mais caro.","Médico de família (Hausarztmodell): vai-se sempre primeiro ao próprio médico, que encaminha ao especialista se necessário. HMO: vai-se primeiro a um centro de saúde ou clínica de grupo conveniada. Telmed: antes de cada consulta liga-se para uma linha de consultoria médica. Também existem modelos com farmácia.","O desconto em relação ao Padrão varia conforme o seguro, a região e o modelo, mas muitas vezes é grande: é uma das formas mais simples de baixar o prêmio.","Exceções frequentes sem encaminhamento: emergências e muitas vezes ginecologista, oftalmologista e pediatra. As regras mudam de seguro para seguro: leia sempre as condições.","Quem não respeita as regras do modelo corre o risco de o seguro não pagar a prestação ou de passar para o modelo Padrão."],
        es:["Estándar: libre elección de médico y acceso directo a especialistas. Es el modelo más caro.","Médico de cabecera (Hausarztmodell): se va siempre primero al propio médico, que deriva al especialista si hace falta. HMO: se va primero a un centro de salud o consulta de grupo concertada. Telmed: antes de cada visita se llama a una línea de asesoramiento médico. También hay modelos con farmacia.","El descuento respecto al Estándar varía según el seguro, la región y el modelo, pero a menudo es importante: es una de las formas más sencillas de bajar la prima.","Excepciones frecuentes sin derivación: urgencias y a menudo ginecólogo, oftalmólogo y pediatra. Las reglas cambian de un seguro a otro: lee siempre las condiciones.","Quien no respeta las reglas del modelo corre el riesgo de que el seguro no pague la prestación o de pasar al modelo Estándar."]}},
 {sec:6,title:"Franchise und Kostenbeteiligung",desc:{it:"Franchigia, aliquota percentuale, contributo ospedaliero",pt:"Franquia, coparticipação, contribuição hospitalar",es:"Franquicia, copago, contribución hospitalaria"},
  words:[r("die Kostenbeteiligung","la partecipazione ai costi","a participação nos custos","la participación en los costes"),r("die ordentliche Franchise","la franchigia ordinaria","a franquia ordinária","la franquicia ordinaria"),r("die wählbare Franchise","la franchigia opzionale","a franquia opcional","la franquicia opcional"),r("der Spitalbeitrag","il contributo ospedaliero","a contribuição hospitalar","la contribución hospitalaria"),
         r("das Generikum","il farmaco generico","o genérico","el genérico"),r("das Originalpräparat","il farmaco originale","o medicamento de referência","el medicamento original"),r("die Gesundheitskosten","i costi sanitari","os custos de saúde","los gastos de salud"),r("chronisch krank","malato cronico","doente crônico","enfermo crónico")],
  sentences:[r("Die Franchise ist der Betrag, den Sie jedes Jahr zuerst selbst bezahlen.","La franchigia è l'importo che ogni anno paga per primo di tasca sua.","A franquia é o valor que o senhor paga primeiro todo ano do próprio bolso.","La franquicia es el importe que paga primero usted mismo cada año."),
         r("Erwachsene können eine Franchise zwischen 300 und 2'500 Franken wählen.","Gli adulti possono scegliere una franchigia tra 300 e 2'500 franchi.","Adultos podem escolher uma franquia entre 300 e 2'500 francos.","Los adultos pueden elegir una franquicia entre 300 y 2'500 francos."),
         r("Danach zahlen Sie zehn Prozent Selbstbehalt, höchstens 700 Franken im Jahr.","Poi paga il dieci per cento di aliquota, al massimo 700 franchi all'anno.","Depois o senhor paga dez por cento de coparticipação, no máximo 700 francos por ano.","Después paga un diez por ciento de copago, como máximo 700 francos al año."),
         r("Eine hohe Franchise lohnt sich, wenn Sie selten zum Arzt gehen.","Una franchigia alta conviene se va raramente dal medico.","Uma franquia alta compensa se o senhor raramente vai ao médico.","Una franquicia alta compensa si va pocas veces al médico."),
         r("Wenn Sie das Original statt dem Generikum wählen, zahlen Sie mehr Selbstbehalt.","Se sceglie l'originale invece del generico, paga un'aliquota più alta.","Se o senhor escolher o original em vez do genérico, paga mais coparticipação.","Si elige el original en lugar del genérico, paga más copago.")],
  tips:{it:["Franchigie per adulti: 300 (ordinaria), 500, 1'000, 1'500, 2'000 o 2'500 franchi. Per i bambini: da 0 a 600 franchi. Più alta è la franchigia, più basso è il premio.","Dopo la franchigia si paga l'aliquota percentuale del 10 %, fino a un massimo di 700 franchi all'anno (350 per i bambini). In ospedale si aggiungono 15 franchi al giorno di contributo, ma non per bambini, giovani in formazione e maternità.","Farmaci: se esiste un generico più conveniente e si sceglie l'originale senza motivo medico, l'aliquota sale al 40 %.","Cambio: la franchigia si può aumentare per il 1° gennaio, comunicandolo entro fine anno. Per ridurla bisogna comunicarlo entro il 30 novembre, come per la disdetta.","Regola pratica in consulenza: chi ha pochi costi sanitari sceglie spesso 2'500 franchi; chi è malato cronico o ha costi alti sceglie 300. Confrontare sempre premio annuo + costi probabili."],
        pt:["Franquias para adultos: 300 (ordinária), 500, 1'000, 1'500, 2'000 ou 2'500 francos. Para crianças: de 0 a 600 francos. Quanto maior a franquia, menor o prêmio.","Depois da franquia paga-se a coparticipação de 10 %, até no máximo 700 francos por ano (350 para crianças). No hospital somam-se 15 francos por dia de contribuição, mas não para crianças, jovens em formação e maternidade.","Remédios: se existe um genérico mais barato e se escolhe o original sem motivo médico, a coparticipação sobe para 40 %.","Mudança: a franquia pode ser aumentada para 1º de janeiro, avisando até o fim do ano. Para reduzi-la é preciso avisar até 30 de novembro, como no cancelamento.","Regra prática na consultoria: quem tem poucos custos de saúde costuma escolher 2'500 francos; quem é doente crônico ou tem custos altos escolhe 300. Compare sempre prêmio anual + custos prováveis."],
        es:["Franquicias para adultos: 300 (ordinaria), 500, 1'000, 1'500, 2'000 o 2'500 francos. Para niños: de 0 a 600 francos. Cuanto más alta la franquicia, más baja la prima.","Después de la franquicia se paga un copago del 10 %, hasta un máximo de 700 francos al año (350 para niños). En el hospital se añaden 15 francos al día de contribución, pero no para niños, jóvenes en formación ni maternidad.","Medicamentos: si existe un genérico más barato y se elige el original sin motivo médico, el copago sube al 40 %.","Cambio: la franquicia se puede subir para el 1 de enero, comunicándolo antes de fin de año. Para bajarla hay que comunicarlo antes del 30 de noviembre, como la baja.","Regla práctica en el asesoramiento: quien tiene pocos gastos de salud suele elegir 2'500 francos; quien es enfermo crónico o tiene gastos altos elige 300. Compara siempre prima anual + gastos probables."]}},
 {sec:6,title:"VVG: die Zusatzversicherungen",desc:{it:"Assicurazioni complementari: tipi e funzionamento",pt:"Seguros complementares: tipos e funcionamento",es:"Seguros complementarios: tipos y funcionamiento"},
  words:[r("die Gesundheitsfragen","le domande sulla salute","as perguntas de saúde","las preguntas de salud"),r("der Vorbehalt","la riserva","a reserva (exclusão)","la reserva (exclusión)"),r("die Spitalzusatzversicherung","la complementare ospedaliera","o seguro hospitalar complementar","el seguro hospitalario complementario"),r("halbprivat","semiprivato","semiprivado","semiprivado"),
         r("die ambulante Zusatzversicherung","la complementare ambulatoriale","o complementar ambulatorial","el complementario ambulatorio"),r("die Komplementärmedizin","la medicina complementare","a medicina complementar","la medicina complementaria"),r("die Zahnversicherung","l'assicurazione dentaria","o seguro dentário","el seguro dental"),r("ablehnen","rifiutare","recusar","rechazar")],
  sentences:[r("Bei der Zusatzversicherung müssen Sie die Gesundheitsfragen ehrlich beantworten.","Per la complementare deve rispondere onestamente alle domande sulla salute.","No complementar o senhor deve responder com sinceridade às perguntas de saúde.","En el complementario debe responder con sinceridad a las preguntas de salud."),
         r("Die Versicherung kann den Antrag ablehnen oder einen Vorbehalt machen.","L'assicurazione può rifiutare la proposta o porre una riserva.","A seguradora pode recusar a proposta ou fazer uma reserva.","La aseguradora puede rechazar la solicitud o poner una reserva."),
         r("Mit halbprivat liegen Sie im Zweierzimmer und können den Arzt wählen.","Con il semiprivato sta in camera doppia e può scegliere il medico.","No semiprivado o senhor fica em quarto duplo e pode escolher o médico.","Con semiprivado está en habitación doble y puede elegir al médico."),
         r("Die ambulante Zusatzversicherung zahlt zum Beispiel an Brillen und Komplementärmedizin.","La complementare ambulatoriale contribuisce ad esempio a occhiali e medicina complementare.","O complementar ambulatorial contribui, por exemplo, com óculos e medicina complementar.","El complementario ambulatorio contribuye, por ejemplo, a gafas y medicina complementaria."),
         r("Kündigen Sie die alte Zusatzversicherung nie, bevor die neue bestätigt ist.","Non disdica mai la vecchia complementare prima che la nuova sia confermata.","Nunca cancele o complementar antigo antes de o novo ser confirmado.","No cancele nunca el complementario antiguo antes de que el nuevo esté confirmado.")],
  tips:{it:["VVG = Versicherungsvertragsgesetz (LCA). Le complementari sono facoltative e sono contratti privati: la cassa può rifiutare, porre riserve per malattie esistenti, e il premio dipende spesso dall'età d'entrata.","Ospedale: «allgemein ganze Schweiz» (reparto comune in tutta la Svizzera), «halbprivat» (camera a due letti, scelta del medico), «privat» (camera singola, scelta del medico). Esistono anche modelli flessibili: si sceglie il reparto al momento del ricovero, con una partecipazione ai costi.","Ambulatoriale: occhiali e lenti, medicina complementare, trasporti e salvataggio, prevenzione e fitness, cure all'estero. Dentaria: controlli, igiene e cure, spesso con un periodo d'attesa.","Base e complementare possono essere in casse diverse. Se una domanda sulla salute riceve una risposta falsa, l'assicurazione può disdire il contratto per violazione dell'obbligo di dichiarazione.","Il termine di disdetta è nel contratto, spesso tre mesi prima della fine dell'anno. Regola d'oro: mai disdire la vecchia complementare prima di avere la conferma scritta della nuova."],
        pt:["VVG = Versicherungsvertragsgesetz (lei do contrato de seguro). Os complementares são opcionais e são contratos privados: o seguro pode recusar, fazer reservas por doenças existentes, e o prêmio muitas vezes depende da idade de entrada.","Hospital: «allgemein ganze Schweiz» (ala geral em toda a Suíça), «halbprivat» (quarto duplo, escolha do médico), «privat» (quarto individual, escolha do médico). Há também modelos flexíveis: escolhe-se a ala no momento da internação, com uma participação nos custos.","Ambulatorial: óculos e lentes, medicina complementar, transporte e resgate, prevenção e academia, tratamentos no exterior. Dentário: check-ups, higiene e tratamentos, muitas vezes com carência.","O básico e o complementar podem estar em seguradoras diferentes. Se uma pergunta de saúde for respondida de forma falsa, a seguradora pode cancelar o contrato por violação do dever de declaração.","O prazo de cancelamento está no contrato, muitas vezes três meses antes do fim do ano. Regra de ouro: nunca cancele o complementar antigo antes da confirmação por escrito do novo."],
        es:["VVG = Versicherungsvertragsgesetz (ley del contrato de seguro). Los complementarios son voluntarios y son contratos privados: el seguro puede rechazar, poner reservas por enfermedades existentes, y la prima depende a menudo de la edad de entrada.","Hospital: «allgemein ganze Schweiz» (sala general en toda Suiza), «halbprivat» (habitación doble, elección de médico), «privat» (habitación individual, elección de médico). También hay modelos flexibles: se elige la sala en el momento del ingreso, con una participación en los costes.","Ambulatorio: gafas y lentillas, medicina complementaria, transporte y rescate, prevención y gimnasio, tratamientos en el extranjero. Dental: revisiones, higiene y tratamientos, a menudo con período de carencia.","El básico y el complementario pueden estar en aseguradoras distintas. Si una pregunta de salud se responde con falsedad, la aseguradora puede rescindir el contrato por violar el deber de declaración.","El plazo de baja está en el contrato, a menudo tres meses antes de fin de año. Regla de oro: no cancele nunca el complementario antiguo antes de tener la confirmación por escrito del nuevo."]}},
 {sec:6,title:"Prämien, Wechsel und Kündigung",desc:{it:"Riduzione dei premi, cambio cassa, disdetta",pt:"Redução de prêmios, troca de seguro, cancelamento",es:"Reducción de primas, cambio de seguro, baja"},
  words:[r("der Prämienbrief","la lettera con i nuovi premi","a carta com os novos prêmios","la carta con las nuevas primas"),r("die Kündigungsfrist","il termine di disdetta","o prazo de cancelamento","el plazo de baja"),r("eingeschrieben","per raccomandata","registrada (carta)","certificada (carta)"),r("die Bestätigung","la conferma","a confirmação","la confirmación"),
         r("ausstehend","arretrato","pendente","pendiente"),r("der Kassenwechsel","il cambio di cassa","a troca de seguradora","el cambio de seguro"),r("das Einkommen","il reddito","a renda","los ingresos"),r("beantragen","richiedere","solicitar","solicitar")],
  sentences:[r("Die neuen Prämien kommen jedes Jahr bis Ende Oktober.","I nuovi premi arrivano ogni anno entro fine ottobre.","Os novos prêmios chegam todo ano até o fim de outubro.","Las nuevas primas llegan cada año antes de finales de octubre."),
         r("Die Kündigung muss spätestens am 30. November bei der Krankenkasse sein.","La disdetta deve arrivare alla cassa malati al più tardi il 30 novembre.","O cancelamento deve chegar ao seguro no máximo até 30 de novembro.","La baja debe llegar al seguro como muy tarde el 30 de noviembre."),
         r("Schicken Sie die Kündigung am besten eingeschrieben.","È meglio inviare la disdetta per raccomandata.","O melhor é enviar o cancelamento por carta registrada.","Lo mejor es enviar la baja por carta certificada."),
         r("Mit ausstehenden Prämien können Sie die Kasse nicht wechseln.","Con premi arretrati non può cambiare cassa.","Com prêmios pendentes o senhor não pode trocar de seguradora.","Con primas pendientes no puede cambiar de seguro."),
         r("Die Prämienverbilligung beantragen Sie beim Kanton.","La riduzione dei premi si richiede al cantone.","A redução de prêmios se solicita ao cantão.","La reducción de primas se solicita al cantón.")],
  tips:{it:["Le casse devono comunicare i nuovi premi almeno due mesi prima, quindi entro fine ottobre. La base si cambia per il 1° gennaio: la disdetta deve ARRIVARE entro il 30 novembre, non basta spedirla quel giorno.","Con franchigia ordinaria (300) e modello Standard si può cambiare anche a metà anno, per il 30 giugno, con tre mesi di preavviso: la disdetta deve arrivare entro il 31 marzo.","La vecchia cassa resta valida finché la nuova non conferma l'ammissione: il cliente non resta mai senza copertura. Con premi o partecipazioni ai costi arretrati, dopo una diffida, il cambio non è possibile.","Riduzione dei premi (IPV): un aiuto del cantone per redditi modesti. Criteri, importi e termini cambiano molto da cantone a cantone; in alcuni è automatica, in altri va richiesta.","In consulenza: la base si può sempre cambiare (la nuova cassa non può rifiutare), le complementari no. Quindi prima la conferma della nuova complementare, poi la disdetta."],
        pt:["Os seguros devem comunicar os novos prêmios pelo menos dois meses antes, ou seja, até o fim de outubro. O básico se troca para 1º de janeiro: o cancelamento deve CHEGAR até 30 de novembro, não basta enviá-lo nesse dia.","Com franquia ordinária (300) e modelo Padrão é possível trocar também no meio do ano, para 30 de junho, com três meses de aviso: o cancelamento deve chegar até 31 de março.","O seguro antigo continua valendo até o novo confirmar a admissão: o cliente nunca fica sem cobertura. Com prêmios ou coparticipações pendentes, após uma cobrança formal, a troca não é possível.","Redução de prêmios (IPV): uma ajuda do cantão para rendas baixas. Critérios, valores e prazos variam muito de cantão para cantão; em alguns é automática, em outros precisa ser solicitada.","Na consultoria: o básico sempre pode ser trocado (o novo seguro não pode recusar), os complementares não. Por isso, primeiro a confirmação do novo complementar, depois o cancelamento."],
        es:["Los seguros deben comunicar las nuevas primas al menos dos meses antes, es decir, antes de finales de octubre. El básico se cambia para el 1 de enero: la baja debe LLEGAR antes del 30 de noviembre, no basta con enviarla ese día.","Con franquicia ordinaria (300) y modelo Estándar también se puede cambiar a mitad de año, para el 30 de junio, con tres meses de preaviso: la baja debe llegar antes del 31 de marzo.","El seguro antiguo sigue vigente hasta que el nuevo confirma la admisión: el cliente nunca se queda sin cobertura. Con primas o copagos pendientes, tras un requerimiento, no es posible cambiar.","Reducción de primas (IPV): una ayuda del cantón para ingresos modestos. Criterios, importes y plazos cambian mucho de un cantón a otro; en algunos es automática, en otros hay que solicitarla.","En el asesoramiento: el básico siempre se puede cambiar (el nuevo seguro no puede rechazar), los complementarios no. Por eso, primero la confirmación del nuevo complementario y después la baja."]}},
 {sec:7,title:"Die Motorfahrzeug-Haftpflicht",desc:{it:"RC veicoli a motore: obbligo, copertura, bonus-malus",pt:"Responsabilidade civil auto: obrigação, cobertura, bônus-malus",es:"Responsabilidad civil de vehículos: obligación, cobertura, bonus-malus"},
  words:[r("die Garantiesumme","la somma di garanzia","o valor de garantia","la suma de garantía"),r("der Personenschaden","il danno alle persone","o dano pessoal","el daño personal"),r("der Sachschaden","il danno materiale","o dano material","el daño material"),r("der Halter","il detentore","o titular do veículo","el titular del vehículo"),
         r("der Lenker","il conducente","o condutor","el conductor"),r("die Grobfahrlässigkeit","la colpa grave","a negligência grave","la negligencia grave"),r("der Regress","il regresso","o direito de regresso","el derecho de repetición"),r("die Prämienstufe","il grado di premio","o nível de prêmio","el nivel de prima")],
  sentences:[r("Ohne Haftpflichtversicherung bekommen Sie keine Kontrollschilder.","Senza RC non riceve le targhe.","Sem seguro de responsabilidade civil o senhor não recebe as placas.","Sin seguro de responsabilidad civil no recibe las matrículas."),
         r("Die Haftpflicht bezahlt Personen- und Sachschäden, die Sie anderen verursachen.","La RC paga i danni a persone e cose che causa ad altri.","A responsabilidade civil paga danos pessoais e materiais que o senhor causa a outros.","La responsabilidad civil paga los daños personales y materiales que causa a otros."),
         r("Den Schaden an Ihrem eigenen Auto bezahlt sie nicht.","Il danno alla sua auto non lo paga.","O dano no seu próprio carro ela não paga.","El daño de su propio coche no lo paga."),
         r("Bei Grobfahrlässigkeit kann die Versicherung auf Sie Regress nehmen.","In caso di colpa grave l'assicurazione può rivalersi su di lei.","Em caso de negligência grave a seguradora pode cobrar do senhor.","En caso de negligencia grave la aseguradora puede repetir contra usted."),
         r("Nach einem selbst verschuldeten Schaden steigt Ihre Prämienstufe.","Dopo un danno causato da lei, il suo grado di premio sale.","Depois de um dano causado pelo senhor, seu nível de prêmio sobe.","Tras un daño causado por usted, su nivel de prima sube.")],
  tips:{it:["Obbligatoria per ogni veicolo a motore (legge sulla circolazione stradale, SVG): senza attestato d'assicurazione niente targhe. La somma minima per legge è di 5 milioni di franchi; di solito si assicurano 100 milioni o più.","Copre i danni causati a terzi: persone ferite, altri veicoli, edifici e cose. Protegge anche da pretese ingiustificate, perché l'assicurazione le contesta per lei.","Non copre mai il proprio veicolo: per quello servono casco parziale o totale.","Colpa grave (ad esempio alcol, droghe, grave eccesso di velocità, semaforo rosso): l'assicurazione paga il danneggiato ma può rivalersi sul conducente. Con la copertura aggiuntiva «Grobfahrlässigkeit» rinuncia al regresso, ma non per alcol, droghe e reati da pirata della strada.","Bonus-malus: senza sinistri il grado di premio scende ogni anno; dopo un sinistro causato da lei sale di alcuni gradi. Per piccoli danni si può rimborsare l'assicurazione e conservare il bonus."],
        pt:["Obrigatória para todo veículo a motor (lei de trânsito, SVG): sem comprovante de seguro não há placas. O valor mínimo por lei é de 5 milhões de francos; normalmente se seguram 100 milhões ou mais.","Cobre os danos causados a terceiros: pessoas feridas, outros veículos, edifícios e objetos. Também protege contra pedidos injustificados, porque a seguradora os contesta pelo senhor.","Nunca cobre o próprio veículo: para isso servem a cobertura parcial ou total.","Negligência grave (por exemplo álcool, drogas, excesso de velocidade grave, sinal vermelho): a seguradora paga a vítima, mas pode cobrar do condutor. Com a cobertura adicional «Grobfahrlässigkeit» ela renuncia ao regresso, mas não em caso de álcool, drogas e infrações de «pirata do volante».","Bônus-malus: sem sinistros o nível de prêmio desce todo ano; depois de um sinistro causado pelo senhor ele sobe alguns níveis. Em danos pequenos pode-se reembolsar a seguradora e manter o bônus."],
        es:["Obligatoria para todo vehículo a motor (ley de circulación, SVG): sin justificante de seguro no hay matrículas. La suma mínima legal es de 5 millones de francos; normalmente se aseguran 100 millones o más.","Cubre los daños causados a terceros: personas heridas, otros vehículos, edificios y objetos. También protege frente a reclamaciones injustificadas, porque la aseguradora las rechaza por usted.","Nunca cubre el propio vehículo: para eso están la cobertura parcial o total.","Negligencia grave (por ejemplo alcohol, drogas, exceso de velocidad grave, semáforo en rojo): la aseguradora paga a la víctima, pero puede repetir contra el conductor. Con la cobertura adicional «Grobfahrlässigkeit» renuncia a la repetición, pero no en caso de alcohol, drogas y delitos de «conductor temerario».","Bonus-malus: sin siniestros el nivel de prima baja cada año; tras un siniestro causado por usted sube varios niveles. En daños pequeños se puede reembolsar a la aseguradora y conservar la bonificación."]}},
 {sec:7,title:"Die Teilkasko",desc:{it:"Casco parziale: cosa copre nel dettaglio",pt:"Cobertura parcial: o que cobre em detalhe",es:"Cobertura parcial: qué cubre en detalle"},
  words:[r("der Diebstahl","il furto","o roubo","el robo"),r("der Elementarschaden","il danno della natura","o dano por fenômenos naturais","el daño por fenómenos naturales"),r("der Glasbruch","la rottura vetri","a quebra de vidros","la rotura de lunas"),r("die Überschwemmung","l'inondazione","a inundação","la inundación"),
         r("der Marder","la martora","a marta","la marta"),r("die Kollision mit Tieren","la collisione con animali","a colisão com animais","la colisión con animales"),r("der Vandalismus","il vandalismo","o vandalismo","el vandalismo"),r("der Zeitwert","il valore attuale","o valor atual","el valor actual")],
  sentences:[r("Die Teilkasko zahlt bei Diebstahl, Feuer und Elementarschäden wie Hagel oder Sturm.","La casco parziale paga in caso di furto, incendio e danni della natura come grandine o tempesta.","A cobertura parcial paga em caso de roubo, incêndio e danos naturais como granizo ou tempestade.","La cobertura parcial paga en caso de robo, incendio y daños naturales como granizo o tormenta."),
         r("Auch Glasbruch, Marderschäden und Kollisionen mit Tieren sind versichert.","Sono assicurati anche rottura vetri, danni da martora e collisioni con animali.","Quebra de vidros, danos de marta e colisões com animais também estão cobertos.","También están cubiertos la rotura de lunas, los daños de marta y las colisiones con animales."),
         r("Ein Teilkaskoschaden hat keinen Einfluss auf Ihren Bonus.","Un danno in casco parziale non influisce sul suo bonus.","Um dano na cobertura parcial não afeta o seu bônus.","Un daño en la cobertura parcial no afecta a su bonificación."),
         r("Für ein älteres Auto reicht oft die Teilkasko.","Per un'auto più vecchia spesso basta la casco parziale.","Para um carro mais velho muitas vezes basta a cobertura parcial.","Para un coche más antiguo a menudo basta la cobertura parcial."),
         r("Bei einem Hagelschaden zahlen Sie nur den Selbstbehalt.","Per un danno da grandine paga solo la franchigia.","Num dano de granizo o senhor paga só a franquia.","En un daño por granizo solo paga la franquicia.")],
  tips:{it:["La casco parziale copre i danni al proprio veicolo che NON nascono da un errore di guida: furto (anche di parti e accessori), incendio, danni della natura (grandine, tempesta, inondazione, caduta massi, valanga, pressione della neve), rottura vetri, collisione con animali, danni da martora.","Vandalismo e danni da parcheggio dipendono dal prodotto: spesso sono coperture aggiuntive. Leggere sempre le condizioni.","I sinistri in casco parziale non fanno salire il grado di premio. Spesso c'è una franchigia (in tedesco «Selbstbehalt», ad esempio 200 franchi); per i vetri riparati invece che sostituiti molte assicurazioni rinunciano alla franchigia.","In caso di furto totale o danno totale si paga di regola il valore attuale (Zeitwert) del veicolo, cioè quanto vale oggi.","Consigliata per auto di qualche anno: protegge dai rischi più frequenti in Svizzera, come la grandine, a un premio contenuto."],
        pt:["A cobertura parcial cobre danos no próprio veículo que NÃO vêm de um erro ao dirigir: roubo (também de peças e acessórios), incêndio, danos naturais (granizo, tempestade, inundação, queda de pedras, avalanche, peso da neve), quebra de vidros, colisão com animais, danos de marta.","Vandalismo e danos de estacionamento dependem do produto: muitas vezes são coberturas adicionais. Leia sempre as condições.","Sinistros na cobertura parcial não fazem o nível de prêmio subir. Muitas vezes há uma franquia (em alemão «Selbstbehalt», por exemplo 200 francos); para vidros reparados em vez de trocados muitas seguradoras renunciam à franquia.","Em caso de roubo total ou perda total paga-se em regra o valor atual (Zeitwert) do veículo, ou seja, quanto vale hoje.","Recomendada para carros com alguns anos: protege contra os riscos mais frequentes na Suíça, como o granizo, com um prêmio moderado."],
        es:["La cobertura parcial cubre los daños al propio vehículo que NO vienen de un error al conducir: robo (también de piezas y accesorios), incendio, daños naturales (granizo, tormenta, inundación, desprendimientos, aludes, peso de la nieve), rotura de lunas, colisión con animales, daños de marta.","El vandalismo y los daños de aparcamiento dependen del producto: a menudo son coberturas adicionales. Lee siempre las condiciones.","Los siniestros en cobertura parcial no hacen subir el nivel de prima. A menudo hay una franquicia (en alemán «Selbstbehalt», por ejemplo 200 francos); en lunas reparadas en lugar de sustituidas muchas aseguradoras renuncian a la franquicia.","En caso de robo total o pérdida total se paga normalmente el valor actual (Zeitwert) del vehículo, es decir, lo que vale hoy.","Recomendada para coches con algunos años: protege de los riesgos más frecuentes en Suiza, como el granizo, con una prima moderada."]}},
 {sec:7,title:"Die Vollkasko",desc:{it:"Casco totale: collisione, leasing, valore a nuovo",pt:"Cobertura total: colisão, leasing, valor de novo",es:"Cobertura total: colisión, leasing, valor de nuevo"},
  words:[r("der Kollisionsschaden","il danno da collisione","o dano de colisão","el daño por colisión"),r("selbst verschuldet","causato da sé","causado por si mesmo","causado por uno mismo"),r("das Leasing","il leasing","o leasing","el leasing"),r("der Totalschaden","il danno totale","a perda total","la pérdida total"),
         r("die Neuwertentschädigung","l'indennizzo a valore a nuovo","a indenização pelo valor de novo","la indemnización a valor de nuevo"),r("der Bonusschutz","la protezione del bonus","a proteção do bônus","la protección de la bonificación"),r("der Listenpreis","il prezzo di listino","o preço de tabela","el precio de catálogo"),r("die Reparatur","la riparazione","o conserto","la reparación")],
  sentences:[r("Die Vollkasko enthält die Teilkasko und zusätzlich die Kollisionsschäden.","La casco totale comprende la casco parziale e in più i danni da collisione.","A cobertura total inclui a parcial e, além disso, os danos de colisão.","La cobertura total incluye la parcial y además los daños por colisión."),
         r("Sie zahlt Ihr eigenes Auto, auch wenn Sie den Unfall selbst verschuldet haben.","Paga la sua auto anche se l'incidente l'ha causato lei.","Ela paga o seu próprio carro, mesmo que o senhor tenha causado o acidente.","Paga su propio coche, aunque usted haya causado el accidente."),
         r("Bei einem Leasingauto ist die Vollkasko fast immer Pflicht.","Per un'auto in leasing la casco totale è quasi sempre obbligatoria.","Num carro em leasing a cobertura total é quase sempre obrigatória.","En un coche de leasing la cobertura total es casi siempre obligatoria."),
         r("Bei einem Totalschaden in den ersten Jahren gibt es oft eine Neuwertentschädigung.","In caso di danno totale nei primi anni c'è spesso un indennizzo a valore a nuovo.","Em caso de perda total nos primeiros anos muitas vezes há indenização pelo valor de novo.","En caso de pérdida total en los primeros años a menudo hay indemnización a valor de nuevo."),
         r("Mit Bonusschutz steigt die Prämie nach dem ersten Schaden nicht.","Con la protezione del bonus il premio non sale dopo il primo sinistro.","Com proteção do bônus o prêmio não sobe depois do primeiro sinistro.","Con protección de la bonificación la prima no sube tras el primer siniestro.")],
  tips:{it:["Casco totale = casco parziale + danni da collisione al proprio veicolo, anche quando l'incidente è colpa sua: uscita di strada, urto contro un muro, tamponamento.","È consigliata per auto nuove o di valore ed è quasi sempre obbligatoria per il leasing, spesso anche con un credito auto.","Danno totale: nei primi anni molte assicurazioni pagano il valore a nuovo (prezzo di listino) o un valore attuale maggiorato; dopo, il valore attuale. Il numero di anni cambia da prodotto a prodotto.","I sinistri da collisione fanno salire il grado di premio. La protezione del bonus evita l'aumento per un sinistro all'anno.","La franchigia per collisione è di solito più alta (ad esempio 500–1'000 franchi) e influisce molto sul premio. Molti clienti tolgono la casco totale quando l'auto ha 6–8 anni e passano alla casco parziale."],
        pt:["Cobertura total = cobertura parcial + danos de colisão no próprio veículo, mesmo quando o acidente é culpa sua: saída de pista, batida num muro, batida na traseira.","É recomendada para carros novos ou de valor e é quase sempre obrigatória no leasing, muitas vezes também com financiamento.","Perda total: nos primeiros anos muitas seguradoras pagam o valor de novo (preço de tabela) ou um valor atual majorado; depois, o valor atual. O número de anos muda de produto para produto.","Sinistros de colisão fazem o nível de prêmio subir. A proteção do bônus evita o aumento para um sinistro por ano.","A franquia de colisão costuma ser mais alta (por exemplo 500–1'000 francos) e pesa muito no prêmio. Muitos clientes tiram a cobertura total quando o carro tem 6–8 anos e passam para a parcial."],
        es:["Cobertura total = cobertura parcial + daños por colisión en el propio vehículo, aunque el accidente sea culpa suya: salida de la vía, choque contra un muro, alcance por detrás.","Se recomienda para coches nuevos o de valor y es casi siempre obligatoria en el leasing, a menudo también con un crédito de coche.","Pérdida total: en los primeros años muchas aseguradoras pagan el valor de nuevo (precio de catálogo) o un valor actual incrementado; después, el valor actual. El número de años cambia según el producto.","Los siniestros por colisión hacen subir el nivel de prima. La protección de la bonificación evita la subida por un siniestro al año.","La franquicia de colisión suele ser más alta (por ejemplo 500–1'000 francos) y pesa mucho en la prima. Muchos clientes quitan la cobertura total cuando el coche tiene 6–8 años y pasan a la parcial."]}},
 {sec:7,title:"Zusatzdeckungen beim Auto",desc:{it:"Danni da parcheggio, colpa grave, occupanti, assistenza",pt:"Danos de estacionamento, negligência grave, ocupantes, assistência",es:"Daños de aparcamiento, negligencia grave, ocupantes, asistencia"},
  words:[r("die Zusatzdeckung","la copertura aggiuntiva","a cobertura adicional","la cobertura adicional"),r("der Parkschaden","il danno da parcheggio","o dano de estacionamento","el daño de aparcamiento"),r("die Insassenunfallversicherung","l'assicurazione infortuni occupanti","o seguro de acidentes dos ocupantes","el seguro de accidentes de ocupantes"),r("die Pannenhilfe","il soccorso stradale","a assistência em caso de pane","la asistencia en carretera"),
         r("das Ersatzfahrzeug","il veicolo sostitutivo","o carro reserva","el vehículo de sustitución"),r("mitgeführte Sachen","gli oggetti trasportati","os objetos transportados","los objetos transportados"),r("abschleppen","rimorchiare","rebocar","remolcar"),r("unbekannt","sconosciuto","desconhecido","desconocido")],
  sentences:[r("Die Parkschadenversicherung zahlt, wenn ein Unbekannter Ihr parkiertes Auto beschädigt.","L'assicurazione danni da parcheggio paga se uno sconosciuto danneggia la sua auto parcheggiata.","O seguro de danos de estacionamento paga se um desconhecido danificar o seu carro estacionado.","El seguro de daños de aparcamiento paga si un desconocido daña su coche aparcado."),
         r("Mit der Deckung Grobfahrlässigkeit verzichtet die Versicherung auf Kürzungen.","Con la copertura colpa grave l'assicurazione rinuncia a ridurre le prestazioni.","Com a cobertura de negligência grave a seguradora renuncia a reduções.","Con la cobertura de negligencia grave la aseguradora renuncia a reducciones."),
         r("Die Insassenunfallversicherung zahlt bei Verletzungen der Personen im Auto.","L'infortuni occupanti paga in caso di lesioni delle persone a bordo.","O seguro de ocupantes paga em caso de ferimentos das pessoas no carro.","El seguro de ocupantes paga en caso de lesiones de las personas del coche."),
         r("Bei einer Panne organisiert die Assistance das Abschleppen und ein Ersatzfahrzeug.","In caso di guasto l'assistenza organizza il traino e un veicolo sostitutivo.","Em caso de pane a assistência organiza o reboque e um carro reserva.","En caso de avería la asistencia organiza el remolque y un vehículo de sustitución."),
         r("Mitgeführte Sachen wie ein Laptop sind über eine Zusatzdeckung oder die Hausratversicherung versichert.","Gli oggetti trasportati come un portatile sono assicurati con una copertura aggiuntiva o con la mobilia domestica.","Objetos transportados como um laptop estão cobertos por uma cobertura adicional ou pelo seguro residencial.","Los objetos transportados como un portátil están cubiertos por una cobertura adicional o por el seguro de hogar.")],
  tips:{it:["Danni da parcheggio: danni causati da sconosciuti al veicolo parcheggiato (graffi, ammaccature). Spesso sono limitati a un numero di eventi o a un importo all'anno e di regola non toccano il bonus.","Colpa grave: senza questa copertura l'assicurazione può ridurre le prestazioni in casco o rivalersi in RC se il danno nasce da grave negligenza (ad esempio un semaforo rosso). Non vale con alcol, droghe o eccesso di velocità molto grave.","Infortuni occupanti: capitale in caso di morte o invalidità e spese di cura per conducente e passeggeri. È utile soprattutto per chi trasporta spesso persone o non ha una buona copertura infortuni.","Assistenza: soccorso stradale, traino, veicolo sostitutivo, rientro a casa o notte in albergo, in Svizzera e in Europa.","In consulenza chiedere sempre come il cliente usa l'auto: parcheggia in strada? fa lunghi viaggi? trasporta passeggeri o oggetti di valore? Proporre solo le coperture utili."],
        pt:["Danos de estacionamento: danos causados por desconhecidos ao veículo estacionado (riscos, amassados). Muitas vezes são limitados a um número de eventos ou a um valor por ano e em regra não afetam o bônus.","Negligência grave: sem esta cobertura a seguradora pode reduzir as prestações na cobertura própria ou cobrar na responsabilidade civil se o dano vier de negligência grave (por exemplo um sinal vermelho). Não vale com álcool, drogas ou excesso de velocidade muito grave.","Ocupantes: capital em caso de morte ou invalidez e despesas médicas para condutor e passageiros. É útil sobretudo para quem leva pessoas com frequência ou não tem uma boa cobertura de acidentes.","Assistência: socorro na estrada, reboque, carro reserva, volta para casa ou noite em hotel, na Suíça e na Europa.","Na consultoria pergunte sempre como o cliente usa o carro: estaciona na rua? faz viagens longas? leva passageiros ou objetos de valor? Proponha só as coberturas úteis."],
        es:["Daños de aparcamiento: daños causados por desconocidos al vehículo aparcado (arañazos, abolladuras). A menudo están limitados a un número de casos o a un importe al año y en general no afectan a la bonificación.","Negligencia grave: sin esta cobertura la aseguradora puede reducir las prestaciones en daños propios o repetir en responsabilidad civil si el daño viene de una negligencia grave (por ejemplo un semáforo en rojo). No vale con alcohol, drogas ni exceso de velocidad muy grave.","Ocupantes: capital en caso de muerte o invalidez y gastos médicos para conductor y pasajeros. Es útil sobre todo para quien lleva personas a menudo o no tiene una buena cobertura de accidentes.","Asistencia: auxilio en carretera, remolque, vehículo de sustitución, regreso a casa o noche de hotel, en Suiza y en Europa.","En el asesoramiento pregunta siempre cómo usa el cliente el coche: ¿aparca en la calle? ¿hace viajes largos? ¿lleva pasajeros u objetos de valor? Propón solo las coberturas útiles."]}}
];
