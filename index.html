];
C.kunde={t:["Kundengespräch und Kundenprobleme – der komplette Kurs","Colloquio e problemi con i clienti – il corso completo"],ch:[
{t:"Der Ablauf eines Kundengesprächs",s:"Le cinque fasi di una consulenza",p:[
 [["Ein gutes Kundengespräch hat fünf Phasen.","Un buon colloquio con il cliente ha cinque fasi."],
  ["Zuerst kommt die Begrüssung: Man schafft eine angenehme Atmosphäre und erklärt den Ablauf.","Prima viene l'accoglienza: si crea un'atmosfera piacevole e si spiega lo svolgimento."],
  ["Dann folgt die Bedarfsanalyse mit offenen Fragen: Was ist Ihnen wichtig? Was möchten Sie absichern?","Poi segue l'analisi del bisogno con domande aperte: Cosa le importa? Cosa vuole proteggere?"]],
 [["In der dritten Phase präsentiert man die Lösung, mit Vorteilen für genau diesen Kunden.","Nella terza fase si presenta la soluzione, con i vantaggi per proprio quel cliente."],
  ["In der vierten Phase beantwortet man Einwände ruhig und mit Beispielen.","Nella quarta fase si risponde alle obiezioni con calma e con esempi."],
  ["Zum Schluss fasst man zusammen, vereinbart den nächsten Schritt und füllt das Beratungsprotokoll aus.","Alla fine si riassume, si concorda il prossimo passo e si compila il protocollo di consulenza."]]],
 box:{h:"Domande aperte utili",html:`<ul><li><i>Wie sieht Ihre aktuelle Situation aus?</i></li><li><i>Was ist Ihnen bei einer Versicherung am wichtigsten?</i></li><li><i>Was würde passieren, wenn Sie drei Monate nicht arbeiten könnten?</i></li><li><i>Welche Pläne haben Sie für die nächsten fünf Jahre?</i></li></ul>`},
 v:[["die Phase, -n","fase"],["die Atmosphäre","atmosfera"],["der Ablauf","svolgimento"],["die Bedarfsanalyse","analisi del bisogno"],["offene Fragen","domande aperte"],["absichern","proteggere"],["der Einwand, Einwände","obiezione"],["zusammenfassen","riassumere"]]},
{t:"Problem 1: Der Kunde findet die Prämie zu teuer",s:"Reclamo sul prezzo",p:[
 [["Ein häufiger Satz ist: «Das ist mir zu teuer.»","Una frase frequente è: «Per me è troppo caro.»"],
  ["Man diskutiert nicht sofort über den Preis, sondern fragt zuerst: «Im Vergleich wozu?»","Non si discute subito del prezzo, ma si chiede prima: «Rispetto a cosa?»"],
  ["Oft vergleicht der Kunde Angebote mit unterschiedlichen Leistungen.","Spesso il cliente confronta offerte con prestazioni diverse."]],
 [["Dann zeigt man den Wert: Was bekommt der Kunde für sein Geld, und was kostet ein Schaden ohne Versicherung?","Poi si mostra il valore: cosa riceve il cliente per i suoi soldi, e quanto costa un danno senza assicurazione?"],
  ["Wenn der Preis wirklich zu hoch ist, sucht man Möglichkeiten: höhere Franchise, weniger Zusatzdeckungen, jährliche statt monatliche Zahlung.","Se il prezzo è davvero troppo alto, si cercano possibilità: franchigia più alta, meno coperture aggiuntive, pagamento annuale invece che mensile."],
  ["Wichtig ist, ehrlich zu bleiben und nichts Unnötiges zu verkaufen.","È importante restare onesti e non vendere niente di inutile."]]],
 box:{h:"Frasi per il reclamo sul prezzo",html:`<ul><li><i>«Ich verstehe, dass der Preis für Sie wichtig ist.»</i></li><li><i>«Im Vergleich wozu finden Sie es teuer?»</i></li><li><i>«Schauen wir zusammen, wo wir sparen können, ohne dass Sie wichtigen Schutz verlieren.»</i></li><li><i>«Mit einer höheren Franchise sinkt die Prämie um 18 Franken pro Monat.»</i></li></ul>`},
 v:[["das Angebot, -e","offerta"],["unterschiedlich","diverso"],["der Wert","valore"],["sinken","scendere"],["unnötig","inutile"],["ehrlich bleiben","restare onesti"],["verlieren","perdere"],["im Vergleich zu","rispetto a"]]},
{t:"Problem 2: Der Kunde will den Vertrag ändern",s:"Modificare un contratto",p:[
 [["Kunden möchten Verträge oft ändern: eine neue Adresse, ein neues Auto, eine andere Franchise oder eine zusätzliche Person.","I clienti vogliono spesso modificare i contratti: un nuovo indirizzo, una nuova auto, un'altra franchigia o una persona in più."],
  ["Kleine Änderungen wie die Adresse meldet man einfach der Versicherung.","Piccole modifiche come l'indirizzo si comunicano semplicemente all'assicurazione."],
  ["Für Änderungen der Deckung braucht es einen schriftlichen Änderungsantrag, und die Versicherung schickt einen Nachtrag zur Police.","Per modifiche della copertura serve una richiesta di modifica scritta, e l'assicurazione manda un'appendice alla polizza."]],
 [["Man muss immer kontrollieren, ab wann die Änderung gilt und ob sich die Prämie ändert.","Bisogna sempre controllare da quando vale la modifica e se cambia il premio."],
  ["Bei manchen Verträgen, zum Beispiel in der Krankenkasse, sind Änderungen nur auf bestimmte Termine möglich.","In alcuni contratti, per esempio nella cassa malati, le modifiche sono possibili solo a determinate scadenze."],
  ["Eine Erhöhung der Deckung kann neue Gesundheitsfragen bedeuten.","Un aumento della copertura può significare nuove domande sulla salute."]]],
 v:[["ändern / die Änderung","modificare / modifica"],["der Änderungsantrag","richiesta di modifica"],["der Nachtrag","appendice (alla polizza)"],["gelten ab","valere da"],["bestimmt","determinato"],["die Erhöhung","aumento"],["bedeuten","significare"],["zusätzlich","in più"]]},
{t:"Problem 3: Die Rate ist nicht bezahlt",s:"Il cliente non paga: come contattarlo",p:[
 [["Wenn ein Kunde eine Prämie nicht bezahlt, schickt die Versicherung zuerst eine Mahnung mit einer Frist von 14 Tagen.","Se un cliente non paga un premio, l'assicurazione manda prima un sollecito con un termine di 14 giorni."],
  ["Nach Ablauf der Frist kann die Deckung ruhen: Ein Schaden in dieser Zeit ist nicht versichert.","Scaduto il termine la copertura può essere sospesa: un danno in questo periodo non è assicurato."],
  ["Das ist für den Kunden gefährlich, und viele wissen es nicht.","Questo è pericoloso per il cliente, e molti non lo sanno."]],
 [["Deshalb ruft ein guter Berater den Kunden früh an, freundlich und ohne Vorwurf.","Perciò un buon consulente chiama il cliente presto, in modo gentile e senza rimprovero."],
  ["Am Telefon fragt man nach dem Grund und hört zu.","Al telefono si chiede il motivo e si ascolta."],
  ["Mögliche Lösungen sind eine Ratenzahlung, eine andere Zahlungsweise, ein günstigeres Produkt oder eine Prämienpause.","Possibili soluzioni sono un pagamento a rate, un'altra modalità di pagamento, un prodotto più economico o una pausa dei premi."]],
 [["Erreicht man den Kunden nicht, schickt man eine kurze, höfliche E-Mail oder SMS und später einen Brief.","Se non si raggiunge il cliente, si manda una breve e cortese e-mail o SMS e poi una lettera."],
  ["Alles wird im CRM notiert: Datum, Kanal, Antwort und nächster Schritt.","Tutto viene annotato nel CRM: data, canale, risposta e passo successivo."]]],
 box:{h:"Script telefonico per la rata non pagata",html:`<ol><li><i>«Guten Tag Herr Costa, hier ist Luiz von Wertia Finanz. Haben Sie kurz Zeit?»</i></li><li><i>«Ich habe gesehen, dass die Prämie für Ihre Autoversicherung noch offen ist. Ist alles in Ordnung?»</i></li><li><i>«Wichtig ist: Nach der Mahnfrist sind Sie nicht mehr versichert. Das möchte ich für Sie vermeiden.»</i></li><li><i>«Wäre eine Zahlung in zwei Raten für Sie möglich?»</i></li><li><i>«Ich schicke Ihnen das gleich per E-Mail. Danke für das offene Gespräch.»</i></li></ol><p><b>E-mail breve:</b> <i>«Guten Tag Herr Costa, ich habe Sie telefonisch nicht erreicht. Ihre Prämie vom 1. Oktober ist noch offen. Bitte rufen Sie mich an, damit wir gemeinsam eine Lösung finden. Freundliche Grüsse»</i></p>`},

{t:"Den Kunden motivieren und halten",s:"Motivazioni: perché il cliente resta",p:[
 [["Kunden bleiben, wenn sie sich verstanden und gut betreut fühlen.","I clienti restano se si sentono capiti e ben seguiti."],
  ["Ein Anruf zum Geburtstag oder ein jährlicher Check der Versicherungen zeigt, dass man an den Kunden denkt.","Una telefonata per il compleanno o un controllo annuale delle assicurazioni mostra che si pensa al cliente."],
  ["Man spricht über Ziele, nicht nur über Produkte: eine eigene Wohnung, die Ausbildung der Kinder, eine sichere Pensionierung.","Si parla di obiettivi, non solo di prodotti: una casa propria, gli studi dei figli, una pensione sicura."]],
 [["Wenn ein Kunde Probleme hat, ist das eine Chance, Vertrauen aufzubauen.","Quando un cliente ha problemi, è un'occasione per costruire fiducia."],
  ["Wer in einer schwierigen Situation hilft, bekommt oft Empfehlungen an Freunde und Familie.","Chi aiuta in una situazione difficile riceve spesso raccomandazioni ad amici e famiglia."]]],
 box:{h:"Frasi che motivano",html:`<ul><li><i>«Denken Sie an Ihr Ziel: in fünf Jahren die eigene Wohnung.»</i></li><li><i>«Jeder Franken, den Sie heute sparen, arbeitet für Sie.»</i></li><li><i>«Sie sind nicht allein, wir finden eine Lösung.»</i></li><li><i>«Darf ich Sie in sechs Monaten wieder anrufen?»</i></li></ul>`},
 v:[["betreuen","seguire, assistere"],["sich verstanden fühlen","sentirsi capito"],["das Ziel, -e","obiettivo"],["die Ausbildung","formazione, studi"],["die Chance","occasione"],["das Vertrauen aufbauen","costruire fiducia"],["die Empfehlung","raccomandazione"],["schwierig","difficile"]]},
{t:"Geschichte 1 – Im Büro: Der Jahrescheck",s:"La parte burocratica in ufficio",p:[
 [["Jeden Montag druckt Sara die Liste der Kunden aus, deren Verträge in drei Monaten ablaufen.","Ogni lunedì Sara stampa l'elenco dei clienti i cui contratti scadono fra tre mesi."],
  ["Für jeden Kunden bereitet sie ein kurzes Dossier vor: alle Policen, Prämien und offenen Punkte.","Per ogni cliente prepara un breve dossier: tutte le polizze, i premi e i punti aperti."]],
 [["Dann schreibt sie eine E-Mail und schlägt drei Termine für einen Jahrescheck vor.","Poi scrive un'e-mail e propone tre appuntamenti per un controllo annuale."],
  ["Antwortet der Kunde nicht, ruft sie nach einer Woche an.","Se il cliente non risponde, chiama dopo una settimana."],
  ["Im CRM markiert sie jeden Kontakt mit Farbe: grün für Termin, gelb für ohne Antwort, rot für Problem.","Nel CRM segna ogni contatto con un colore: verde per appuntamento, giallo per senza risposta, rosso per problema."]]],
 v:[["ausdrucken","stampare"],["ablaufen","scadere"],["vorbereiten","preparare"],["offene Punkte","punti aperti"],["vorschlagen","proporre"],["der Jahrescheck","controllo annuale"],["markieren","segnare"],["ohne Antwort","senza risposta"]]},
{t:"Geschichte 2 – Verkauf: Vom Einwand zum Abschluss",s:"La vendita di un contratto",p:[
 [["Herr Moreira braucht eine Hausratversicherung, sagt aber: «Ich habe ein Angebot, das 50 Franken billiger ist.»","Il signor Moreira ha bisogno di un'assicurazione mobilia domestica, ma dice: «Ho un'offerta più economica di 50 franchi.»"],
  ["Luiz fragt freundlich: «Darf ich das Angebot sehen?»","Luiz chiede gentilmente: «Posso vedere l'offerta?»"]],
 [["Er vergleicht beide Offerten Zeile für Zeile und findet den Unterschied: Beim billigeren Angebot fehlt der einfache Diebstahl auswärts.","Confronta le due offerte riga per riga e trova la differenza: nell'offerta più economica manca il furto semplice fuori casa."],
  ["«Wenn Ihnen das Velo vor dem Bahnhof gestohlen wird, bezahlen Sie es dort selbst», erklärt Luiz.","«Se le rubano la bici davanti alla stazione, lì la paga lei», spiega Luiz."],
  ["Herr Moreira fährt jeden Tag mit einem E-Bike für 3000 Franken zur Arbeit.","Il signor Moreira va al lavoro ogni giorno con una e-bike da 3000 franchi."],
  ["Er entscheidet sich für Luiz' Offerte und empfiehlt Wertia später seinem Bruder.","Sceglie l'offerta di Luiz e più tardi raccomanda Wertia a suo fratello."]]],

{t:"Geschichte 3 – Problem lösen: Der Kunde will alles kündigen",s:"Prezzo, modifica, rata non pagata e motivazione",p:[
 [["Frau Tavares ruft wütend an: Alle Prämien sind gestiegen, sie hat zwei Mahnungen bekommen und will alle Verträge kündigen.","La signora Tavares chiama arrabbiata: tutti i premi sono aumentati, ha ricevuto due solleciti e vuole disdire tutti i contratti."],
  ["Luiz bleibt ruhig: «Ich verstehe Ihren Ärger. Darf ich morgen mit Ihnen alle Verträge anschauen?»","Luiz resta calmo: «Capisco il suo fastidio. Posso guardare domani con lei tutti i contratti?»"]],
 [["Im Gespräch erfährt er, dass ihr Mann krank ist und das Einkommen gesunken ist.","Durante il colloquio scopre che suo marito è malato e il reddito è diminuito."],
  ["Er ändert die Krankenkassen-Franchise nicht, weil der Mann viele Arztkosten hat, aber er wechselt ins Hausarztmodell.","Non cambia la franchigia della cassa malati, perché il marito ha molte spese mediche, ma passa al modello medico di famiglia."],
  ["Bei der Autoversicherung streicht er die Vollkasko für das zehn Jahre alte Auto.","Nell'assicurazione auto toglie la casco totale per l'auto di dieci anni."],
  ["Für die offenen Prämien vereinbart er mit der Versicherung eine Ratenzahlung.","Per i premi non pagati concorda con l'assicurazione un pagamento a rate."],
  ["Die Lebensversicherung reduziert er, statt sie zu kündigen, damit die Familie geschützt bleibt.","Riduce l'assicurazione vita invece di disdirla, così la famiglia resta protetta."]],
 [["Am Ende bezahlt Frau Tavares 210 Franken weniger pro Monat und ist weiterhin gut versichert.","Alla fine la signora Tavares paga 210 franchi in meno al mese ed è ancora ben assicurata."],
  ["Sie sagt: «Ich dachte, Versicherungen wollen nur Geld. Sie haben mir wirklich geholfen.»","Dice: «Pensavo che le assicurazioni volessero solo soldi. Lei mi ha davvero aiutata.»"]]],
 v:[["steigen","aumentare"],["erfahren","venire a sapere"],["sinken","diminuire"],["streichen","togliere, cancellare"],["vereinbaren","concordare"],["statt … zu","invece di"],["weiterhin","ancora, tuttora"],["wirklich","davvero"]]},
{t:"Dialog: Die offene Prämie",s:"Telefonata per una rata non pagata",dlg:true,p:[
 {w:"Berater",s:[["Guten Tag Frau Lima, hier ist Diogo von Wertia Finanz. Haben Sie einen Moment Zeit?","Buongiorno signora Lima, sono Diogo di Wertia Finanz. Ha un momento?"]]},
 {w:"Kundin",s:[["Ja, kurz. Worum geht es?","Sì, brevemente. Di cosa si tratta?"]]},
 {w:"Berater",s:[["Ich habe gesehen, dass die Prämie Ihrer Hausratversicherung seit September offen ist.","Ho visto che il premio della sua assicurazione mobilia è aperto da settembre."],["Ist alles in Ordnung bei Ihnen?","Va tutto bene?"]]},
 {w:"Kundin",s:[["Ehrlich gesagt nicht. Ich arbeite im Moment nur 50 Prozent.","Sinceramente no. Al momento lavoro solo al 50 per cento."]]},
 {w:"Berater",s:[["Danke, dass Sie das sagen. Wichtig ist: Nach der Mahnfrist wären Sie nicht mehr versichert.","Grazie di dirmelo. È importante: dopo il termine del sollecito non sarebbe più assicurata."],["Das möchte ich vermeiden.","Questo vorrei evitarlo."]]},
 {w:"Kundin",s:[["Was kann ich machen?","Cosa posso fare?"]]},
 {w:"Berater",s:[["Ich kann bei der Versicherung eine Zahlung in drei Raten beantragen.","Posso chiedere all'assicurazione un pagamento in tre rate."],["Und für nächstes Jahr schauen wir, ob wir die Versicherungssumme anpassen können.","E per l'anno prossimo vediamo se possiamo adeguare la somma assicurata."]]},
 {w:"Kundin",s:[["Das wäre super.","Sarebbe ottimo."]]},
 {w:"Berater",s:[["Ich schicke Ihnen heute noch eine E-Mail mit den Daten. Ich rufe Sie vor jeder Rate kurz an.","Le mando oggi stesso un'e-mail con le date. La chiamo brevemente prima di ogni rata."]]},
 {w:"Kundin",s:[["Vielen Dank, das hilft mir sehr.","Grazie mille, mi aiuta molto."]]}],v:[]},

C.buero={t:["Im Büro – der komplette Kurs","In ufficio – il corso completo"],ch:[
{t:"Ein Arbeitstag in einem Beratungsbüro",s:"Come funziona una giornata da Wertia",p:[
 [["Der Tag beginnt um acht Uhr mit den E-Mails und den Nachrichten auf dem Telefonbeantworter.","La giornata inizia alle otto con le e-mail e i messaggi in segreteria."],
  ["Um halb neun gibt es eine kurze Teambesprechung: Wer hat welche Termine, welche Fälle sind dringend?","Alle otto e mezza c'è una breve riunione del team: chi ha quali appuntamenti, quali casi sono urgenti?"],
  ["Danach arbeitet jeder an seinen Aufgaben: Offerten erstellen, Anträge erfassen, Schadenfälle betreuen.","Poi ognuno lavora ai suoi compiti: preparare offerte, registrare proposte, seguire sinistri."]],
 [["Am Nachmittag finden oft Kundengespräche im Sitzungszimmer statt.","Nel pomeriggio si svolgono spesso colloqui con i clienti nella sala riunioni."],
  ["Nach jedem Gespräch schreibt man das Beratungsprotokoll und aktualisiert das CRM.","Dopo ogni colloquio si scrive il protocollo di consulenza e si aggiorna il CRM."],
  ["Vor dem Feierabend kontrolliert man die Pendenzenliste für den nächsten Tag.","Prima di finire si controlla l'elenco delle pendenze per il giorno dopo."]]],

{t:"Geschichte 1 – Im Büro: Die neue Mitarbeiterin",s:"La parte burocratica in ufficio",p:[
 [["Heute beginnt Lara bei Wertia. Sara zeigt ihr den Arbeitsplatz und erklärt das Ablagesystem.","Oggi Lara inizia da Wertia. Sara le mostra la postazione e spiega il sistema di archiviazione."],
  ["Jeder Kunde hat ein Dossier mit fünf Registern: Personalien, Policen, Schäden, Korrespondenz und Protokolle.","Ogni cliente ha un dossier con cinque sezioni: dati personali, polizze, sinistri, corrispondenza e protocolli."],
  ["Papierdokumente werden gescannt und dann im CRM abgelegt.","I documenti cartacei vengono scansionati e poi archiviati nel CRM."],
  ["Lara bekommt ein Passwort und unterschreibt die Vertraulichkeitserklärung.","Lara riceve una password e firma la dichiarazione di riservatezza."]]],

{t:"Geschichte 2 – Verkauf: Der Kunde am Empfang",s:"La vendita di un contratto",p:[
 [["Ein Mann kommt ohne Termin an den Empfang und fragt nach einer Haftpflichtversicherung.","Un uomo arriva senza appuntamento alla reception e chiede un'assicurazione RC."],
  ["Lara begrüsst ihn freundlich und bietet ihm einen Kaffee an.","Lara lo accoglie gentilmente e gli offre un caffè."],
  ["Sie fragt, ob er zehn Minuten warten kann, weil Luiz gleich frei ist.","Chiede se può aspettare dieci minuti, perché Luiz è libero a breve."],
  ["Luiz macht eine kurze Analyse und zeigt eine Kombination aus Privathaftpflicht und Hausrat; der Kunde unterschreibt noch am gleichen Tag.","Luiz fa una breve analisi e mostra una combinazione di RC privata e mobilia; il cliente firma lo stesso giorno."]]],

{t:"Geschichte 3 – Problem lösen: Der Drucker und die Frist",s:"Come si risolve un problema",p:[
 [["Um 16 Uhr muss ein unterschriebener Antrag bei der Versicherung sein, aber der Drucker funktioniert nicht.","Alle 16 una proposta firmata deve essere all'assicurazione, ma la stampante non funziona."],
  ["Lara bleibt ruhig und ruft die IT-Firma an.","Lara resta calma e chiama la ditta informatica."],
  ["In der Zwischenzeit schickt Sara dem Kunden den Antrag zur elektronischen Unterschrift.","Nel frattempo Sara manda al cliente la proposta per la firma elettronica."],
  ["Der Kunde unterschreibt auf dem Handy, und der Antrag ist um 15.40 Uhr bei der Versicherung.","Il cliente firma sul cellulare e la proposta è all'assicurazione alle 15.40."]]],

C.tel={t:["Telefonieren – der komplette Kurs","Telefonare – il corso completo"],ch:[
{t:"Professionell telefonieren",s:"Struttura di una telefonata e frasi chiave",p:[
 [["Am Telefon nennt man zuerst die Firma und den eigenen Namen.","Al telefono si dice prima il nome della ditta e il proprio nome."],
  ["Dann fragt man nach dem Anliegen: «Was kann ich für Sie tun?»","Poi si chiede il motivo: «Cosa posso fare per lei?»"],
  ["Man notiert immer Name, Telefonnummer, Anliegen und Rückrufzeit.","Si annotano sempre nome, numero, motivo e orario per richiamare."]],
 [["Wenn die gesuchte Person nicht da ist, bietet man einen Rückruf an oder nimmt eine Nachricht entgegen.","Se la persona cercata non c'è, si offre una richiamata o si prende un messaggio."],
  ["Höfliche Formen mit Konjunktiv II klingen professionell: «Könnten Sie das bitte wiederholen?»","Le forme cortesi con il congiuntivo II suonano professionali: «Potrebbe ripeterlo, per favore?»"],
  ["Am Schluss fasst man zusammen und verabschiedet sich: «Ich habe notiert … Auf Wiederhören!»","Alla fine si riassume e ci si congeda: «Ho annotato … Arrivederci!»"]]],

{t:"Geschichte 1 – Im Büro: Die Telefonnotiz",s:"La parte burocratica in ufficio",p:[
 [["Lara nimmt einen Anruf für Luiz entgegen, der gerade bei einem Kunden ist.","Lara risponde a una chiamata per Luiz, che è da un cliente."],
  ["Sie schreibt eine Telefonnotiz: Herr Gerber, Tel. 079 …, Frage zur Kündigung der Hausratversicherung, Rückruf heute nach 17 Uhr.","Scrive una nota telefonica: signor Gerber, tel. 079 …, domanda sulla disdetta dell'assicurazione mobilia, richiamare oggi dopo le 17."],
  ["Sie legt die Notiz im CRM als Pendenz für Luiz an und markiert sie als wichtig.","Crea la nota nel CRM come pendenza per Luiz e la segna come importante."]]],

{t:"Geschichte 2 – Verkauf: Der Rückruf",s:"La vendita di un contratto",p:[
 [["Luiz ruft Herrn Gerber zurück. Er will die Hausratversicherung kündigen, weil sie zu teuer ist.","Luiz richiama il signor Gerber. Vuole disdire l'assicurazione mobilia perché è troppo cara."],
  ["Luiz fragt, ob sich etwas verändert hat: Herr Gerber ist in eine kleinere Wohnung umgezogen.","Luiz chiede se è cambiato qualcosa: il signor Gerber si è trasferito in un appartamento più piccolo."],
  ["Luiz passt die Versicherungssumme an, die Prämie sinkt um 25 Prozent, und Herr Gerber bleibt Kunde.","Luiz adegua la somma assicurata, il premio scende del 25 per cento e il signor Gerber resta cliente."]]],

C.termin={t:["Termine vereinbaren – der komplette Kurs","Fissare appuntamenti – il corso completo"],ch:[
{t:"Termine vorschlagen, bestätigen, verschieben",s:"Le frasi per gestire l'agenda",p:[
 [["Einen Termin vereinbart man am besten mit zwei konkreten Vorschlägen.","Un appuntamento si fissa meglio con due proposte concrete."],
  ["Zum Beispiel: «Passt Ihnen Dienstag um 10 Uhr oder lieber Donnerstag um 14 Uhr?»","Per esempio: «Le va bene martedì alle 10 o preferisce giovedì alle 14?»"],
  ["Danach schickt man eine schriftliche Bestätigung mit Datum, Zeit, Adresse und den Unterlagen, die der Kunde mitbringen soll.","Poi si manda una conferma scritta con data, ora, indirizzo e i documenti che il cliente deve portare."]],
 [["Muss man einen Termin verschieben, informiert man so früh wie möglich und schlägt sofort einen neuen vor.","Se si deve spostare un appuntamento, si informa il prima possibile e se ne propone subito uno nuovo."],

{t:"Geschichte 1 – Im Büro: Der volle Kalender",s:"La parte burocratica in ufficio",p:[
 [["Im November ist der Kalender voll, weil viele Kunden die Krankenkasse wechseln wollen.","A novembre l'agenda è piena perché molti clienti vogliono cambiare cassa malati."],
  ["Sara plant die Termine in Blöcken von 45 Minuten und lässt jeden Tag eine Stunde frei für Notfälle.","Sara pianifica gli appuntamenti in blocchi di 45 minuti e lascia ogni giorno un'ora libera per le urgenze."],
  ["Jeder Termin bekommt im Kalender eine Farbe: rot für Krankenkasse, blau für Vorsorge, grün für Steuern.","Ogni appuntamento riceve un colore nell'agenda: rosso per cassa malati, blu per previdenza, verde per imposte."]]],

{t:"Geschichte 2 – Verkauf: Vom Termin zum Abschluss",s:"La vendita di un contratto",p:[

{t:"Geschichte 3 – Problem lösen: Der Kunde kommt nicht",s:"Come si risolve un problema",p:[
 [["Herr Pinto kommt nicht zum Termin und antwortet nicht am Telefon.","Il signor Pinto non viene all'appuntamento e non risponde al telefono."],
  ["Diogo schickt eine freundliche SMS: «Wir hatten heute um 15 Uhr einen Termin. Ist alles in Ordnung? Gerne finden wir einen neuen Termin.»","Diogo manda un SMS gentile: «Oggi alle 15 avevamo un appuntamento. Va tutto bene? Troviamo volentieri un nuovo appuntamento.»"],

C.praes={t:["Präsentieren und argumentieren – der komplette Kurs","Presentare e argomentare – il corso completo"],ch:[
{t:"Eine Lösung überzeugend präsentieren",s:"Struttura e frasi per argomentare",p:[
 [["Eine gute Präsentation ist kurz und hat eine klare Struktur: Situation, Problem, Lösung, Nutzen.","Una buona presentazione è breve e ha una struttura chiara: situazione, problema, soluzione, beneficio."],
  ["Man spricht über den Nutzen für den Kunden, nicht über technische Details.","Si parla del beneficio per il cliente, non di dettagli tecnici."],
  ["Zahlen und Beispiele machen Argumente stärker.","Numeri ed esempi rendono gli argomenti più forti."]],
 [["Auf Einwände reagiert man mit der Methode «Ja, und»: Man bestätigt das Gefühl und ergänzt ein neues Argument.","Alle obiezioni si reagisce con il metodo «Sì, e»: si conferma la sensazione e si aggiunge un nuovo argomento."],
  ["Am Ende fasst man die drei wichtigsten Vorteile zusammen und stellt eine Abschlussfrage.","Alla fine si riassumono i tre vantaggi più importanti e si fa una domanda di chiusura."]]],
 box:{h:"Frasi per argomentare",html:`<ul><li><i>Der grösste Vorteil für Sie ist …</i></li><li><i>Das bedeutet konkret, dass …</i></li><li><i>Einerseits …, andererseits …</i></li><li><i>Ich verstehe Ihre Bedenken, und gleichzeitig …</i></li><li><i>Zusammenfassend kann man sagen …</i></li><li><i>Wollen wir das so umsetzen?</i> (domanda di chiusura)</li></ul>`},

{t:"Geschichte 1 – Im Büro: Die Präsentation vorbereiten",s:"La parte burocratica in ufficio",p:[
 [["Für ein Treffen mit einem Firmenkunden bereitet Luiz eine Präsentation vor.","Per un incontro con un cliente aziendale Luiz prepara una presentazione."],
  ["Sara sammelt die bestehenden Policen und erstellt eine Übersicht mit allen Prämien.","Sara raccoglie le polizze esistenti e crea una panoramica con tutti i premi."],
  ["Luiz macht daraus fünf Folien: Ausgangslage, Lücken, Vorschlag, Kosten, nächste Schritte.","Luiz ne fa cinque slide: situazione iniziale, lacune, proposta, costi, prossimi passi."]]],

{t:"Geschichte 2 – Verkauf: Die Präsentation beim Firmenkunden",s:"La vendita di un contratto",p:[
 [["Der Chef einer Malerfirma hört zu, aber er sagt: «Wir hatten nie einen grossen Schaden.»","Il capo di una ditta di pittura ascolta, ma dice: «Non abbiamo mai avuto un grande danno.»"],
  ["Luiz antwortet: «Ja, und genau deshalb ist jetzt der richtige Moment, gute Bedingungen zu bekommen.»","Luiz risponde: «Sì, ed è proprio per questo che ora è il momento giusto per ottenere buone condizioni.»"],
  ["Er zeigt ein Beispiel: Ein Mitarbeiter fällt drei Monate aus, und ohne Krankentaggeld kostet das die Firma 18 000 Franken.","Mostra un esempio: un dipendente si assenta tre mesi e senza indennità giornaliera costa alla ditta 18 000 franchi."],
  ["Der Chef stellt Fragen, und am Schluss sagt er: «Schicken Sie mir den Vertrag.»","Il capo fa domande e alla fine dice: «Mi mandi il contratto.»"]]],

C.mail={t:["E-Mails schreiben – der komplette Kurs","Scrivere e-mail – il corso completo"],ch:[
{t:"Aufbau einer geschäftlichen E-Mail",s:"Struttura e formule",p:[
 [["Eine geschäftliche E-Mail hat einen klaren Betreff, eine Anrede, einen kurzen Text, eine Grussformel und eine Signatur.","Un'e-mail commerciale ha un oggetto chiaro, un saluto iniziale, un testo breve, una formula di saluto e una firma."],
  ["In der Schweiz schreibt man nach der Anrede kein Komma: «Sehr geehrte Frau Keller» und dann eine neue Zeile.","In Svizzera dopo il saluto iniziale non si mette la virgola: «Sehr geehrte Frau Keller» e poi una nuova riga."],
  ["Die übliche Grussformel ist «Freundliche Grüsse».","La formula di saluto abituale è «Freundliche Grüsse»."]],
 [["Ein Anliegen pro E-Mail macht die Antwort einfacher.","Una richiesta per e-mail rende la risposta più facile."],
  ["Wenn man etwas braucht, nennt man eine Frist: «Bitte senden Sie mir die Unterlagen bis Freitag.»","Se serve qualcosa, si indica un termine: «Mi mandi per favore i documenti entro venerdì.»"],
  ["Anhänge erwähnt man im Text, und Gesundheitsdaten schickt man nie unverschlüsselt.","Gli allegati si menzionano nel testo, e i dati sanitari non si mandano mai non criptati."]]],

{t:"Geschichte 1 – Im Büro: Der volle Posteingang",s:"La parte burocratica in ufficio",p:[
 [["Nach den Ferien hat Sara 140 ungelesene E-Mails.","Dopo le vacanze Sara ha 140 e-mail non lette."],

  ["Zuerst beantwortet sie die dringenden Kundenanfragen, dann leitet sie Schadenmeldungen an die Versicherungen weiter.","Prima risponde alle richieste urgenti dei clienti, poi inoltra le notifiche di sinistro alle assicurazioni."],
  ["Am Abend ist der Ordner «sofort» leer.","La sera la cartella «subito» è vuota."]]],

{t:"Geschichte 2 – Verkauf: Die Offerte per E-Mail",s:"La vendita di un contratto",p:[
 [["Diogo schickt einer Kundin die Offerte für eine Zusatzversicherung.","Diogo manda a una cliente l'offerta per una complementare."],
  ["Statt nur «Anbei die Offerte» schreibt er drei Sätze mit den wichtigsten Vorteilen und dem Preis pro Monat.","Invece di scrivere solo «In allegato l'offerta» scrive tre frasi con i vantaggi principali e il prezzo al mese."],
  ["Am Ende schlägt er einen kurzen Telefontermin vor, um Fragen zu klären.","Alla fine propone un breve appuntamento telefonico per chiarire le domande."],
  ["Die Kundin antwortet noch am gleichen Tag und unterschreibt nach dem Telefonat.","La cliente risponde lo stesso giorno e firma dopo la telefonata."]]],

{t:"Geschichte 3 – Problem lösen: Die Beschwerde-Mail",s:"Come si risolve un problema",p:[
 [["Ein Kunde schreibt eine wütende E-Mail mit vielen Ausrufezeichen.","Un cliente scrive un'e-mail arrabbiata con molti punti esclamativi."],
  ["Sara antwortet nicht sofort emotional, sondern wartet zehn Minuten und liest die Mail nochmals.","Sara non risponde subito in modo emotivo, ma aspetta dieci minuti e rilegge l'e-mail."],
  ["Ihre Antwort beginnt mit Verständnis, erklärt die Fakten und nennt eine konkrete Lösung mit Datum.","La sua risposta inizia con comprensione, spiega i fatti e indica una soluzione concreta con una data."],

C.finma={t:["FINMA und Gesetze – der komplette Kurs","FINMA e leggi – il corso completo"],ch:[
{t:"Die Aufsicht über Versicherungsvermittler",s:"FINMA, registro, intermediari vincolati e non vincolati",p:[
 [["Die FINMA ist die Eidgenössische Finanzmarktaufsicht.","La FINMA è l'Autorità federale di vigilanza sui mercati finanziari."],
  ["Sie beaufsichtigt Banken, Versicherungen und auch Versicherungsvermittler.","Vigila su banche, assicurazioni e anche intermediari assicurativi."],
  ["Die wichtigste Grundlage ist das Versicherungsaufsichtsgesetz, kurz VAG.","La base più importante è la legge sulla sorveglianza degli assicuratori, abbreviata VAG (LSA)."]],
 [["Man unterscheidet gebundene und ungebundene Vermittler.","Si distinguono intermediari vincolati e non vincolati."],
  ["Ein gebundener Vermittler arbeitet für eine Versicherung, ein ungebundener ist unabhängig und vertritt die Interessen des Kunden.","Un intermediario vincolato lavora per un'assicurazione, uno non vincolato è indipendente e rappresenta gli interessi del cliente."],
  ["Ungebundene Vermittler müssen sich im Register der FINMA eintragen lassen, eine Aus- und Weiterbildung nachweisen und einer Ombudsstelle angeschlossen sein.","Gli intermediari non vincolati devono iscriversi nel registro della FINMA, dimostrare formazione e aggiornamento ed essere affiliati a un ufficio di mediazione."],
  ["Ausserdem brauchen sie eine Berufshaftpflichtversicherung oder gleichwertige Sicherheiten.","Inoltre hanno bisogno di una RC professionale o di garanzie equivalenti."]]],
 box:{h:"Vincolato o non vincolato?",html:`<table><tr><th></th><th>Gebunden</th><th>Ungebunden (es. Wertia)</th></tr><tr><td>Lavora per</td><td>Un'assicurazione</td><td>Il cliente</td></tr><tr><td>Registro FINMA</td><td>Facoltativo</td><td>Obbligatorio</td></tr><tr><td>Ombudsstelle</td><td>Tramite l'assicurazione</td><td>Affiliazione obbligatoria</td></tr></table>`},

{t:"Die Informationspflicht nach Art. 45 VAG",s:"Cosa deve sapere il cliente prima della firma",p:[
 [["Vor dem Abschluss muss der Vermittler den Kunden informieren.","Prima della stipula l'intermediario deve informare il cliente."],
  ["Der Kunde muss wissen, wer der Vermittler ist, ob er gebunden oder ungebunden ist und für welche Versicherungen er arbeitet.","Il cliente deve sapere chi è l'intermediario, se è vincolato o no e per quali assicurazioni lavora."],
  ["Er muss auch über die Entschädigung informiert werden, also wer den Vermittler bezahlt.","Deve essere informato anche sul compenso, cioè su chi paga l'intermediario."]],
 [["Zur Informationspflicht gehören auch die Ombudsstelle und der Umgang mit Personendaten.","Fanno parte dell'obbligo d'informazione anche l'ufficio di mediazione e il trattamento dei dati personali."],
  ["Die Information muss klar und vor der Unterschrift erfolgen, am besten schriftlich.","L'informazione deve essere chiara e avvenire prima della firma, meglio per iscritto."],
  ["Die Beratung wird in einem Beratungsprotokoll dokumentiert.","La consulenza viene documentata in un protocollo di consulenza."]]],

{t:"Geschichte 1 – Im Büro: Die jährliche Kontrolle",s:"La parte burocratica in ufficio",p:[
 [["Im Januar bereitet Luiz die jährlichen Pflichten von Wertia vor.","A gennaio Luiz prepara gli obblighi annuali di Wertia."],
  ["Er kontrolliert, ob alle Berater ihre Weiterbildungsstunden gemacht haben.","Controlla se tutti i consulenti hanno fatto le loro ore di aggiornamento."],
  ["Diogo fehlen noch vier Stunden; Luiz meldet ihn für einen Kurs im Februar an.","A Diogo mancano ancora quattro ore; Luiz lo iscrive a un corso a febbraio."]],
 [["Dann prüft er, ob die Daten im FINMA-Register aktuell sind und die Berufshaftpflicht bezahlt ist.","Poi verifica che i dati nel registro FINMA siano aggiornati e che la RC professionale sia pagata."],
  ["Zum Schluss kontrolliert er stichprobenartig zehn Kundendossiers: Ist das Beratungsprotokoll unterschrieben?","Infine controlla a campione dieci dossier: il protocollo di consulenza è firmato?"],
  ["In zwei Dossiers fehlt die Unterschrift; Diogo kontaktiert die Kunden noch diese Woche.","In due dossier manca la firma; Diogo contatta i clienti ancora questa settimana."]]],

{t:"Geschichte 2 – Verkauf: Transparenz verkauft",s:"La vendita di un contratto",p:[
 [["Ein neuer Kunde fragt misstrauisch: «Was verdienen Sie an meinem Vertrag?»","Un nuovo cliente chiede diffidente: «Quanto guadagna lei sul mio contratto?»"],
  ["Luiz antwortet offen und zeigt das Informationsblatt nach Art. 45 VAG.","Luiz risponde apertamente e mostra il foglio informativo secondo l'art. 45 VAG."]],
 [["«Ich bin ungebunden und arbeite mit vielen Versicherungen. Die Versicherung bezahlt mir eine Provision; für Sie entstehen keine zusätzlichen Kosten», erklärt er.","«Sono indipendente e lavoro con molte assicurazioni. L'assicurazione mi paga una provvigione; per lei non ci sono costi aggiuntivi», spiega."],
  ["Dann zeigt er drei Offerten, auch eine mit tieferer Provision, wenn sie für den Kunden besser ist.","Poi mostra tre offerte, anche una con provvigione più bassa, se è migliore per il cliente."],
  ["Der Kunde ist überrascht von der Ehrlichkeit und unterschreibt.","Il cliente è sorpreso dall'onestà e firma."]]],

{t:"Geschichte 3 – Problem lösen: Die Beschwerde",s:"Come si risolve un problema",p:[
 [["Eine Kundin ist unzufrieden: Ihre Versicherung hat einen Schaden abgelehnt, und sie gibt Wertia die Schuld.","Una cliente è insoddisfatta: la sua assicurazione ha rifiutato un sinistro e lei dà la colpa a Wertia."],
  ["Sie schreibt eine wütende E-Mail und droht, sich bei der Ombudsstelle zu beschweren.","Scrive un'e-mail arrabbiata e minaccia di reclamare all'ufficio di mediazione."]],
 [["Luiz ruft sie am gleichen Tag an, hört zu und entschuldigt sich für den Ärger.","Luiz la chiama lo stesso giorno, ascolta e si scusa per il disagio."],
  ["Mit dem Beratungsprotokoll zeigt er, dass die Ausschlüsse besprochen und unterschrieben wurden.","Con il protocollo di consulenza mostra che le esclusioni sono state discusse e firmate."],
  ["Trotzdem prüft er den Fall neu und findet ein Argument, das die Versicherung übersehen hat.","Comunque riesamina il caso e trova un argomento che l'assicurazione non ha visto."],
  ["Nach seinem Brief bezahlt die Versicherung einen Teil des Schadens, und die Kundin bleibt bei Wertia.","Dopo la sua lettera l'assicurazione paga una parte del danno e la cliente resta da Wertia."]]],

C.ds={t:["Datenschutz – der komplette Kurs","Protezione dei dati – il corso completo"],ch:[
{t:"Das Datenschutzgesetz",s:"Le regole principali della nLPD",p:[
 [["Seit September 2023 gilt in der Schweiz das revidierte Datenschutzgesetz, das DSG.","Da settembre 2023 in Svizzera vale la legge sulla protezione dei dati riveduta, la LPD."],
  ["Es schützt Personendaten von natürlichen Personen.","Protegge i dati personali delle persone fisiche."],
  ["Gesundheitsdaten, Daten über Religion oder Strafverfahren sind besonders schützenswert.","Dati sanitari, dati sulla religione o su procedimenti penali sono particolarmente degni di protezione."]],
 [["Wer Daten bearbeitet, muss die betroffenen Personen informieren: welche Daten, zu welchem Zweck und an wen sie weitergegeben werden.","Chi tratta dati deve informare le persone interessate: quali dati, per quale scopo e a chi vengono trasmessi."],
  ["Jede Person hat ein Auskunftsrecht; die Antwort muss normalerweise innerhalb von 30 Tagen kommen.","Ogni persona ha un diritto d'accesso; la risposta deve arrivare di norma entro 30 giorni."],
  ["Bei schweren Verstössen drohen Bussen bis 250 000 Franken, und zwar gegen die verantwortliche Person selbst.","Per violazioni gravi si rischiano multe fino a 250 000 franchi, e proprio contro la persona responsabile."]]],
 box:{h:"Regole d'oro in un ufficio di consulenza",html:`<ul><li>Raccogliere solo i dati necessari.</li><li>Dati sanitari solo con consenso scritto.</li><li>Mandare documenti solo criptati o tramite portale.</li><li>Scrivania pulita, schermo bloccato.</li><li>Cancellare i dati quando non servono più.</li></ul>`},
 v:[["das Datenschutzgesetz (DSG)","legge sulla protezione dei dati"],["die Personendaten","dati personali"],["besonders schützenswert","particolarmente degno di protezione"],["die betroffene Person","persona interessata"],["weitergeben","trasmettere"],["das Auskunftsrecht","diritto d'accesso"],["der Verstoss","violazione"],["verantwortlich","responsabile"]]},
{t:"Geschichte 1 – Im Büro: Die Auskunftsanfrage",s:"La parte burocratica in ufficio",p:[
 [["Ein ehemaliger Kunde schreibt: «Welche Daten haben Sie über mich gespeichert?»","Un ex cliente scrive: «Quali dati avete salvato su di me?»"],
  ["Sara notiert das Datum der Anfrage, denn die Frist von 30 Tagen beginnt jetzt.","Sara annota la data della richiesta, perché il termine di 30 giorni inizia ora."]],
 [["Zuerst prüft sie die Identität des Kunden mit einer Ausweiskopie.","Prima verifica l'identità del cliente con una copia del documento."],
  ["Dann sucht sie im CRM, in den E-Mails und im Archiv alle Daten zu dieser Person.","Poi cerca nel CRM, nelle e-mail e nell'archivio tutti i dati di questa persona."],
  ["Sie stellt eine Liste zusammen: Kontaktdaten, Policen, Beratungsprotokolle und an welche Versicherungen Daten weitergegeben wurden.","Compila un elenco: dati di contatto, polizze, protocolli di consulenza e a quali assicurazioni sono stati trasmessi dati."],
  ["Nach zwölf Tagen schickt sie die Antwort eingeschrieben.","Dopo dodici giorni manda la risposta per raccomandata."]]],

{t:"Geschichte 2 – Verkauf: Vertrauen gewinnen",s:"La vendita di un contratto",p:[
 [["Frau Kälin will eine Spitalzusatzversicherung, aber sie zögert beim Gesundheitsfragebogen.","La signora Kälin vuole una complementare ospedaliera, ma esita davanti al questionario sanitario."],
  ["«Wer sieht meine Antworten?», fragt sie.","«Chi vede le mie risposte?», chiede."]],
 [["Luiz erklärt, dass nur der medizinische Dienst der Versicherung den Fragebogen liest und dass Wertia die Daten vertraulich behandelt.","Luiz spiega che solo il servizio medico dell'assicurazione legge il questionario e che Wertia tratta i dati in modo confidenziale."],
  ["Er zeigt die Einwilligungserklärung und erklärt jeden Punkt.","Mostra la dichiarazione di consenso e spiega ogni punto."],
  ["Frau Kälin fühlt sich sicher, beantwortet die Fragen ehrlich und unterschreibt den Antrag.","La signora Kälin si sente sicura, risponde sinceramente alle domande e firma la proposta."]]],
 v:[["zögern","esitare"],["der Gesundheitsfragebogen","questionario sanitario"],["der medizinische Dienst","servizio medico"],["vertraulich behandeln","trattare in modo confidenziale"],["die Einwilligungserklärung","dichiarazione di consenso"],["sich sicher fühlen","sentirsi sicuro"],["ehrlich","sinceramente"],["der Punkt","punto"]]},
{t:"Geschichte 3 – Problem lösen: Die falsche E-Mail",s:"Come si risolve un problema",p:[
 [["Diogo schickt aus Versehen eine Police mit Gesundheitsdaten an den falschen Kunden.","Diogo per errore manda una polizza con dati sanitari al cliente sbagliato."],
  ["Er merkt es fünf Minuten später.","Se ne accorge cinque minuti dopo."]],
 [["Er informiert sofort Luiz; die beiden verstecken nichts.","Informa subito Luiz; i due non nascondono niente."],
  ["Luiz ruft den falschen Empfänger an und bittet ihn, die E-Mail zu löschen und das schriftlich zu bestätigen.","Luiz chiama il destinatario sbagliato e gli chiede di cancellare l'e-mail e di confermarlo per iscritto."],
  ["Dann informiert er die betroffene Kundin offen und entschuldigt sich.","Poi informa apertamente la cliente interessata e si scusa."],
  ["Weil ein hohes Risiko bestehen könnte, prüft er auch, ob der Vorfall dem EDÖB gemeldet werden muss.","Poiché potrebbe esserci un rischio elevato, verifica anche se l'incidente deve essere notificato all'IFPDT."],
  ["Seitdem verschickt Wertia Gesundheitsdokumente nur noch über ein sicheres Portal.","Da allora Wertia invia documenti sanitari solo tramite un portale sicuro."]]],

C.firma={t:["Firmengründung – der komplette Kurs","Aprire un'azienda – il corso completo"],ch:[
{t:"Rechtsformen",s:"Ditta individuale, Sagl, SA",p:[
 [["Die häufigsten Rechtsformen in der Schweiz sind die Einzelfirma, die GmbH und die AG.","Le forme giuridiche più comuni in Svizzera sono la ditta individuale, la Sagl e la SA."],
  ["Die Einzelfirma ist einfach und günstig, aber der Inhaber haftet mit seinem ganzen Privatvermögen.","La ditta individuale è semplice ed economica, ma il titolare risponde con tutto il suo patrimonio privato."],
  ["Ab 100 000 Franken Umsatz muss sie im Handelsregister eingetragen werden.","Da 100 000 franchi di fatturato deve essere iscritta nel registro di commercio."]],
 [["Für eine GmbH braucht man mindestens 20 000 Franken Stammkapital, für eine AG 100 000 Franken Aktienkapital.","Per una Sagl servono almeno 20 000 franchi di capitale sociale, per una SA 100 000 franchi di capitale azionario."],
  ["Bei GmbH und AG haftet nur das Firmenvermögen, nicht das Privatvermögen.","In Sagl e SA risponde solo il patrimonio della società, non quello privato."],
  ["Die Gründung erfolgt mit einer öffentlichen Urkunde beim Notar und dem Eintrag ins Handelsregister.","La costituzione avviene con un atto pubblico dal notaio e l'iscrizione nel registro di commercio."]]],

{t:"Nach der Gründung",s:"AVS, IVA, assicurazioni per l'azienda",p:[
 [["Als Selbständige meldet man sich bei der AHV-Ausgleichskasse an und bezahlt die Sozialbeiträge selbst.","Come indipendente ci si iscrive alla cassa di compensazione AVS e si pagano i contributi sociali da sé."],
  ["Ab 100 000 Franken Umsatz pro Jahr ist man mehrwertsteuerpflichtig.","Da 100 000 franchi di fatturato annuo si è soggetti all'IVA."]],
 [["Mit Mitarbeitenden braucht die Firma eine Unfallversicherung nach UVG und eine Pensionskasse.","Con dipendenti l'azienda ha bisogno di un'assicurazione infortuni LAINF e di una cassa pensione."],
  ["Eine Krankentaggeldversicherung ist nicht obligatorisch, aber sehr empfehlenswert.","Un'assicurazione d'indennità giornaliera per malattia non è obbligatoria, ma è molto consigliabile."],
  ["Dazu kommen je nach Branche eine Betriebshaftpflicht, eine Sachversicherung und eine Cyberversicherung.","A seconda del settore si aggiungono una RC aziendale, un'assicurazione cose e un'assicurazione cyber."]]],

{t:"Geschichte 1 – Im Büro: Die GmbH gründen",s:"La parte burocratica in ufficio",p:[
 [["Paulo will eine Elektro-GmbH gründen, und Wertia hilft ihm bei den Formalitäten.","Paulo vuole costituire una Sagl di elettricità e Wertia lo aiuta con le formalità."],
  ["Sara erstellt eine Checkliste: Firmenname prüfen, Statuten vorbereiten, Kapitaleinzahlungskonto eröffnen.","Sara crea una checklist: verificare il nome della ditta, preparare lo statuto, aprire il conto di deposito del capitale."]],
 [["Paulo zahlt die 20 000 Franken auf das Sperrkonto ein, und die Bank stellt eine Bestätigung aus.","Paulo versa i 20 000 franchi sul conto bloccato e la banca rilascia una conferma."],
  ["Beim Notar unterschreibt er die Gründungsurkunde.","Dal notaio firma l'atto costitutivo."],
  ["Eine Woche später erscheint die Firma im Handelsamtsblatt.","Una settimana dopo la ditta appare nel Foglio ufficiale svizzero di commercio."],
  ["Sara meldet die Firma bei der Ausgleichskasse an und bestellt die Offerten für UVG und Betriebshaftpflicht.","Sara iscrive la ditta alla cassa di compensazione e richiede le offerte per LAINF e RC aziendale."]]],

{t:"Geschichte 2 – Verkauf: Das Versicherungspaket",s:"La vendita di un contratto",p:[
 [["Paulo hat jetzt zwei Mitarbeiter und fragt: «Welche Versicherungen brauche ich wirklich?»","Paulo ora ha due dipendenti e chiede: «Quali assicurazioni mi servono davvero?»"],
  ["Luiz macht eine Risikoanalyse des Betriebs.","Luiz fa un'analisi dei rischi dell'azienda."]],
 [["«Obligatorisch sind UVG und Pensionskasse. Sehr wichtig für einen Elektriker ist die Betriebshaftpflicht: Ein Kurzschluss kann ein ganzes Haus beschädigen.»","«Obbligatorie sono LAINF e cassa pensione. Molto importante per un elettricista è la RC aziendale: un cortocircuito può danneggiare una casa intera.»"],
  ["Er empfiehlt ausserdem eine Krankentaggeldversicherung, damit Paulo den Lohn bei langer Krankheit nicht selbst bezahlen muss.","Consiglia inoltre un'indennità giornaliera per malattia, così Paulo non deve pagare da sé il salario in caso di malattia lunga."],
  ["Paulo nimmt das Paket mit allen vier Versicherungen und bekommt einen Kombi-Rabatt.","Paulo prende il pacchetto con tutte e quattro le assicurazioni e ottiene uno sconto combinato."]]],

{t:"Geschichte 3 – Problem lösen: Die Rechnungen sind offen",s:"Come si risolve un problema",p:[
 [["Nach einem Jahr hat Paulos Firma Liquiditätsprobleme: Zwei Kunden bezahlen ihre Rechnungen nicht.","Dopo un anno la ditta di Paulo ha problemi di liquidità: due clienti non pagano le fatture."],
  ["Paulo kann deshalb die Quartalsprämie der Versicherungen nicht bezahlen.","Perciò Paulo non riesce a pagare il premio trimestrale delle assicurazioni."]],
 [["Luiz ruft ihn an, bevor die Mahnung kommt, und fragt nach der Situation.","Luiz lo chiama prima che arrivi il sollecito e chiede della situazione."],
  ["Er organisiert mit der Versicherung eine monatliche statt vierteljährliche Zahlung.","Organizza con l'assicurazione un pagamento mensile invece che trimestrale."],
  ["Gleichzeitig gibt er Paulo einen Tipp: Rechnungen mit kürzerer Zahlungsfrist schicken und bei grossen Aufträgen eine Anzahlung verlangen.","Allo stesso tempo dà a Paulo un consiglio: mandare fatture con termine di pagamento più breve e chiedere un acconto per i grandi lavori."],
  ["Die Versicherung bleibt aktiv, und Paulo hat wieder Luft.","L'assicurazione resta attiva e Paulo respira di nuovo."]]],

C.steuer={t:["Steuern und Bewilligung – der komplette Kurs","Imposte e permesso – il corso completo"],ch:[
{t:"Quellensteuer oder ordentliche Veranlagung?",s:"Chi paga come, secondo il permesso",p:[
 [["Ausländische Arbeitnehmende mit Bewilligung B bezahlen in der Regel Quellensteuer.","I lavoratori stranieri con permesso B pagano di regola l'imposta alla fonte."],
  ["Der Arbeitgeber zieht die Steuer direkt vom Lohn ab und überweist sie dem Steueramt.","Il datore di lavoro trattiene l'imposta direttamente dal salario e la versa all'ufficio delle imposte."],
  ["Personen mit Bewilligung C oder mit Schweizer Ehepartner füllen eine normale Steuererklärung aus.","Le persone con permesso C o con coniuge svizzero compilano una normale dichiarazione d'imposta."]],
 [["Wer mit Bewilligung B mehr als 120 000 Franken brutto im Jahr verdient, wird obligatorisch nachträglich ordentlich veranlagt.","Chi con permesso B guadagna più di 120 000 franchi lordi all'anno viene tassato obbligatoriamente in via ordinaria ulteriore."],
  ["Wer weniger verdient, kann die nachträgliche ordentliche Veranlagung bis zum 31. März des Folgejahres beantragen.","Chi guadagna meno può chiedere la tassazione ordinaria ulteriore entro il 31 marzo dell'anno successivo."],
  ["Das lohnt sich oft, wenn man Abzüge hat, zum Beispiel Säule 3a, Einkauf in die Pensionskasse oder hohe Fahrkosten.","Spesso conviene se si hanno deduzioni, per esempio pilastro 3a, riscatto nella cassa pensione o spese di trasporto elevate."],
  ["Achtung: Wer sich einmal dafür entscheidet, bleibt auch in den folgenden Jahren in der ordentlichen Veranlagung.","Attenzione: chi la sceglie una volta resta anche negli anni seguenti nella tassazione ordinaria."]]],

 v:[["die Quellensteuer","imposta alla fonte"],["überweisen","versare (bonifico)"],["die Steuererklärung","dichiarazione d'imposta"],["brutto","lordo"],["nachträglich ordentlich veranlagt","tassato in via ordinaria ulteriore"],["das Folgejahr","anno successivo"],["der Abzug, Abzüge","deduzione"],["sich entscheiden","decidere"]]},
{t:"Die wichtigsten Abzüge",s:"Cosa si può dedurre",p:[
 [["In der Steuererklärung kann man verschiedene Kosten vom Einkommen abziehen.","Nella dichiarazione si possono dedurre diversi costi dal reddito."],
  ["Dazu gehören Fahrkosten zur Arbeit, Verpflegung auswärts und Weiterbildungskosten.","Ne fanno parte le spese di trasporto per il lavoro, i pasti fuori casa e i costi di formazione continua."],
  ["Sehr wichtig sind die Einzahlungen in die Säule 3a und Einkäufe in die Pensionskasse.","Molto importanti sono i versamenti nel pilastro 3a e i riscatti nella cassa pensione."]],
 [["Familien können Kinderabzüge und Kosten für die Kinderbetreuung geltend machen.","Le famiglie possono far valere deduzioni per i figli e i costi per la custodia dei figli."],
  ["Auch Krankheitskosten, die man selbst bezahlt hat, sind abziehbar, wenn sie einen bestimmten Prozentsatz des Einkommens übersteigen.","Anche le spese di malattia pagate da sé sono deducibili, se superano una certa percentuale del reddito."],
  ["Für jeden Abzug braucht man Belege.","Per ogni deduzione servono giustificativi."]]],

{t:"Geschichte 1 – Im Büro: Die Steuererklärung vorbereiten",s:"La parte burocratica in ufficio",p:[
 [["Im Februar kommen viele Kunden mit Plastiktüten voller Papiere ins Büro.","A febbraio molti clienti arrivano in ufficio con sacchetti pieni di carte."],
  ["Sara sortiert die Unterlagen nach einer festen Liste: Lohnausweis, Kontoauszüge per 31. Dezember, 3a-Bescheinigung, Krankenkassenabrechnung.","Sara ordina i documenti secondo un elenco fisso: certificato di salario, estratti conto al 31 dicembre, attestato 3a, conteggio della cassa malati."]],
 [["Fehlt etwas, schreibt sie dem Kunden sofort eine E-Mail mit einer klaren Liste.","Se manca qualcosa scrive subito al cliente un'e-mail con un elenco chiaro."],
  ["Wenn die Frist bis 31. März zu knapp ist, beantragt sie online eine Fristverlängerung.","Se il termine del 31 marzo è troppo stretto, chiede online una proroga."],
  ["Am Schluss kontrolliert Luiz die Erklärung, und der Kunde unterschreibt.","Alla fine Luiz controlla la dichiarazione e il cliente firma."]]],

{t:"Geschichte 2 – Verkauf: Steuern sparen mit der Säule 3a",s:"La vendita di un contratto",p:[
 [["Bei der Steuererklärung sieht Luiz, dass Frau Duarte keine Säule 3a hat und viel Steuern bezahlt.","Facendo la dichiarazione Luiz vede che la signora Duarte non ha un pilastro 3a e paga molte tasse."],
  ["Sie hat die Bewilligung B und verdient 95 000 Franken.","Ha il permesso B e guadagna 95 000 franchi."]],
 [["Luiz erklärt die nachträgliche ordentliche Veranlagung und rechnet: Mit 7258 Franken in der Säule 3a würde sie etwa 1800 Franken Steuern zurückbekommen.","Luiz spiega la tassazione ordinaria ulteriore e calcola: con 7258 franchi nel pilastro 3a riavrebbe circa 1800 franchi di tasse."],
  ["Frau Duarte ist überrascht: «Das hat mir nie jemand gesagt.»","La signora Duarte è sorpresa: «Nessuno me l'ha mai detto.»"],
  ["Sie eröffnet ein 3a-Konto, und Luiz stellt den Antrag beim Steueramt vor dem 31. März.","Apre un conto 3a e Luiz presenta la domanda all'ufficio delle imposte prima del 31 marzo."]]],

{t:"Geschichte 3 – Problem lösen: Die hohe Nachzahlung",s:"Come si risolve un problema",p:[
 [["Herr Alves bekommt eine Steuerrechnung mit einer Nachzahlung von 4800 Franken und ist schockiert.","Il signor Alves riceve una fattura delle imposte con un conguaglio di 4800 franchi ed è scioccato."],
  ["Er ruft an: «Ich kann das nicht auf einmal bezahlen!»","Chiama: «Non posso pagarlo tutto in una volta!»"]],
 [["Sara kontrolliert zuerst die Veranlagung und findet einen Fehler: Der Abzug für die Kinderbetreuung fehlt.","Sara controlla prima la tassazione e trova un errore: manca la deduzione per la custodia dei figli."],
  ["Sie schreibt innerhalb von 30 Tagen eine Einsprache an das Steueramt.","Scrive entro 30 giorni un reclamo all'ufficio delle imposte."],
  ["Für den Rest beantragt sie eine Ratenzahlung.","Per il resto chiede un pagamento a rate."],
  ["Damit das nicht wieder passiert, empfiehlt sie Herrn Alves, jeden Monat einen Betrag für die Steuern auf ein separates Konto zu legen.","Perché non succeda di nuovo, consiglia al signor Alves di mettere ogni mese un importo per le tasse su un conto separato."]]],

C.reise={t:["Reiseversicherung – der komplette Kurs","Assicurazione viaggi – il corso completo"],ch:[
{t:"Was deckt eine Reiseversicherung?",s:"Annullamento, assistenza, spese di cura, bagaglio",p:[
 [["Eine Reiseversicherung besteht meistens aus mehreren Teilen.","Un'assicurazione viaggi è composta di solito da più parti."],
  ["Die Annullierungskostenversicherung bezahlt, wenn man eine Reise wegen Krankheit, Unfall oder Todesfall in der Familie nicht antreten kann.","L'assicurazione spese d'annullamento paga se non si può partire per malattia, infortunio o decesso in famiglia."],
  ["Die Assistance organisiert Hilfe im Ausland, zum Beispiel einen Rücktransport in die Schweiz.","L'assistance organizza aiuto all'estero, per esempio un rimpatrio in Svizzera."]],
 [["Die Grundversicherung der Krankenkasse bezahlt Notfälle im Ausland, aber höchstens das Doppelte der Kosten in der Schweiz.","L'assicurazione di base paga le emergenze all'estero, ma al massimo il doppio dei costi in Svizzera."],
  ["In Ländern wie den USA oder Kanada reicht das oft nicht.","In paesi come gli USA o il Canada spesso non basta."],
  ["Deshalb braucht man für solche Reisen eine Heilungskostenversicherung als Zusatz.","Per questo per questi viaggi serve un'assicurazione spese di cura come complemento."],
  ["Auf der Rückseite der Versichertenkarte steht die Europäische Krankenversicherungskarte.","Sul retro della tessera d'assicurato c'è la tessera europea d'assicurazione malattia."]]],
 box:{h:"Spiegazione: le parti di un'assicurazione viaggi",html:`<table><tr><th>Parte</th><th>Paga…</th></tr><tr><td>Annullierungskosten</td><td>spese se non parti (con certificato medico)</td></tr><tr><td>Assistance</td><td>rimpatrio, ricerca, rientro anticipato</td></tr><tr><td>Heilungskosten</td><td>spese mediche oltre la cassa malati</td></tr><tr><td>Reisegepäck</td><td>furto o danno al bagaglio</td></tr></table><p>Attenzione: le carte di credito includono spesso un'assicurazione, ma a volte solo se il viaggio è pagato con la carta.</p>`},
 v:[["die Annullierungskostenversicherung","assicurazione spese d'annullamento"],["eine Reise antreten","partire per un viaggio"],["die Assistance","assistenza"],["der Rücktransport","rimpatrio"],["die Heilungskosten","spese di cura"],["das Doppelte","il doppio"],["das Reisegepäck","bagaglio"],["die Versichertenkarte","tessera d'assicurato"]]},
{t:"Geschichte 1 – Im Büro: Die Annullierung",s:"La parte burocratica in ufficio",p:[
 [["Herr Meier hatte eine Reise nach Teneriffa gebucht, aber zwei Tage vorher bekommt er eine Lungenentzündung.","Il signor Meier aveva prenotato un viaggio a Tenerife, ma due giorni prima si prende una polmonite."],
  ["Er ruft bei Wertia an, und Sara übernimmt den Fall.","Chiama la Wertia e Sara prende in carico il caso."]],
 [["Sara erklärt, welche Dokumente die Versicherung braucht: die Buchungsbestätigung, die Annullierungsrechnung des Reisebüros und ein Arztzeugnis.","Sara spiega quali documenti servono all'assicurazione: la conferma di prenotazione, la fattura d'annullamento dell'agenzia e un certificato medico."],
  ["Wichtig ist, dass der Arzt bestätigt, dass Herr Meier nicht reisefähig ist.","È importante che il medico confermi che il signor Meier non è in grado di viaggiare."],
  ["Sara erfasst die Schadenmeldung online und lädt alle Unterlagen hoch.","Sara registra la notifica online e carica tutti i documenti."]],
 [["Nach drei Wochen kommt die Abrechnung: Die Versicherung bezahlt 2400 Franken zurück.","Dopo tre settimane arriva il conteggio: l'assicurazione rimborsa 2400 franchi."],
  ["Sara kontrolliert den Betrag, informiert den Kunden und schliesst den Fall im System ab.","Sara controlla l'importo, informa il cliente e chiude il caso nel sistema."]]],
 v:[["buchen","prenotare"],["die Lungenentzündung","polmonite"],["die Buchungsbestätigung","conferma di prenotazione"],["das Arztzeugnis","certificato medico"],["reisefähig","in grado di viaggiare"],["hochladen","caricare (file)"],["die Abrechnung","conteggio"],["einen Fall abschliessen","chiudere un caso"]]},
{t:"Geschichte 2 – Verkauf: Familie in die USA",s:"La vendita di un contratto",p:[
 [["Familie Costa plant drei Wochen Ferien in Kalifornien.","La famiglia Costa pianifica tre settimane di vacanza in California."],
  ["Die Mutter fragt Luiz, ob die Krankenkasse im Ausland genügt.","La madre chiede a Luiz se la cassa malati all'estero basta."]],
 [["Luiz erklärt: «Ein Tag im Spital in den USA kann über 10 000 Dollar kosten. Die Grundversicherung bezahlt nur einen kleinen Teil.»","Luiz spiega: «Un giorno d'ospedale negli USA può costare più di 10 000 dollari. L'assicurazione di base paga solo una piccola parte.»"],
  ["Er empfiehlt eine Jahres-Reiseversicherung für die ganze Familie mit Heilungskosten weltweit, Assistance und Annullierung.","Consiglia un'assicurazione viaggi annuale per tutta la famiglia con spese di cura in tutto il mondo, assistance e annullamento."],
  ["«Sie gilt für alle Reisen im Jahr, nicht nur für diese», sagt er.","«Vale per tutti i viaggi dell'anno, non solo per questo», dice."]],
 [["Die Familie vergleicht den Preis mit dem Wert der Reise und entscheidet sich sofort.","La famiglia confronta il prezzo con il valore del viaggio e decide subito."],
  ["Luiz schickt die Police per E-Mail und speichert die Notfallnummer der Assistance im Handy der Mutter.","Luiz manda la polizza per e-mail e salva il numero d'emergenza dell'assistance nel cellulare della madre."]]],
 v:[["die Ferien","le vacanze"],["genügen","bastare"],["die Jahres-Reiseversicherung","assicurazione viaggi annuale"],["weltweit","in tutto il mondo"],["gelten für","valere per"],["sich entscheiden","decidere"],["die Notfallnummer","numero d'emergenza"],["speichern","salvare"]]},
{t:"Geschichte 3 – Problem lösen: Unfall in Thailand",s:"Come si risolve un problema",p:[
 [["Paulo stürzt in Thailand mit einem Roller und bricht sich das Bein.","Paulo cade in Thailandia con uno scooter e si rompe la gamba."],
  ["Das Spital verlangt eine Garantie, bevor es operiert.","L'ospedale chiede una garanzia prima di operare."]],
 [["Paulo ruft die 24-Stunden-Nummer seiner Assistance an.","Paulo chiama il numero 24 ore della sua assistance."],
  ["Die Assistance schickt dem Spital direkt eine Kostengutsprache.","L'assistance invia direttamente all'ospedale una garanzia di pagamento."],
  ["Nach der Operation organisiert sie den Rückflug in die Schweiz mit einem Platz in der Business Class für das gestreckte Bein.","Dopo l'operazione organizza il volo di ritorno in Svizzera con un posto in business class per la gamba distesa."]],
 [["Zu Hause meldet Paulo den Unfall auch dem Arbeitgeber, weil die Unfallversicherung nach UVG zuständig ist.","A casa Paulo notifica l'infortunio anche al datore di lavoro, perché è competente l'assicurazione infortuni LAINF."],
  ["Die Lehre: Immer zuerst die Assistance anrufen, nicht selbst bezahlen.","La lezione: chiamare sempre prima l'assistance, non pagare da sé."]]],
 v:[["stürzen","cadere"],["sich das Bein brechen","rompersi la gamba"],["die Kostengutsprache","garanzia di pagamento"],["der Rückflug","volo di ritorno"],["gestreckt","disteso"],["zuständig","competente"],["die Lehre","la lezione"],["der Roller","scooter"]]},
{t:"Dialog: Gepäck verloren",s:"Al telefono con l'assistance",dlg:true,p:[
 {w:"Assistance",s:[["Reiseassistance, guten Tag. Wie kann ich helfen?","Assistance viaggi, buongiorno. Come posso aiutare?"]]},
 {w:"Kundin",s:[["Guten Tag. Ich bin in Lissabon gelandet, aber mein Koffer ist nicht angekommen.","Buongiorno. Sono atterrata a Lisbona, ma la mia valigia non è arrivata."]]},
 {w:"Assistance",s:[["Das ist ärgerlich. Haben Sie den Verlust schon am Flughafen gemeldet?","È seccante. Ha già denunciato la perdita all'aeroporto?"]]},
 {w:"Kundin",s:[["Ja, ich habe ein Formular bekommen, eine Verlustanzeige.","Sì, ho ricevuto un modulo, una denuncia di smarrimento."]]},
 {w:"Assistance",s:[["Sehr gut. Bewahren Sie es auf.","Molto bene. Lo conservi."],["Sie dürfen das Nötigste kaufen, zum Beispiel Kleider und Hygieneartikel.","Può comprare lo stretto necessario, per esempio vestiti e articoli d'igiene."]]},
 {w:"Kundin",s:[["Bis zu welchem Betrag?","Fino a che importo?"]]},
 {w:"Assistance",s:[["Das hängt von Ihrer Police ab; ich schaue nach.","Dipende dalla sua polizza; controllo."],["Bei Ihnen sind es bis zu 500 Franken. Bitte behalten Sie alle Quittungen.","Nel suo caso fino a 500 franchi. Per favore conservi tutte le ricevute."]]},
 {w:"Kundin",s:[["Perfekt, danke vielmals.","Perfetto, grazie mille."]]}],v:[]},

C.tier={t:["Tierversicherung – der komplette Kurs","Assicurazione animali – il corso completo"],ch:[
{t:"Tiere und Versicherungen",s:"Spese veterinarie, responsabilità civile, obblighi",p:[
 [["Ein Hund oder eine Katze kann hohe Tierarztkosten verursachen, zum Beispiel bei einer Operation.","Un cane o un gatto può causare spese veterinarie alte, per esempio con un'operazione."],
  ["Eine Tierversicherung bezahlt Behandlungen bei Krankheit und Unfall, meistens mit einem Selbstbehalt und einem Höchstbetrag pro Jahr.","Un'assicurazione animali paga le cure per malattia e infortunio, di solito con una franchigia e un importo massimo annuo."],
  ["Impfungen, Futter und Krankheiten, die schon vor Vertragsbeginn bestanden, sind normalerweise nicht gedeckt.","Vaccinazioni, cibo e malattie già esistenti prima del contratto di norma non sono coperti."]],
 [["Wenn ein Tier anderen Personen einen Schaden zufügt, zahlt die Privathaftpflichtversicherung.","Se un animale causa un danno ad altre persone, paga l'assicurazione di responsabilità civile privata."],
  ["Im Kanton Zürich und in vielen anderen Kantonen ist eine Haftpflichtversicherung für Hunde Pflicht.","Nel Canton Zurigo e in molti altri cantoni una responsabilità civile per i cani è obbligatoria."],
  ["Jeder Hund muss mit einem Mikrochip gekennzeichnet und in der Datenbank AMICUS registriert sein.","Ogni cane deve essere identificato con un microchip e registrato nella banca dati AMICUS."],
  ["Die Hundesteuer bezahlt man jedes Jahr der Wohngemeinde.","La tassa sui cani si paga ogni anno al comune di domicilio."]]],

 v:[["die Tierarztkosten","spese veterinarie"],["verursachen","causare"],["der Höchstbetrag","importo massimo"],["die Impfung","vaccinazione"],["die Privathaftpflichtversicherung","RC privata"],["kennzeichnen","identificare"],["die Datenbank","banca dati"],["die Hundesteuer","tassa sui cani"]]},
{t:"Geschichte 1 – Im Büro: Der neue Hund",s:"La parte burocratica in ufficio",p:[
 [["Frau Rossi hat einen Welpen gekauft und möchte ihn versichern.","La signora Rossi ha comprato un cucciolo e vuole assicurarlo."],
  ["Sara braucht zuerst ein paar Angaben: Rasse, Geburtsdatum, Mikrochipnummer und den Gesundheitsbericht des Tierarztes.","Sara ha prima bisogno di alcuni dati: razza, data di nascita, numero del microchip e il rapporto di salute del veterinario."]],
 [["Dann kontrolliert sie die Privathaftpflicht von Frau Rossi.","Poi controlla la RC privata della signora Rossi."],
  ["Hunde sind in der Police eingeschlossen, aber Sara schreibt der Versicherung, dass jetzt ein Hund im Haushalt lebt.","I cani sono inclusi nella polizza, ma Sara scrive all'assicurazione che ora in casa vive un cane."],
  ["Für die Gemeinde füllt sie mit der Kundin das Formular für die Hundeanmeldung aus.","Per il comune compila con la cliente il modulo d'iscrizione del cane."]],
 [["Am Ende hat Frau Rossi drei Dokumente: die Police der Tierversicherung, die Bestätigung der Haftpflicht und die Anmeldung bei der Gemeinde.","Alla fine la signora Rossi ha tre documenti: la polizza animali, la conferma della RC e l'iscrizione al comune."],
  ["Sara legt alles im Dossier ab.","Sara archivia tutto nel dossier."]]],
 v:[["der Welpe, -n","cucciolo"],["die Rasse","razza"],["das Geburtsdatum","data di nascita"],["der Gesundheitsbericht","rapporto di salute"],["eingeschlossen","incluso"],["der Haushalt","economia domestica, casa"],["die Hundeanmeldung","iscrizione del cane"],["die Bestätigung","conferma"]]},
{t:"Geschichte 2 – Verkauf: Lohnt sich das?",s:"La vendita di un contratto",p:[
 [["Herr Weber hat eine junge Katze und findet eine Tierversicherung zu teuer.","Il signor Weber ha un gatto giovane e trova l'assicurazione animali troppo cara."],
  ["Luiz fragt ihn: «Hätten Sie morgen 4000 Franken für eine Operation?»","Luiz gli chiede: «Avrebbe domani 4000 franchi per un'operazione?»"]],
 [["Herr Weber überlegt und sagt ehrlich: «Nicht sofort.»","Il signor Weber riflette e dice sinceramente: «Non subito.»"],
  ["Luiz zeigt zwei Varianten: nur Unfall für 12 Franken im Monat oder Unfall und Krankheit für 29 Franken.","Luiz mostra due varianti: solo infortunio per 12 franchi al mese oppure infortunio e malattia per 29 franchi."],
  ["Er erklärt, dass junge Tiere ohne Vorerkrankungen am einfachsten zu versichern sind.","Spiega che gli animali giovani senza malattie preesistenti sono i più facili da assicurare."]],
 [["Herr Weber wählt die Variante mit Krankheit und einem höheren Selbstbehalt, damit die Prämie tiefer ist.","Il signor Weber sceglie la variante con malattia e una franchigia più alta, così il premio è più basso."]]],
 v:[["überlegen","riflettere"],["ehrlich","sinceramente"],["die Variante","variante"],["die Vorerkrankung","malattia preesistente"],["am einfachsten","nel modo più facile"],["damit","affinché"],["zu teuer","troppo caro"],["sofort","subito"]]},
{t:"Geschichte 3 – Problem lösen: Der Biss im Park",s:"Come si risolve un problema",p:[
 [["Im Park springt Luna, der Hund von Ana, an einem Jogger hoch und beisst ihn in die Hand.","Nel parco Luna, il cane di Ana, salta addosso a un jogger e lo morde alla mano."],
  ["Der Mann muss zum Arzt und kann drei Tage nicht arbeiten.","L'uomo deve andare dal medico e non può lavorare per tre giorni."]],
 [["Ana tauscht sofort die Adressen mit ihm aus und meldet den Fall ihrer Privathaftpflicht.","Ana scambia subito gli indirizzi con lui e notifica il caso alla sua RC privata."],
  ["Weil ein Hundebiss gemeldet werden muss, informiert der Arzt auch das kantonale Veterinäramt.","Poiché un morso di cane deve essere segnalato, il medico informa anche l'ufficio veterinario cantonale."]],
 [["Die Haftpflicht bezahlt die Arztkosten und den Lohnausfall des Joggers.","La RC paga le spese mediche e la perdita di salario del jogger."],
  ["Das Veterinäramt verlangt einen Kurs für Ana und Luna, damit so etwas nicht mehr passiert.","L'ufficio veterinario richiede un corso per Ana e Luna, affinché non succeda più."]]],
 v:[["beissen / der Biss","mordere / il morso"],["hochspringen","saltare addosso"],["austauschen","scambiare"],["melden","segnalare"],["das Veterinäramt","ufficio veterinario"],["der Lohnausfall","perdita di salario"],["verlangen","richiedere"],["passieren","succedere"]]},
{t:"Dialog: Beim Tierarzt",s:"Una conversazione dal veterinario",dlg:true,p:[
 {w:"Tierärztin",s:[["Guten Tag, was fehlt Ihrem Hund?","Buongiorno, cos'ha il suo cane?"]]},
 {w:"Kunde",s:[["Er frisst seit zwei Tagen nichts und hat Bauchschmerzen.","Da due giorni non mangia e ha mal di pancia."]]},
 {w:"Tierärztin",s:[["Ich untersuche ihn. Wir müssen vielleicht ein Röntgenbild machen.","Lo visito. Forse dobbiamo fare una radiografia."]]},
 {w:"Kunde",s:[["Ist er versichert? Ja, bei einer Tierversicherung. Können Sie direkt abrechnen?","È assicurato? Sì, con un'assicurazione animali. Può fatturare direttamente?"]]},
 {w:"Tierärztin",s:[["Nein, Sie bezahlen die Rechnung und schicken sie der Versicherung.","No, lei paga la fattura e la manda all'assicurazione."]]},
 {w:"Kunde",s:[["In Ordnung. Können Sie mir einen Bericht für die Versicherung geben?","Va bene. Mi può dare un rapporto per l'assicurazione?"]]},
 {w:"Tierärztin",s:[["Natürlich, den bekommen Sie zusammen mit der Rechnung.","Certo, lo riceve insieme alla fattura."]]}],v:[]},

C.rs={t:["Rechtsschutz – der komplette Kurs","Tutela giuridica – il corso completo"],ch:[
{t:"Was ist eine Rechtsschutzversicherung?",s:"A cosa serve e cosa paga",p:[
 [["Eine Rechtsschutzversicherung hilft, wenn man einen rechtlichen Streit hat.","Un'assicurazione di tutela giuridica aiuta quando si ha una controversia legale."],
  ["Sie bezahlt zum Beispiel Anwaltskosten, Gerichtskosten, Gutachten und die Entschädigung an die Gegenpartei, wenn man verliert.","Paga per esempio spese d'avvocato, spese giudiziarie, perizie e l'indennità alla controparte se si perde."],
  ["Viele Fälle löst der Rechtsdienst der Versicherung selbst, oft schon am Telefon oder mit einem Brief.","Molti casi li risolve il servizio giuridico dell'assicurazione stesso, spesso già al telefono o con una lettera."]],
 [["Es gibt zwei Hauptbereiche: den Privatrechtsschutz und den Verkehrsrechtsschutz.","Ci sono due ambiti principali: la tutela giuridica privata e la tutela giuridica circolazione."],
  ["Der Privatrechtsschutz deckt zum Beispiel Streit mit dem Arbeitgeber, dem Vermieter, einem Verkäufer oder einer Versicherung.","La tutela privata copre per esempio liti con il datore di lavoro, il padrone di casa, un venditore o un'assicurazione."],
  ["Der Verkehrsrechtsschutz hilft nach einem Unfall, bei einem Führerausweisentzug oder beim Kauf eines Autos.","La tutela circolazione aiuta dopo un incidente, in caso di ritiro della patente o nell'acquisto di un'auto."]]],
 box:{h:"Spiegazione: privata e circolazione",html:`<table><tr><th>Privatrechtsschutz</th><th>Verkehrsrechtsschutz</th></tr><tr><td>Lavoro, affitto, acquisti, vicini, assicurazioni, pazienti</td><td>Incidenti, multe contestate, ritiro patente, compravendita auto</td></tr></table><p>Frase chiave: <i>«Mit einer Rechtsschutzversicherung müssen Sie aus Kostengründen nie auf Ihr Recht verzichten.»</i></p>`},
 v:[["der Rechtsstreit","controversia legale"],["die Anwaltskosten","spese d'avvocato"],["die Gerichtskosten","spese giudiziarie"],["das Gutachten, -","perizia"],["die Gegenpartei","controparte"],["der Rechtsdienst","servizio giuridico"],["der Führerausweisentzug","ritiro della patente"],["auf sein Recht verzichten","rinunciare al proprio diritto"]]},
{t:"Wichtige Regeln",s:"Periodo di carenza, scelta dell'avvocato, esclusioni",p:[
 [["Ein Streitfall ist nur gedeckt, wenn er nach dem Vertragsbeginn entstanden ist.","Una controversia è coperta solo se è nata dopo l'inizio del contratto."],
  ["Für einige Bereiche, zum Beispiel Vertragsrecht oder Arbeitsrecht, gibt es oft eine Wartefrist von drei Monaten.","Per alcuni ambiti, per esempio diritto contrattuale o del lavoro, c'è spesso un periodo di carenza di tre mesi."],
  ["Wer erst nach dem Streit eine Versicherung abschliesst, ist zu spät.","Chi stipula un'assicurazione solo dopo la lite arriva troppo tardi."]],
 [["Zuerst arbeitet der Rechtsdienst der Versicherung am Fall.","Prima lavora al caso il servizio giuridico dell'assicurazione."],
  ["Braucht es einen Prozess vor Gericht, darf man in der Regel den Anwalt frei wählen, die Versicherung muss aber zustimmen.","Se serve un processo in tribunale, di regola si può scegliere liberamente l'avvocato, ma l'assicurazione deve approvare."],
  ["Nicht gedeckt sind oft Scheidungen, Streit unter Erben und Bussen; die Busse selbst bezahlt man immer selbst.","Spesso non sono coperti divorzi, liti tra eredi e multe; la multa stessa la si paga sempre da sé."]]],
 box:{h:"Spiegazione: gli errori tipici del cliente",html:`<ul><li>Stipulare dopo che il problema è già nato → non coperto.</li><li>Incaricare un avvocato senza avvisare l'assicurazione → costi forse non rimborsati.</li><li>Pensare che la multa sia pagata → no, si pagano solo le spese di difesa.</li></ul>`},
