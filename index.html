{t:"Geschichte 1 – Im Büro: Eine Schadenmeldung",s:"La parte burocratica in ufficio",p:[
 [["Frau Lopes ruft im Büro an: Ihr Vermieter behält die Kaution von 3000 Franken.","La signora Lopes chiama in ufficio: il suo padrone di casa trattiene la cauzione di 3000 franchi."],
  ["Diogo nimmt den Anruf entgegen und notiert alle Angaben.","Diogo risponde alla chiamata e annota tutti i dati."]],
 [["Zuerst kontrolliert er im Dossier, seit wann Frau Lopes die Rechtsschutzversicherung hat.","Prima controlla nel dossier da quando la signora Lopes ha la tutela giuridica."],
  ["Der Vertrag läuft seit zwei Jahren, und der Streit ist erst jetzt entstanden: Der Fall ist gedeckt.","Il contratto è in corso da due anni e la lite è nata solo ora: il caso è coperto."],
  ["Diogo bittet die Kundin um den Mietvertrag, das Abnahmeprotokoll und die Briefe des Vermieters.","Diogo chiede alla cliente il contratto d'affitto, il verbale di riconsegna e le lettere del padrone di casa."]],
 [["Mit diesen Unterlagen füllt er online die Schadenmeldung bei der Versicherung aus.","Con questi documenti compila online la notifica del caso all'assicurazione."],
  ["Nach zwei Tagen bekommt er die Fallnummer und den Namen der zuständigen Juristin.","Dopo due giorni riceve il numero del caso e il nome della giurista competente."],
  ["Diogo informiert Frau Lopes und legt eine Kopie der Meldung im Dossier ab.","Diogo informa la signora Lopes e archivia una copia della notifica nel dossier."]]],
 v:[["die Kaution","cauzione"],["entgegennehmen","ricevere (una chiamata)"],["die Angaben","i dati"],["das Abnahmeprotokoll","verbale di riconsegna"],["die Fallnummer","numero del caso"],["zuständig","competente"],["die Juristin","giurista"],["gedeckt","coperto"]]},
{t:"Geschichte 2 – Verkauf: Warum Rechtsschutz?",s:"La vendita di un contratto",p:[
 [["Herr Ferreira ist Elektriker und hat gerade eine neue Stelle angefangen.","Il signor Ferreira è elettricista e ha appena iniziato un nuovo lavoro."],
  ["Bei der Analyse seiner Versicherungen sieht Luiz, dass er keine Rechtsschutzversicherung hat.","Analizzando le sue assicurazioni Luiz vede che non ha una tutela giuridica."]],
 [["Herr Ferreira sagt: «Ich brauche das nicht, ich habe nie Streit.»","Il signor Ferreira dice: «Non mi serve, non ho mai liti.»"],
  ["Luiz fragt: «Und wenn Ihr Arbeitgeber den Lohn nicht bezahlt oder Ihnen unfair kündigt?»","Luiz chiede: «E se il suo datore di lavoro non paga lo stipendio o la licenzia ingiustamente?»"],
  ["Er erklärt, dass ein Anwalt schnell 300 Franken pro Stunde kostet und ein Prozess mehrere tausend Franken.","Spiega che un avvocato costa facilmente 300 franchi all'ora e un processo diverse migliaia di franchi."]],
 [["Dann zeigt er eine Kombi-Lösung mit Privat- und Verkehrsrechtsschutz für die ganze Familie für rund 30 Franken pro Monat.","Poi mostra una soluzione combinata con tutela privata e circolazione per tutta la famiglia per circa 30 franchi al mese."],
  ["«Das ist weniger als eine Stunde beim Anwalt pro Jahr», sagt Luiz.","«È meno di un'ora d'avvocato all'anno», dice Luiz."],
  ["Herr Ferreira lacht und unterschreibt.","Il signor Ferreira ride e firma."],
  ["Luiz erinnert ihn an die Wartefrist von drei Monaten für das Arbeitsrecht.","Luiz gli ricorda il periodo di carenza di tre mesi per il diritto del lavoro."]]],
 v:[["die Stelle anfangen","iniziare un lavoro"],["kündigen","licenziare / disdire"],["unfair","ingiusto"],["die Kombi-Lösung","soluzione combinata"],["pro Stunde","all'ora"],["erinnern an","ricordare"],["mehrere tausend","diverse migliaia"],["für die ganze Familie","per tutta la famiglia"]]},
{t:"Geschichte 3 – Problem lösen: Das kaputte Handy",s:"Come si risolve un problema",p:[
 [["Ana kauft online ein Handy für 900 Franken.","Ana compra online un cellulare per 900 franchi."],
  ["Nach zwei Wochen funktioniert der Bildschirm nicht mehr, aber der Verkäufer antwortet nicht auf ihre E-Mails.","Dopo due settimane lo schermo non funziona più, ma il venditore non risponde alle sue e-mail."]],
 [["Ana meldet den Fall ihrer Rechtsschutzversicherung.","Ana notifica il caso alla sua tutela giuridica."],
  ["Die Juristin schreibt dem Verkäufer einen eingeschriebenen Brief und setzt eine Frist von zehn Tagen.","La giurista scrive al venditore una raccomandata e fissa un termine di dieci giorni."],
  ["Sie erklärt, dass Ana Anspruch auf Garantie hat.","Spiega che Ana ha diritto alla garanzia."]],
 [["Der Verkäufer reagiert sofort und bietet ein neues Gerät an.","Il venditore reagisce subito e offre un apparecchio nuovo."],
  ["Ana musste keinen Anwalt suchen und hat nichts bezahlt.","Ana non ha dovuto cercare un avvocato e non ha pagato nulla."],
  ["So sieht man: Oft genügt ein Brief eines Juristen, um ein Problem zu lösen.","Così si vede: spesso basta la lettera di un giurista per risolvere un problema."]]],
 v:[["kaputt","rotto"],["der Verkäufer","venditore"],["eine Frist setzen","fissare un termine"],["der Anspruch auf","diritto a"],["die Garantie","garanzia"],["reagieren","reagire"],["das Gerät, -e","apparecchio"],["genügen","bastare"]]},
{t:"Dialog: Die Kündigung",s:"Un cliente chiama dopo il licenziamento",dlg:true,p:[
 {w:"Berater",s:[["Wertia Finanz, guten Tag. Was kann ich für Sie tun?","Wertia Finanz, buongiorno. Cosa posso fare per lei?"]]},
 {w:"Kunde",s:[["Guten Tag, hier ist Silva. Mein Chef hat mir heute gekündigt.","Buongiorno, sono Silva. Il mio capo oggi mi ha licenziato."],["Ich glaube, das ist nicht korrekt.","Credo che non sia corretto."]]},
 {w:"Berater",s:[["Das tut mir leid. Haben Sie die Kündigung schriftlich bekommen?","Mi dispiace. Ha ricevuto il licenziamento per iscritto?"]]},
 {w:"Kunde",s:[["Ja, per Brief. Und ich war in den letzten Wochen krank.","Sì, per lettera. E nelle ultime settimane ero malato."]]},
 {w:"Berater",s:[["Das ist wichtig. Während einer Krankheit gibt es eine Sperrfrist.","Questo è importante. Durante una malattia c'è un periodo di protezione."],["Eine Kündigung in dieser Zeit kann ungültig sein.","Un licenziamento in questo periodo può essere nullo."]]},
 {w:"Kunde",s:[["Was soll ich jetzt machen?","Cosa devo fare adesso?"]]},
 {w:"Berater",s:[["Sie haben bei uns eine Rechtsschutzversicherung. Ich melde den Fall noch heute.","Lei ha da noi una tutela giuridica. Notifico il caso ancora oggi."],["Bitte schicken Sie mir die Kündigung und Ihr Arztzeugnis.","Mi mandi per favore il licenziamento e il suo certificato medico."]]},
 {w:"Kunde",s:[["Muss ich einen Anwalt suchen?","Devo cercare un avvocato?"]]},
 {w:"Berater",s:[["Nein, zuerst übernimmt der Rechtsdienst der Versicherung den Fall.","No, prima il servizio giuridico dell'assicurazione si occupa del caso."],["Unterschreiben Sie bis dahin nichts beim Arbeitgeber.","Fino ad allora non firmi niente dal datore di lavoro."]]},
 {w:"Kunde",s:[["Gut, vielen Dank für Ihre Hilfe.","Bene, grazie mille per il suo aiuto."]]}],v:[]},

C.vorsorge={t:["Vorsorge – die drei Säulen im Detail","Previdenza – i tre pilastri nel dettaglio"],ch:[
{t:"Das Drei-Säulen-System",s:"Come funziona la previdenza svizzera",p:[
 [["Die Altersvorsorge in der Schweiz steht auf drei Säulen.","La previdenza per la vecchiaia in Svizzera poggia su tre pilastri."],
  ["Die erste Säule ist die staatliche Vorsorge: AHV und IV.","Il primo pilastro è la previdenza statale: AVS e AI."],
  ["Sie soll im Alter den Existenzbedarf decken.","Deve coprire il fabbisogno vitale nella vecchiaia."]],
 [["Die zweite Säule ist die berufliche Vorsorge, also die Pensionskasse.","Il secondo pilastro è la previdenza professionale, cioè la cassa pensione."],
  ["Zusammen mit der AHV soll sie etwa 60 Prozent des letzten Lohnes ersetzen, damit man den gewohnten Lebensstandard halten kann.","Insieme all'AVS dovrebbe sostituire circa il 60 per cento dell'ultimo salario, così da mantenere il tenore di vita abituale."]],
 [["Die dritte Säule ist die private Vorsorge.","Il terzo pilastro è la previdenza privata."],
  ["Sie ist freiwillig und teilt sich in die gebundene Vorsorge, die Säule 3a, und die freie Vorsorge, die Säule 3b.","È facoltativa e si divide in previdenza vincolata, il pilastro 3a, e previdenza libera, il pilastro 3b."],
  ["Mit der dritten Säule schliesst man Vorsorgelücken und spart Steuern.","Con il terzo pilastro si colmano le lacune previdenziali e si risparmiano tasse."]]],
 box:{h:"Spiegazione: i tre pilastri",html:`<table><tr><th>Pilastro</th><th>Chi</th><th>Obiettivo</th><th>Finanziamento</th></tr><tr><td>1 · AHV/IV</td><td>Tutti</td><td>Fabbisogno vitale</td><td>Ripartizione: chi lavora paga le rendite di oggi</td></tr><tr><td>2 · BVG / Pensionskasse</td><td>Dipendenti sopra la soglia</td><td>Tenore di vita abituale</td><td>Capitalizzazione: ognuno risparmia il suo</td></tr><tr><td>3a / 3b</td><td>Facoltativo</td><td>Bisogni individuali</td><td>Risparmio privato</td></tr></table><p>Frase chiave: <i>«AHV und Pensionskasse zusammen ersetzen nur rund 60 Prozent Ihres Lohnes. Die Lücke schliessen wir mit der dritten Säule.»</i></p>`},
 v:[["die Altersvorsorge","previdenza per la vecchiaia"],["die Säule, -n","pilastro"],["der Existenzbedarf","fabbisogno vitale"],["die berufliche Vorsorge","previdenza professionale"],["der Lebensstandard","tenore di vita"],["gebunden / frei","vincolato / libero"],["die Vorsorgelücke","lacuna previdenziale"],["ersetzen","sostituire"]]},
{t:"Die 1. Säule: AHV und IV",s:"Contributi, rendita, lacune",p:[
 [["Wer in der Schweiz arbeitet, bezahlt AHV-, IV- und EO-Beiträge, zusammen 10,6 Prozent des Lohnes.","Chi lavora in Svizzera paga contributi AVS, AI e IPG, insieme il 10,6 per cento del salario."],
  ["Die Hälfte bezahlt der Arbeitgeber, die andere Hälfte wird vom Lohn abgezogen.","Metà la paga il datore di lavoro, l'altra metà viene trattenuta dal salario."],
  ["Selbständige bezahlen die Beiträge allein.","Gli indipendenti pagano i contributi da soli."]],
 [["Das Referenzalter für die AHV-Rente ist 65 Jahre, für Frauen und Männer.","L'età di riferimento per la rendita AVS è 65 anni, per donne e uomini."],
  ["Die volle Rente bekommt nur, wer seit dem 21. Altersjahr jedes Jahr Beiträge bezahlt hat, also 44 Jahre.","La rendita completa la riceve solo chi ha pagato contributi ogni anno dai 21 anni, cioè 44 anni."],
  ["Jedes fehlende Beitragsjahr reduziert die Rente um etwa 2,3 Prozent.","Ogni anno di contributi mancante riduce la rendita di circa il 2,3 per cento."],
  ["Wer erst mit 30 in die Schweiz kommt, hat deshalb eine Lücke.","Chi arriva in Svizzera solo a 30 anni ha perciò una lacuna."]],
 [["Die maximale Einzelrente liegt bei rund 2500 Franken pro Monat.","La rendita singola massima è di circa 2500 franchi al mese."],
  ["Ab Dezember 2026 gibt es zusätzlich einmal pro Jahr eine 13. AHV-Rente.","Da dicembre 2026 c'è in più una volta all'anno una 13ª rendita AVS."],
  ["Fehlende Beiträge kann man nur für die letzten fünf Jahre nachzahlen.","I contributi mancanti si possono pagare in ritardo solo per gli ultimi cinque anni."]]],
 box:{h:"Esempio: lacuna AVS",html:`<p>Cliente arrivato in Svizzera a 31 anni → mancano 10 anni di contributi → rendita ridotta di circa 10 × 2,3 % ≈ <b>23 %</b>.</p><p>Si può controllare con un <b>estratto del conto individuale (IK-Auszug)</b> della cassa di compensazione, gratuito.</p>`},
 v:[["der Beitrag, Beiträge","contributo"],["abziehen","trattenere"],["das Referenzalter","età di riferimento"],["die volle Rente","rendita completa"],["das Beitragsjahr","anno di contribuzione"],["die Einzelrente","rendita singola"],["nachzahlen","pagare in ritardo"],["der IK-Auszug","estratto del conto individuale"]]},
{t:"Die 2. Säule: die Pensionskasse",s:"BVG, accrediti di vecchiaia, libero passaggio, riscatto",p:[
 [["Ab einem Jahreslohn von rund 22 700 Franken ist man obligatorisch in der Pensionskasse des Arbeitgebers versichert.","A partire da un salario annuo di circa 22 700 franchi si è assicurati obbligatoriamente nella cassa pensione del datore di lavoro."],
  ["Arbeitgeber und Arbeitnehmer bezahlen Beiträge; der Arbeitgeber mindestens die Hälfte.","Datore di lavoro e lavoratore pagano contributi; il datore almeno la metà."],
  ["Jedes Jahr bekommt man eine Altersgutschrift auf sein Konto: je älter, desto höher, von 7 bis 18 Prozent des versicherten Lohnes.","Ogni anno si riceve un accredito di vecchiaia sul proprio conto: più si è anziani, più è alto, dal 7 al 18 per cento del salario assicurato."]],
 [["Bei der Pensionierung kann man eine Rente oder das Kapital beziehen, oder eine Mischung.","Al pensionamento si può prendere una rendita o il capitale, oppure una combinazione."],
  ["Im obligatorischen Teil beträgt der Umwandlungssatz 6,8 Prozent: Aus 100 000 Franken Kapital werden 6800 Franken Rente pro Jahr.","Nella parte obbligatoria l'aliquota di conversione è del 6,8 per cento: da 100 000 franchi di capitale si ottengono 6800 franchi di rendita all'anno."]],
 [["Wer die Stelle wechselt, nimmt sein Guthaben in die neue Pensionskasse mit.","Chi cambia lavoro porta il suo avere nella nuova cassa pensione."],
  ["Ohne neue Stelle kommt das Geld auf ein Freizügigkeitskonto oder eine Freizügigkeitspolice.","Senza nuovo lavoro i soldi vanno su un conto di libero passaggio o una polizza di libero passaggio."],
  ["Viele Menschen vergessen solche Konten; die Zentralstelle 2. Säule hilft, sie zu finden.","Molte persone dimenticano questi conti; l'Ufficio centrale del 2° pilastro aiuta a ritrovarli."],
  ["Mit einem freiwilligen Einkauf schliesst man Lücken in der Pensionskasse und kann den Betrag von den Steuern abziehen.","Con un riscatto volontario si colmano le lacune nella cassa pensione e si può dedurre l'importo dalle tasse."]]],
 box:{h:"Accrediti di vecchiaia (minimo LPP)",html:`<table><tr><th>Età</th><th class="n">Accredito</th></tr><tr><td>25–34</td><td class="n">7 %</td></tr><tr><td>35–44</td><td class="n">10 %</td></tr><tr><td>45–54</td><td class="n">15 %</td></tr><tr><td>55–65</td><td class="n">18 %</td></tr></table><p>Dopo un riscatto i soldi non si possono prelevare come capitale per 3 anni.</p>`},

{t:"Säule 3a: Warum und wie?",s:"Il pilastro 3a: perché farlo, vantaggi e svantaggi",p:[
 [["Die Säule 3a ist ein Vorsorgesparen mit Steuervorteil.","Il pilastro 3a è un risparmio previdenziale con vantaggio fiscale."],
  ["Wer ein AHV-pflichtiges Einkommen hat, darf jedes Jahr einen Maximalbetrag einzahlen und ihn vom steuerbaren Einkommen abziehen.","Chi ha un reddito soggetto all'AVS può versare ogni anno un importo massimo e dedurlo dal reddito imponibile."],
  ["Mit Pensionskasse sind es zurzeit 7258 Franken pro Jahr; ohne Pensionskasse bis zu 20 Prozent des Einkommens, höchstens 36 288 Franken.","Con cassa pensione sono attualmente 7258 franchi all'anno; senza cassa pensione fino al 20 per cento del reddito, al massimo 36 288 franchi."]],
 [["Je nach Einkommen und Wohnort spart man so jedes Jahr 1500 bis 2500 Franken Steuern.","A seconda del reddito e del domicilio si risparmiano così ogni anno da 1500 a 2500 franchi di tasse."],
  ["Seit 2026 kann man fehlende Einzahlungen ab dem Jahr 2025 nachträglich einzahlen, bis zu zehn Jahre zurück.","Dal 2026 si possono versare in un secondo momento i versamenti mancanti a partire dal 2025, fino a dieci anni indietro."]],
 [["Es gibt die Säule 3a bei der Bank und bei der Versicherung.","Il pilastro 3a esiste in banca e presso l'assicurazione."],
  ["Bei der Bank ist man flexibel: Man zahlt ein, wann und wie viel man will, auf ein Konto oder in Wertschriften.","In banca si è flessibili: si versa quando e quanto si vuole, su un conto o in titoli."],
  ["Bei der Versicherung kombiniert man das Sparen mit einem Risikoschutz bei Tod oder Erwerbsunfähigkeit, und mit der Prämienbefreiung wird weiter gespart, auch wenn man nicht mehr arbeiten kann.","Con l'assicurazione si combina il risparmio con una protezione in caso di decesso o incapacità di guadagno, e con l'esonero dai premi il risparmio continua anche se non si può più lavorare."],
  ["Dafür ist man an regelmässige Prämien gebunden, und in den ersten Jahren ist der Rückkaufswert tief.","In cambio si è vincolati a premi regolari, e nei primi anni il valore di riscatto è basso."]]],

{t:"Säule 3a: Wie bezieht man das Geld?",s:"Come si ritirano i soldi del 3a",p:[
 [["Das Geld der Säule 3a ist gebunden.","I soldi del pilastro 3a sono vincolati."],
  ["Normalerweise kann man es frühestens fünf Jahre vor dem Referenzalter beziehen, also ab 60.","Di norma si possono prelevare al più presto cinque anni prima dell'età di riferimento, cioè dai 60."],
  ["Wer weiterarbeitet, kann bis höchstens fünf Jahre nach dem Referenzalter einzahlen und den Bezug aufschieben.","Chi continua a lavorare può versare fino a cinque anni dopo l'età di riferimento e rinviare il prelievo."]],
 [["Einen Vorbezug gibt es nur aus bestimmten Gründen.","Un prelievo anticipato esiste solo per determinati motivi."],
  ["Dazu gehören der Kauf von selbstbewohntem Wohneigentum, die Amortisation der Hypothek, der Start in die Selbständigkeit, die definitive Auswanderung und eine ganze IV-Rente.","Tra questi l'acquisto di un'abitazione propria abitata da sé, l'ammortamento dell'ipoteca, l'avvio di un'attività indipendente, l'emigrazione definitiva e una rendita AI intera."]],
 [["Beim Bezug bezahlt man eine Kapitalleistungssteuer, getrennt vom übrigen Einkommen und zu einem reduzierten Satz.","Al prelievo si paga un'imposta sulle prestazioni in capitale, separata dal resto del reddito e ad aliquota ridotta."],
  ["Weil die Steuer progressiv ist, lohnt es sich, mehrere 3a-Konten zu eröffnen und sie in verschiedenen Jahren zu beziehen.","Poiché l'imposta è progressiva, conviene aprire più conti 3a e prelevarli in anni diversi."],
  ["Ein 3a-Konto kann man nur ganz beziehen, nicht teilweise.","Un conto 3a si può prelevare solo per intero, non in parte."]]],
 box:{h:"Esempio: prelievo scaglionato",html:`<p>Capitale 3a totale: 150 000 CHF.</p><ul><li>Un solo conto, prelevato a 64 anni → tutto nello stesso anno, aliquota più alta.</li><li>Tre conti da 50 000 CHF prelevati a 60, 62 e 64 anni → ogni prelievo tassato separatamente, aliquota più bassa → risparmio di qualche migliaio di franchi (dipende dal comune).</li></ul><p>Frase utile: <i>«Ich empfehle Ihnen, mehrere 3a-Konten zu eröffnen, damit Sie den Bezug später staffeln können.»</i></p>`},
 v:[["beziehen / der Bezug","prelevare / prelievo"],["frühestens","al più presto"],["aufschieben","rinviare"],["der Vorbezug","prelievo anticipato"],["selbstbewohnt","abitato da sé"],["die Amortisation der Hypothek","ammortamento dell'ipoteca"],["die Kapitalleistungssteuer","imposta sulle prestazioni in capitale"],["staffeln","scaglionare"]]},
{t:"Säule 3b: die freie Vorsorge",s:"Il pilastro 3b: flessibile, perché farlo, vantaggi e svantaggi",p:[
 [["Zur Säule 3b gehört jedes private Sparen: Sparkonto, Wertschriften, Immobilien und vor allem Lebensversicherungen.","Al pilastro 3b appartiene ogni risparmio privato: conto di risparmio, titoli, immobili e soprattutto assicurazioni sulla vita."],
  ["Es gibt keinen Maximalbetrag und keine Bindung bis zur Pensionierung.","Non c'è un importo massimo né un vincolo fino al pensionamento."],
  ["In den meisten Kantonen kann man die Einzahlungen nicht von den Steuern abziehen.","Nella maggior parte dei cantoni i versamenti non si possono dedurre dalle tasse."]],
 [["Eine gemischte Lebensversicherung in der Säule 3b verbindet Sparen und Todesfallschutz.","Un'assicurazione sulla vita mista nel pilastro 3b unisce risparmio e protezione in caso di decesso."],
  ["Die Begünstigung ist frei: Man kann zum Beispiel auch die Partnerin im Konkubinat begünstigen.","La designazione dei beneficiari è libera: si può per esempio favorire anche la partner convivente."],
  ["Die Auszahlung einer solchen Versicherung mit periodischen Prämien ist bei Erfüllung der Bedingungen einkommenssteuerfrei.","Il pagamento di una tale assicurazione con premi periodici, se sono rispettate le condizioni, è esente dall'imposta sul reddito."]],
 [["Nachteile sind die Kosten in den ersten Jahren und der tiefe Rückkaufswert bei einer frühen Kündigung.","Gli svantaggi sono i costi nei primi anni e il basso valore di riscatto in caso di disdetta anticipata."],
  ["Deshalb passt eine 3b-Police vor allem für Kunden, die lange sparen können und ihre Familie absichern wollen.","Perciò una polizza 3b è adatta soprattutto a clienti che possono risparmiare a lungo e vogliono proteggere la famiglia."]]],
 box:{h:"Confronto 3a e 3b",html:`<table><tr><th></th><th>3a</th><th>3b</th></tr><tr><td>Deduzione fiscale</td><td>Sì, fino al massimo</td><td>Di regola no</td></tr><tr><td>Importo massimo</td><td>Sì</td><td>No</td></tr><tr><td>Disponibilità</td><td>Vincolata (da 60 anni o eccezioni)</td><td>Libera</td></tr><tr><td>Beneficiari</td><td>Ordine fissato dalla legge</td><td>Liberi</td></tr><tr><td>Tassazione al pagamento</td><td>Imposta ridotta sul capitale</td><td>Polizza con premi periodici: di regola esente</td></tr></table>`},

{t:"Geschichte 1 – Im Büro: Das vergessene Freizügigkeitskonto",s:"La parte burocratica in ufficio",p:[
 [["Herr Santos hat vor acht Jahren bei einer Baufirma gearbeitet und weiss nicht mehr, wo sein Pensionskassengeld ist.","Il signor Santos otto anni fa lavorava in un'impresa edile e non sa più dove siano i suoi soldi della cassa pensione."],
  ["Diogo füllt mit ihm den Suchantrag für die Zentralstelle 2. Säule aus.","Diogo compila con lui la richiesta di ricerca per l'Ufficio centrale del 2° pilastro."]],
 [["Dafür braucht er die AHV-Nummer, eine Kopie des Ausweises und die Liste der früheren Arbeitgeber.","Per questo serve il numero AVS, una copia del documento d'identità e l'elenco dei datori di lavoro precedenti."],
  ["Herr Santos unterschreibt eine Vollmacht, damit Wertia in seinem Namen nachfragen darf.","Il signor Santos firma una procura, così Wertia può informarsi a suo nome."],
  ["Nach sechs Wochen kommt die Antwort: Es gibt ein Freizügigkeitskonto mit 23 400 Franken.","Dopo sei settimane arriva la risposta: c'è un conto di libero passaggio con 23 400 franchi."]],
 [["Diogo bestellt die Kontoauszüge und bespricht mit dem Kunden, wie das Geld besser angelegt werden kann.","Diogo ordina gli estratti conto e discute con il cliente come investire meglio i soldi."],
  ["Alle Schritte dokumentiert er im Beratungsprotokoll.","Documenta tutti i passi nel protocollo di consulenza."]]],
 v:[["der Suchantrag","richiesta di ricerca"],["die AHV-Nummer","numero AVS"],["der Ausweis","documento d'identità"],["die Vollmacht","procura"],["in seinem Namen","a suo nome"],["nachfragen","informarsi"],["anlegen","investire"],["dokumentieren","documentare"]]},
{t:"Geschichte 2 – Verkauf: Die erste Säule 3a",s:"La vendita di un contratto",p:[
 [["Carla ist 29, arbeitet als Pflegefachfrau und verdient 78 000 Franken im Jahr.","Carla ha 29 anni, lavora come infermiera e guadagna 78 000 franchi all'anno."],
  ["Sie sagt: «Für die Pensionierung habe ich noch Zeit.»","Dice: «Per la pensione ho ancora tempo.»"]],
 [["Luiz zeigt ihr ihre Steuerrechnung und rechnet: Mit 7258 Franken in der Säule 3a spart sie in Zürich rund 1600 Franken Steuern pro Jahr.","Luiz le mostra la sua fattura delle imposte e calcola: con 7258 franchi nel pilastro 3a a Zurigo risparmia circa 1600 franchi di tasse all'anno."],
  ["«Das ist wie eine Rendite von über 20 Prozent im ersten Jahr», sagt er.","«È come un rendimento di oltre il 20 per cento il primo anno», dice."],
  ["Dann zeigt er, was in 36 Jahren mit Zinseszins entstehen kann.","Poi mostra che cosa può nascere in 36 anni con l'interesse composto."]],
 [["Carla möchte flexibel bleiben.","Carla vuole restare flessibile."],
  ["Luiz empfiehlt deshalb eine Kombination: eine kleine 3a-Police mit Prämienbefreiung bei Erwerbsunfähigkeit und daneben ein 3a-Konto mit Wertschriften bei der Bank für freie Einzahlungen.","Luiz consiglia perciò una combinazione: una piccola polizza 3a con esonero dai premi in caso di incapacità di guadagno e accanto un conto 3a in titoli in banca per versamenti liberi."],
  ["Carla unterschreibt und plant, ab 2027 ein zweites 3a-Konto zu eröffnen, um den Bezug später zu staffeln.","Carla firma e pianifica di aprire dal 2027 un secondo conto 3a, per scaglionare il prelievo più avanti."]]],
 v:[["die Pflegefachfrau","infermiera"],["verdienen","guadagnare"],["die Steuerrechnung","fattura delle imposte"],["die Rendite","rendimento"],["der Zinseszins","interesse composto"],["flexibel bleiben","restare flessibile"],["daneben","accanto, in più"],["eröffnen","aprire (un conto)"]]},
{t:"Geschichte 3 – Problem lösen: Die Prämie ist zu hoch",s:"Il cliente non riesce più a pagare il premio",p:[
 [["Herr Oliveira hat vor drei Jahren eine 3b-Lebensversicherung mit 300 Franken im Monat abgeschlossen.","Il signor Oliveira tre anni fa ha stipulato un'assicurazione vita 3b da 300 franchi al mese."],
  ["Jetzt ruft er wütend an: «Das ist zu teuer, ich will kündigen!»","Ora chiama arrabbiato: «È troppo caro, voglio disdire!»"]],
 [["Luiz hört zuerst zu und fragt: «Was hat sich bei Ihnen verändert?»","Luiz prima ascolta e chiede: «Che cosa è cambiato per lei?»"],
  ["Herr Oliveira ist Vater geworden, und seine Frau arbeitet weniger.","Il signor Oliveira è diventato padre e sua moglie lavora meno."],
  ["Luiz erklärt ruhig: «Wenn Sie jetzt kündigen, bekommen Sie nur den Rückkaufswert, also deutlich weniger, als Sie eingezahlt haben.»","Luiz spiega con calma: «Se disdice adesso riceve solo il valore di riscatto, cioè molto meno di quanto ha versato.»"]],
 [["Er zeigt drei Möglichkeiten: eine Prämienpause von einigen Monaten, eine Reduktion der Prämie oder eine prämienfreie Police, bei der das Kapital bleibt.","Mostra tre possibilità: una pausa dei premi di alcuni mesi, una riduzione del premio o una polizza liberata dai premi, in cui il capitale resta."],
  ["Er erinnert ihn auch an den Todesfallschutz, der für die junge Familie jetzt wichtiger ist als vorher.","Gli ricorda anche la protezione in caso di decesso, che per la giovane famiglia ora è più importante di prima."],
  ["Herr Oliveira entscheidet sich, die Prämie auf 150 Franken zu reduzieren.","Il signor Oliveira decide di ridurre il premio a 150 franchi."],
  ["Luiz schickt den Änderungsantrag an die Versicherung und vereinbart einen Termin in einem Jahr.","Luiz manda la richiesta di modifica all'assicurazione e fissa un appuntamento fra un anno."]]],
 box:{h:"Come gestire «voglio disdire, è troppo caro»",html:`<ol><li>Ascoltare e chiedere il motivo: «Was hat sich verändert?»</li><li>Spiegare le conseguenze della disdetta (valore di riscatto, perdita della protezione).</li><li>Proporre alternative: pausa dei premi, riduzione, polizza liberata dai premi.</li><li>Ricordare l'obiettivo iniziale (famiglia, pensione).</li><li>Mettere per iscritto e fissare una verifica.</li></ol>`},
 v:[["wütend","arrabbiato"],["zuhören","ascoltare"],["sich verändern","cambiare"],["die Prämienpause","pausa dei premi"],["die Reduktion","riduzione"],["prämienfrei","liberato dai premi"],["der Änderungsantrag","richiesta di modifica"],["einzahlen","versare"]]},
{t:"Dialog: Beratung zur dritten Säule",s:"Consulenza completa sul 3° pilastro",dlg:true,p:[
 {w:"Berater",s:[["Frau Marti, haben Sie schon eine dritte Säule?","Signora Marti, ha già un terzo pilastro?"]]},
 {w:"Kundin",s:[["Nein. Ich weiss nicht genau, was der Unterschied zwischen 3a und 3b ist.","No. Non so bene qual è la differenza tra 3a e 3b."]]},
 {w:"Berater",s:[["Die Säule 3a ist gebunden, dafür können Sie die Einzahlungen von den Steuern abziehen.","Il 3a è vincolato, in cambio può dedurre i versamenti dalle tasse."],["Die Säule 3b ist frei, Sie können jederzeit über das Geld verfügen.","Il 3b è libero, può disporre dei soldi in qualsiasi momento."]]},
 {w:"Kundin",s:[["Und wann bekomme ich das Geld aus der 3a?","E quando ricevo i soldi del 3a?"]]},
 {w:"Berater",s:[["Frühestens fünf Jahre vor der Pensionierung, oder früher für eine eigene Wohnung oder wenn Sie die Schweiz verlassen.","Al più presto cinque anni prima del pensionamento, oppure prima per una casa propria o se lascia la Svizzera."]]},
 {w:"Kundin",s:[["Ich möchte vielleicht in fünf Jahren eine Wohnung kaufen.","Forse vorrei comprare un appartamento fra cinque anni."]]},
 {w:"Berater",s:[["Dann passt die 3a sehr gut: Sie sparen Steuern und können das Geld für das Eigenkapital vorbeziehen.","Allora il 3a va molto bene: risparmia tasse e può prelevare i soldi in anticipo per i fondi propri."]]},
 {w:"Kundin",s:[["Bank oder Versicherung?","Banca o assicurazione?"]]},
 {w:"Berater",s:[["Wenn Sie flexibel bleiben wollen, empfehle ich ein 3a-Konto mit Wertschriften bei der Bank.","Se vuole restare flessibile, le consiglio un conto 3a in titoli in banca."],["Für die Absicherung bei Erwerbsunfähigkeit schauen wir eine kleine Risikoversicherung an.","Per la protezione in caso di incapacità di guadagno guardiamo una piccola assicurazione di rischio."]]},
 {w:"Kundin",s:[["Das klingt gut. Können Sie mir eine Offerte machen?","Mi sembra buono. Mi può fare un'offerta?"]]},
 {w:"Berater",s:[["Gerne, ich schicke sie Ihnen bis Freitag.","Volentieri, gliela mando entro venerdì."]]}],v:[]},

function startP2(u,i=0){P2S={u,i,all:false,q:{}};openScreen();renderP2()}
function p2calc(){
  const c=Math.max(0,+(($("#p2ck")||{}).value)||0),f=+(($("#p2cf")||{}).value||300);
  const part=F=>{const fr=Math.min(c,F),sb=Math.min(Math.max(0,c-F)*.1,700);return{fr,sb,tot:fr+sb}};
  const r0=part(f),fmt=n=>Math.round(n).toLocaleString("de-CH");
  const rows=[300,500,1000,1500,2000,2500].map(F=>{const p=part(F),sv=.7*(F-300);return `<tr${F===f?' class="on"':""}><td>${F}</td><td class="n">${fmt(p.tot)}</td><td class="n">${fmt(sv)}</td><td class="n">${fmt(p.tot-sv)}</td></tr>`}).join("");
  const o=$("#p2cout");if(!o)return;
  o.innerHTML=`<div class="muted">${esc(t("youPay"))}</div><div class="p2big num">CHF ${fmt(r0.tot)}</div><p class="muted">${esc(t("fr"))} ${fmt(r0.fr)} + Selbstbehalt ${fmt(r0.sb)}${r0.sb>=700?" ("+esc(t("cap"))+")":""} · ${esc(t("kassePays"))} CHF ${fmt(Math.max(0,c-r0.tot))}</p>
  <button class="p2de" data-act="say" data-t="Sie bezahlen ${fmt(r0.fr)} Franken Franchise und ${fmt(r0.sb)} Franken Selbstbehalt, insgesamt ${fmt(r0.tot)} Franken." lang="de">${I("speaker")}<span>«Sie bezahlen ${fmt(r0.fr)} Franken Franchise und ${fmt(r0.sb)} Franken Selbstbehalt, insgesamt ${fmt(r0.tot)} Franken.»</span></button>
  <div class="p2tbl"><table><tr><th>${esc(t("fr"))}</th><th class="n">${esc(t("part"))}</th><th class="n">${esc(t("save"))}</th><th class="n">${esc(t("net"))}</th></tr>${rows}</table></div><p class="muted" style="font-size:.85rem">${esc(t("calcNote"))}</p>`;
}
function renderP2(){

}
const SYNC={mode:"local",ref:null,timer:null};
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(SYNC.ref){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushCloud,1200)}
}

async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    if(!user||!db)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get();
    if(snap.exists){const d=snap.data();if(d&&d.updatedAt>S.updatedAt&&typeof d.state==="string"){try{const tab=S.tab;S=Object.assign(defState(),JSON.parse(d.state));S.tab=tab;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}catch(e){}}}
    SYNC.ref=ref;SYNC.mode="cloud";
    if(!snap.exists||(snap.data()||{}).updatedAt<S.updatedAt)pushCloud();
    if(!L&&!R)render();

}

function dstr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- text checking ---------- */
const clean=(s)=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?¿¡;:«»"“”„]/g,"").replace(/\s+/g," ").trim();
const fold=(s)=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss");
const stripArt=(s)=>s.replace(/^(der|die|das|den|dem)\s+/,"");
const tokens=(s)=>s.replace(/[.,!?¿¡;:]/g,"").split(/\s+/).filter(Boolean);
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function judgeType(input,expected){
  const a=clean(input),b=clean(expected);
  const artA=/^(der|die|das|den|dem)\s/.exec(a),artB=/^(der|die|das)\s/.exec(b);
  if(artA&&artB&&artA[1]!==artB[1])return "no";
  const A=[a,stripArt(a)],B=[b,stripArt(b)];
  if(A.some(x=>B.includes(x)))return "ok";
  const fA=A.map(fold),fB=B.map(fold);
  if(fA.some(x=>fB.includes(x)))return "typo";
  if(fA.some(x=>fB.some(y=>y.length>=4&&lev(x,y)<=(y.length>=12?2:1))))return "typo";
  return "no";
}
function umlaut(s){const i=s.search(/au(?!.*[aou])/);if(i>=0)return s.slice(0,i)+"äu"+s.slice(i+2);const m=s.match(/[aou](?!.*[aou])/);if(!m)return null;const j=s.lastIndexOf(m[0]);return s.slice(0,j)+{a:"ä",o:"ö",u:"ü"}[m[0]]+s.slice(j+1)}
function pluralOpts(w){
  const n=noun(w).n,right=PL[n],u=umlaut(n);
  const stem=n.replace(/e$/,"");
  const cands=[n,n+"e",n+"en",n.endsWith("e")?n+"n":n+"n",n+"er",n+"s",stem+"en",u&&u+"e",u&&u+"er",u].filter(x=>x&&x!==right);
  const uniq=[...new Set(cands)];
  return shuffle([right,...shuffle(uniq).slice(0,3)]).map(x=>"die "+x);
}

/* ---------- lesson engine ---------- */
let L=null;
function poolWords(u){return UNITS.slice(0,u+1).flatMap(U=>U.words)}
function pickD(c,lang,n,u){
  const same=shuffle(UNITS[u].words.filter(x=>x!==c));
  const other=shuffle(poolWords(u).filter(x=>!UNITS[u].words.includes(x)));
  const out=[],seen=new Set([clean(c[lang])]);
  for(const x of [...same,...other]){const k=clean(x[lang]);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length>=n)break}
  return out;
}
const hasPl=(w)=>!!plural(w);
function makeLesson(u,l){
  const U=UNITS[u],ws=U.words,tts=ttsOK();
  const Ls=(c)=>tts?{type:"listen",c}:{type:"choice",c};
  if(l<2){const g=ws.slice(l*4,l*4+4);const ex=[{type:"reverse",c:g[0]},{type:"choice",c:g[1]},{type:"reverse",c:g[2]},{type:"choice",c:g[3]},{type:"pairs",cs:g},Ls(g[0]),{type:"type",c:g[1]},{type:"choice",c:g[2]},{type:"type",c:g[3]}];const g2=shuffle(extraHalf(U,l)).slice(0,4);if(g2.length>=4)ex.push({type:"reverse",c:g2[0]},{type:"choice",c:g2[1]},{type:"pairs",cs:g2},Ls(g2[2]),{type:"type",c:g2[3]});const pn=g.filter(hasPl);if(pn.length)ex.push({type:"plural",c:pick(pn),mode:"choice"});return ex}
  if(l===2){const ss=shuffle(U.sentences).slice(0,5);const ex=ss.map(s=>({type:"build",s}));ex.splice(2,0,{type:"pairs",cs:shuffle(ws).slice(0,5)});ex.push(Ls(pick(ws)),{type:"reverse",c:pick(ws)});return ex}
  const sw=shuffle(ws);
  const pls=shuffle(ws.filter(hasPl)).slice(0,4).map(c=>({type:"plural",c,mode:"type"}));
  const sts=storiesOf(u).flatMap(i=>STORIES[i].s).filter(x=>!/[«»]/.test(x[0]));if(sts.length)pls.push({type:"build",s:storyR(pick(sts))});
  return [{type:"pairs",cs:sw.slice(0,5)},...shuffle([{type:"type",c:sw[0]},{type:"type",c:sw[1]},...shuffle(U.sentences).slice(0,2).map(s=>({type:"build",s})),{type:"choice",c:pick(poolWords(u))},Ls(sw[3]),{type:"reverse",c:pick(poolWords(u))},...pls])];
}
function prep(e){
  if(e.type==="choice"||e.type==="listen")e.opts=shuffle([e.c,...pickD(e.c,"de",3,e.u??L.u)]);
  if(e.type==="reverse")e.opts=shuffle([e.c,...pickD(e.c,S.ui,3,e.u??L.u)]);
  if(e.type==="plural"&&e.mode==="choice"){e.popts=pluralOpts(e.c);e.val=""}
  if(e.type==="plural"&&e.mode!=="choice")e.val="";
  if(e.type==="build"){
    const tk=tokens(e.s.de),ans=new Set(tk.map(clean));
    const others=shuffle(UNITS.flatMap(U=>U.sentences).filter(s=>s!==e.s).flatMap(s=>tokens(s.de)));
    const d=[];for(const w of others){const k=clean(w);if(!ans.has(k)&&!d.some(x=>clean(x)===k))d.push(w);if(d.length>=3)break}
    e.bank=shuffle([...tk,...d]);e.chosen=[];
  }
  if(e.type==="pairs"){e.left=shuffle(e.cs);e.right=shuffle(e.cs);e.matched=[];e.sl=null;e.sr=null}
  if(e.type==="type")e.val="";
  L.sel=null;L.checked=false;L.ok=false;L.typo=false;L.played=false;
}
const clone=(e)=>({type:e.type,c:e.c,cs:e.cs,s:e.s,mode:e.mode,u:e.u});
function openScreen(){closeModal();document.body.style.overflow="hidden";$("#screen").hidden=false}
function startLesson(id){
  const [u,l]=id.split("-").map(Number);prefetch(u);
  const q=makeLesson(u,l);
  L={u,l,id,queue:q,idx:0,total:q.length,correct:0,mistakes:0,phase:"ex",xpBase:l===3?15:10};
  prep(q[0]);openScreen();renderLesson();
}
function startPlurals(){
  let pool=learnedList().map(x=>x).filter(x=>hasPl(x.w));
  if(pool.length<6)pool=ALLW.filter(x=>hasPl(x.w)&&x.u<=Math.max(1,(nextNode()||{u:UNITS.length-1}).u));
  const due=pool.filter(x=>(S.srs[x.w.de]||{}).w>0);
  const chosen=[...new Set([...shuffle(due),...shuffle(pool)])].slice(0,10);
  const q=chosen.map((x,i)=>({type:"plural",c:x.w,u:x.u,mode:i%3===2?"choice":"type"}));
  L={u:0,l:-1,id:null,queue:q,idx:0,total:q.length,correct:0,mistakes:0,phase:"ex",xpBase:10};
  prep(q[0]);openScreen();renderLesson();
}
function canCheck(e){if(e.type==="build")return e.chosen.length>0;if(e.type==="type"||(e.type==="plural"&&e.mode!=="choice"))return e.val.trim().length>0;if(e.type==="pairs")return false;return L.sel!=null}
function optCls(e,i){const isAns=e.opts[i]===e.c;if(L.checked){if(isAns)return "right";if(L.sel===i)return "wrongsel";return ""}return L.sel===i?"sel":""}
function optsHTML(e,lang){return `<div class="opts">${e.opts.map((o,i)=>`<button class="opt ${optCls(e,i)}" data-act="opt" data-i="${i}" ${lang==="de"?'lang="de"':""}><span class="k">${i+1}</span><span>${lang==="de"?deHTML(o.de):esc(o[lang])}</span></button>`).join("")}</div>`}
function charsHTML(){return `<div class="chars">${SPECIAL.map(c=>`<button data-act="char" data-c="${c}">${c}</button>`).join("")}</div>`}
function exView(e){

    case "listen":return `<h2 class="prompt">${esc(t("listen"))}</h2><div class="say-row"><button class="say big" data-act="say" data-t="${esc(e.c.de)}" aria-label="▶">${I("speaker")}</button><button class="slow" data-act="sayslow" data-t="${esc(e.c.de)}">${I("turtle")}${esc(t("slow"))}</button></div>${optsHTML(e,"de")}${L.checked?"":`<button class="skip-link" data-act="cantlisten">${esc(t("cantListen"))}</button>`}`;
    case "type":return `<h2 class="prompt">${esc(t("typeIn"))}</h2><div class="word-card"><span class="word-big">${esc(e.c[S.ui])}</span></div><input id="typein" class="type-in" lang="de" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(t("typePh"))}" value="${esc(e.val)}">${charsHTML()}`;
    case "plural":{
      const head=`<div class="tag">${esc(t("pluralT"))}</div><h2 class="prompt">${esc(e.mode==="choice"?t("pluralOf"):t("pluralType"))}</h2><div class="word-card"><button class="say" data-act="say" data-t="${esc(e.c.de)}" aria-label="▶">${I("speaker")}</button><div style="min-width:0"><span class="word-big" lang="de">${deHTML(e.c.de)}</span><div class="muted">${esc(e.c[S.ui])}</div></div></div>`;
      if(e.mode==="choice"){const right=plural(e.c);return head+`<div class="opts">${e.popts.map((o,i)=>`<button class="opt ${L.checked?(o===right?"right":L.sel===i?"wrongsel":""):L.sel===i?"sel":""}" data-act="opt" data-i="${i}" lang="de"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
      return head+`<input id="typein" class="type-in" lang="de" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="die …" value="${esc(e.val)}">${charsHTML()}<p class="muted" style="font-size:.88rem">${esc(t("pluralHint"))}</p>`}
    case "build":return `<h2 class="prompt">${esc(t("translate"))}</h2><div class="said">${esc(e.s[S.ui])}</div><div class="answer-line" lang="de">${e.chosen.map((bi,pos)=>`<button class="tile-w" data-act="unpick" data-p="${pos}">${esc(e.bank[bi])}</button>`).join("")}</div><div class="bank" lang="de">${e.bank.map((w,i)=>`<button class="tile-w ${e.chosen.includes(i)?"used":""}" data-act="pick" data-i="${i}" ${e.chosen.includes(i)?'tabindex="-1"':""}>${esc(w)}</button>`).join("")}</div>`;
    case "pairs":{
      const cell=(side,c,i)=>{const m=e.matched.includes(c);const sel=(side==="l"?e.sl:e.sr)===i;return `<button class="opt ${m?"matched":""} ${sel?"sel":""}" data-act="pair" data-side="${side}" data-i="${i}" ${side==="l"?'lang="de"':""}>${side==="l"?deHTML(c.de):esc(c[S.ui])}</button>`};

function footView(e){
  if(!L.checked){
    if(e.type==="pairs")return `<div class="foot-in"></div>`;
    return `<div class="foot-in"><span></span><button class="btn good" data-act="check" ${canCheck(e)?"":"disabled"}>${esc(t("check"))}</button></div>`;
  }
  const title=L.ok?pick(t("correct")):t("wrong");
  const sub=L.ok?(L.typo?`${esc(t("typo"))} <b>${esc(L.answer)}</b>`:(L.showAns?esc(L.answer):"")):esc(L.answer);
  return `<div class="foot-in"><div class="res"><span class="res-ic">${I(L.ok?"check":"x")}</span><div><h3>${esc(title)}</h3>${sub?`<p lang="de">${sub}</p>`:""}</div></div><button class="btn ${L.ok?"good":"bad"}" data-act="cont">${esc(t("cont"))}</button></div>`;
}
function renderLesson(){
  const el=$("#screen");

  <div class="l-body"><div class="l-inner ${L.checked?"locked":""}">${exView(e)}</div></div>
  <div class="l-foot ${L.checked?(L.ok?"ok":"ko"):""}" aria-live="polite">${footView(e)}</div>`;
  const inp=el.querySelector("#typein");if(inp&&!L.checked){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
  if(e.type==="listen"&&!L.played&&!L.checked){L.played=true;setTimeout(()=>speak(e.c.de),250)}

function refreshFoot(){const e=L.queue[L.idx];const f=$("#screen .l-foot");if(f)f.innerHTML=footView(e)}
function finish(ok,answer,extra={}){
  const e=L.queue[L.idx];
  L.checked=true;L.ok=ok;L.answer=answer;L.typo=!!extra.typo;L.showAns=!!extra.showAns;
  if(ok){L.correct++;sound("ok");const tgt=e.type==="build"?e.s.de:e.type==="plural"?plural(e.c):e.type==="choice"?e.c.de:null;if(tgt)speak(tgt)}
  else{L.mistakes++;L.queue.push(clone(e));if(e.c)markWrong(e.c);save();sound("ko")}
  renderLesson();
}
function check(){
  const e=L.queue[L.idx];if(L.checked||!canCheck(e))return;
  if(e.type==="choice"||e.type==="listen")return finish(e.opts[L.sel]===e.c,e.c.de,{showAns:e.type==="listen"});
  if(e.type==="reverse")return finish(e.opts[L.sel]===e.c,e.c[S.ui]);
  if(e.type==="plural"){const right=plural(e.c);if(e.mode==="choice")return finish(e.popts[L.sel]===right,right,{showAns:true});const r=judgeType(e.val,right);return finish(r!=="no",right,{typo:r==="typo",showAns:true})}

  if(e.type==="type"){const r=judgeType(e.val,e.c.de);return finish(r!=="no",e.c.de,{typo:r==="typo"})}
}

/* ---------- flashcard review ---------- */
let R=null;
function startReview(){
  let cards=dueList().sort((a,b)=>S.srs[a.w.de].b-S.srs[b.w.de].b).slice(0,15);
  if(!cards.length)cards=shuffle(learnedList()).slice(0,10);

}
function renderReview(){
  if(R.phase==="done")return renderDone();

  $("#screen").innerHTML=`<div class="l-head"><button class="icon-btn" data-act="exit" aria-label="${esc(t("close"))}">${I("x")}</button><div class="bar good"><i style="width:${pct}%"></i></div><span class="count num">${R.idx+1}/${R.cards.length}</span></div>

  ${R.shown?`<div class="ans"><div class="word-big">${esc(w[S.ui])}</div>${p?`<p class="muted" lang="de" style="margin-top:6px">${esc(t("pl"))}: <b>${esc(p)}</b></p>`:""}</div>`:""}</div></div></div>
  <div class="l-foot"><div class="foot-in">${R.shown?`<button class="btn bad" data-act="didnt" style="flex:1">${esc(t("didnt"))}</button><button class="btn good" data-act="knew" style="flex:1">${esc(t("knew"))}</button>`:`<button class="btn dark block" data-act="show">${esc(t("show"))}</button>`}</div></div>`;
  if(!R.shown)speak(w.de);
}
function grade(ok){
  const w=R.cards[R.idx],s=S.srs[w.de]||{b:0,due:dstr(),w:0};
  if(ok){if(!R.again.has(w.de)){s.b=Math.min(5,s.b+1);s.due=addDays(INT[s.b])}else s.due=addDays(1);sound("ok")}
  else{s.b=0;s.due=dstr();s.w=(s.w||0)+1;if(!R.again.has(w.de)){R.again.add(w.de);R.cards.push(w)}sound("ko")}
  S.srs[w.de]=s;R.n++;R.idx++;R.shown=false;save();
  if(R.idx>=R.cards.length){const xp=Math.min(15,5+Math.floor(R.n/2));gainXp(xp);R.phase="done";R.res={title:t("reviewDone"),xp,n:R.cards.length-R.again.size};save();sound("done")}
  renderReview();
}

  ST.cur=i;renderStory();

function kwRe(st){
  if(st._re!==undefined)return st._re;
  const terms=[];
  st.v.forEach(w=>{const m=noun(w);if(m){terms.push(m.n);if(PL[m.n])terms.push(PL[m.n])}else if(!/\s|\(/.test(w.de))terms.push(w.de)});
  terms.sort((a,b)=>b.length-a.length);
  st._re=terms.length?new RegExp("(?<![\\p{L}])("+terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\p{L}])","gu"):null;
  return st._re;
}
function markKw(text,st){const re=kwRe(st),h=esc(text);return re?h.replace(re,'<mark class="kw">$1</mark>'):h}

    <div class="st-list">${St.s.map((x,i)=>`${St.h&&St.h[i]?`<div class="st-sec">${esc(t("sec_"+St.h[i]))}</div>`:""}<button class="st-line ${ST.cur===i?"on":""}" data-act="stsay" data-i="${i}"><span class="n">${i+1}</span><span><span class="de" lang="de">${markKw(x[0],St)}</span>${ST.tr?`<span class="tr">${esc(x[k])}</span>`:""}</span></button>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">${esc(t("tapHint"))}</p></div></div>
    <div class="l-foot"><div class="foot-in"><button class="btn block" data-act="strep">${esc(t("repeatMode"))}</button></div></div>`;
    const on=$("#screen .st-line.on");if(on)on.scrollIntoView({block:"nearest"});
    return;
  }
  const x=St.s[ST.idx],pct=Math.round(ST.idx/n*100);
  $("#screen").innerHTML=`<div class="l-head"><button class="icon-btn" data-act="exit" aria-label="${esc(t("close"))}">${I("x")}</button><div class="bar good"><i style="width:${pct}%"></i></div><span class="count num">${ST.idx+1}/${n}</span></div>
  <div class="l-body"><div class="l-inner"><div class="tag">${esc(secAt(St,ST.idx)?t("sec_"+secAt(St,ST.idx)):St.t[0])} · ${esc(t("sentenceN",{a:ST.idx+1,b:n}))}</div>
  <div class="flash pop"><div class="say-row"><button class="say" data-act="say" data-t="${esc(x[0])}" aria-label="▶">${I("speaker")}</button><button class="slow" data-act="sayslow" data-t="${esc(x[0])}">${I("turtle")}${esc(t("slow"))}</button></div>
  <p class="rep-sent" lang="de">${markKw(x[0],St)}</p>${ST.tr?`<div class="ans"><p class="muted" style="font-size:1.05rem">${esc(x[k])}</p></div>`:""}</div>
  <div class="row" style="justify-content:center">${trBtn}</div><p class="muted" style="text-align:center;font-size:.92rem">${esc(t("repeatHint"))}</p></div></div>
  <div class="l-foot"><div class="foot-in"><button class="btn ghost" data-act="stagain" style="flex:1">${esc(t("again"))}</button><button class="btn good" data-act="stnext" style="flex:1">${esc(t("next"))}</button></div></div>`;
  setTimeout(()=>{if(ST&&ST.mode==="repeat")speak(x[0])},200);
}
function storyNext(){
  const n=STORIES[ST.u].s.length;
  if(ST.idx<n-1){ST.idx++;renderStory();$("#screen .l-body").scrollTop=0;return}
  const first=!S.stories[ST.u];S.stories[ST.u]=true;STORIES[ST.u].v.forEach(w=>{if(!S.srs[w.de])S.srs[w.de]={b:1,due:addDays(1),w:0}});const xp=first?10:5;gainXp(xp);
  ST.phase="done";ST.res={title:STORIES[ST.u].k==="case"?t("caseDone"):t("storyDone"),xp,n};save();sound("done");renderDone();
}

/* ---------- events ---------- */
document.addEventListener("click",(ev)=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  switch(a){
    case "tab":S.tab=b.dataset.tab;render();window.scrollTo(0,0);break;
    case "node":openModal(nodeSheet(b.dataset.id),"sm");break;
    case "guide":openModal(guideSheet(+b.dataset.u));break;
    case "pluralguide":openModal(pluralSheet());break;
    case "studystart":{const u=+b.dataset.u;const l=[0,1,2,3].find(l=>!S.done[u+"-"+l]);startLesson(u+"-"+(l==null?3:l));break}
    case "startlesson":startLesson(b.dataset.id);break;
    case "voicetest":speak("Grüezi, ich bin Ihre Stimme für den Deutschkurs.");break;
    case "review":startReview();break;
    case "story":startStory(+b.dataset.u,"vocab");break;
    case "stread":if(ST){ST.mode="read";renderStory();$("#screen .l-body").scrollTop=0}break;
    case "stvocab":if(ST){stopAudio();ST.mode="vocab";renderStory();$("#screen .l-body").scrollTop=0}break;
    case "storyrep":startStory(+b.dataset.u,"repeat");break;
    case "strep":if(ST){stopAudio();ST.mode="repeat";ST.idx=0;renderStory()}break;
    case "sttr":if(ST){ST.tr=!ST.tr;renderStory()}break;
    case "stplay":if(ST){if(ST.playing){stopAudio();renderStory()}else{ST.playing=true;playFrom(0)}}break;
    case "stsay":if(ST){stopAudio();ST.cur=+b.dataset.i;renderStory();speak(STORIES[ST.u].s[ST.cur][0])}break;
    case "stagain":if(ST)speak(STORIES[ST.u].s[ST.idx][0]);break;
    case "stnext":if(ST)storyNext();break;
    case "plurals":startPlurals();break;
    case "closemodal":closeModal();break;
    case "vfilter":VF=b.dataset.f;render();break;
    case "setui":S.ui=b.dataset.l;save();render();break;
    case "setgoal":S.goal=+b.dataset.g;save();render();break;
    case "sound":S.sound=b.dataset.v==="1";save();render();break;
    case "rate":S.rate=+b.dataset.v;save();render();speak("Guten Tag, wie geht es Ihnen?");break;
    case "reset":openModal(`<h2>${esc(t("reset"))}</h2><p class="muted">${esc(t("resetConfirm"))}</p><div class="actions"><button class="btn bad block" data-act="doreset">${esc(t("confirmReset"))}</button><button class="btn ghost block" data-act="closemodal">${esc(t("cancel"))}</button></div>`,"sm");break;
    case "doreset":{const ui=S.ui;S=defState();S.ui=ui;S.tab="profile";save();closeModal();render();break}
    case "quit":openModal(`<h2>${esc(t("quitTitle"))}</h2><p class="muted">${esc(t("quitBody"))}</p><div class="actions"><button class="btn block" data-act="closemodal">${esc(t("keep"))}</button><button class="btn ghost block" data-act="exit">${esc(t("quit"))}</button></div>`,"sm");break;
    case "exit":exitScreen();break;
    case "say":speak(b.dataset.t);break;
    case "sayslow":speak(b.dataset.t,.6);break;
    case "show":if(R){R.shown=true;renderReview()}break;
    case "knew":if(R)grade(true);break;
    case "didnt":if(R)grade(false);break;
    case "opt":if(L&&!L.checked){L.sel=+b.dataset.i;sound("tap");const e=L.queue[L.idx];if(e.type==="listen"||e.type==="choice")speak(e.opts[L.sel].de);if(e.type==="plural")speak(e.popts[L.sel]);renderLesson()}break;
    case "pick":if(L&&!L.checked){const e=L.queue[L.idx];const i=+b.dataset.i;if(!e.chosen.includes(i)){e.chosen.push(i);sound("tap");renderLesson()}}break;
    case "unpick":if(L&&!L.checked){const e=L.queue[L.idx];e.chosen.splice(+b.dataset.p,1);renderLesson()}break;
    case "char":if(L&&!L.checked){const inp=$("#typein");const e=L.queue[L.idx];const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(en);e.val=inp.value;inp.focus();inp.setSelectionRange(s+1,s+1);refreshFoot()}break;
    case "cantlisten":if(L&&!L.checked){L.queue.forEach(x=>{if(x.type==="listen")x.type="choice"});renderLesson()}break;
    case "pair":if(L&&!L.checked){
      const e=L.queue[L.idx],i=+b.dataset.i;
      if(b.dataset.side==="l"){e.sl=e.sl===i?null:i;speak(e.left[i].de)}else e.sr=e.sr===i?null:i;
      if(e.sl!=null&&e.sr!=null){
        if(e.left[e.sl]===e.right[e.sr]){e.matched.push(e.left[e.sl]);e.sl=e.sr=null;sound("tap");
          if(e.matched.length===e.cs.length){finish(true,"");return}
          renderLesson();
        }else{L.mistakes++;markWrong(e.left[e.sl]);sound("ko");const li=e.sl,ri=e.sr;e.sl=e.sr=null;renderLesson();
          document.querySelectorAll(`[data-act="pair"][data-side="l"][data-i="${li}"],[data-act="pair"][data-side="r"][data-i="${ri}"]`).forEach(x=>x.classList.add("shake"))}
      }else renderLesson();
    }break;
    case "check":check();break;
    case "cont":cont();break;
  }
});
document.addEventListener("change",(ev)=>{if(ev.target.id==="voicesel"){S.voice=ev.target.value;save();speak("Grüezi, ich bin Ihre Stimme für den Deutschkurs.")}});
try{if(ttsOK())speechSynthesis.addEventListener("voiceschanged",()=>{if(S.tab==="profile"&&!L&&!R&&!ST&&!document.activeElement?.closest?.("select"))render()})}catch(e){}
document.addEventListener("input",(ev)=>{
  if(ev.target.id==="typein"&&L){L.queue[L.idx].val=ev.target.value;const btn=$('#screen [data-act="check"]');if(btn)btn.disabled=!ev.target.value.trim()}
  if(ev.target.id==="vsearch"){VQ=ev.target.value;const v=$("#vlist");if(v)v.innerHTML=wordRows()}
});
document.addEventListener("keydown",(ev)=>{
  if(ev.key==="Escape"&&!$("#modal").hidden){closeModal();return}
  if(!$("#modal").hidden)return;
  if(ST&&ST.mode==="repeat"&&ST.phase!=="done"){
    if(ev.key==="Enter"||ev.key==="ArrowRight"){ev.preventDefault();storyNext()}
    else if(ev.key===" "){ev.preventDefault();speak(STORIES[ST.u].s[ST.idx][0])}
    return;
  }
  if(R&&R.phase!=="done"){
    if((ev.key===" "||ev.key==="Enter")&&!R.shown){ev.preventDefault();R.shown=true;renderReview()}
    else if(R.shown&&ev.key==="1")grade(false);
    else if(R.shown&&(ev.key==="2"||ev.key==="Enter")){ev.preventDefault();grade(true)}
    return;
  }
  if(!L||L.phase!=="ex")return;
  const e=L.queue[L.idx];
  if(ev.key==="Enter"){ev.preventDefault();if(L.checked)cont();else check();return}
  const n=(e.opts||e.popts||[]).length;
  if(!L.checked&&n&&/^[1-4]$/.test(ev.key)&&+ev.key<=n&&ev.target.tagName!=="INPUT"){L.sel=+ev.key-1;sound("tap");renderLesson()}
});
try{if(ttsOK())speechSynthesis.getVoices()}catch(e){}
loadLocal();
if(!UI_LANGS.includes(S.ui))S.ui="it";
if(!["home","course","words","profile"].includes(S.tab))S.tab="home";
render();
initCloud();
</script>
